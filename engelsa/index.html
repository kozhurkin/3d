am-arrow\" hidden title=\"Камера за пределами мини-вида\"><\\/i>';viewer.appendChild(inset);\nconst camArrow=inset.querySelector('.cam-arrow');\nconst insetCv=inset.querySelector('.inset-cv');\nconst insetR=new THREE.WebGLRenderer({canvas:insetCv,antialias:true});\ninsetR.setPixelRatio(Math.min(devicePixelRatio,2));insetR.outputEncoding=renderer.outputEncoding;insetR.toneMapping=renderer.toneMapping;insetR.toneMappingExposure=renderer.toneMappingExposure;insetR.shadowMap.enabled=true;\nconst distEl=inset.querySelector('.dist');let distTxt='';\n// the sun and the mini view follow the view on screen (views.js: aimView)\nlet sunHalf=4.6;   // half the side of the square the shadows cover, m\nfunction aimSun(x,y,z,half){\n  sun.target.position.set(x,y,z);sunHalf=half;\n  Object.assign(sun.shadow.camera,{left:-half,right:half,top:half,bottom:-half});sun.shadow.camera.updateProjectionMatrix();\n  placeSun();\n}\nconst camBtn=document.getElementById('camBtn');\ncamBtn.addEventListener('click',()=>{showDebug=!showDebug;camBtn.setAttribute('aria-expanded',showDebug);dbg.visible=showDebug;inset.hidden=!showDebug;viewer.classList.toggle('dbg-on',showDebug);});\n\nconst infoBtn=document.getElementById('infoBtn');\ninfoBtn.addEventListener('click',()=>infoBtn.setAttribute('aria-expanded',infoBtn.getAttribute('aria-expanded')!=='true'));\ndocument.addEventListener('keydown',e=>{if(e.key==='Escape')infoBtn.setAttribute('aria-expanded','false');});\n\n/* ---------- what a thing is: the cursor resting on something that knows it (userData.info on it or up its parents, or on its\n   part: {title, lines, and price (₽), url, shop if it is sold (or buy: a row for each product it is made of), next and variant if it has variants} or a function giving them) brings up an «i» by the cursor; a click on it opens a short card.\n   With the mouse in the views that orbit (the walk keeps the mouse to itself); the camera moving takes the «i» away ---------- */\nconst ITEM_REST=700,ITEM_GRACE=600;\nconst itemDot=document.getElementById('itemDot'),itemCard=document.getElementById('itemCard');\nlet itemTimer=null,itemHide=null,itemInfo=null,itemCam=null;\nfunction infoOf(o){\n  for(let n=0;o&&n<40;o=o.parent,n++){const u=o.userData;if(!u)continue;\n    for(const v of [u.info,u.part&&u.part.info]){const i=typeof v==='function'?v():v;if(i&&typeof i.title==='string')return i;}}\n  return null;\n}\nfunction hideItemDot(){clearTimeout(itemHide);itemHide=null;itemDot.hidden=true;itemInfo=null;}\nfunction closeItemCard(){itemCard.hidden=true;}\n// the «i» for info at x, y (px in the scene), a little up and right of the cursor, inside the scene\nfunction showItemDot(info,x,y){\n  clearTimeout(itemHide);itemHide=null;itemInfo=info;itemCam=camera.position.clone();\n  itemDot.style.left=Math.max(4,Math.min(viewer.clientWidth-28,x+10))+'px';itemDot.style.top=Math.max(4,Math.min(viewer.clientHeight-28,y-30))+'px';\n  itemDot.title=info.title;itemDot.hidden=false;\n}\nfunction itemHover(info,e){\n  clearTimeout(itemTimer);\n  if(info&&itemInfo&&info.title===itemInfo.title){clearTimeout(itemHide);itemHide=null;return;}   // still on it: the «i» stays where it came up\n  if(itemInfo&&!itemHide)itemHide=setTimeout(hideItemDot,ITEM_GRACE);   // time to reach the «i»\n  if(!info||!e)return;\n  const rc=viewer.getBoundingClientRect(),x=e.clientX-rc.left,y=e.clientY-rc.top;\n  itemTimer=setTimeout(()=>showItemDot(info,x,y),ITEM_REST);   // every move starts the wait again: it comes when the cursor rests\n}\nitemDot.addEventListener('pointerenter',()=>{clearTimeout(itemHide);itemHide=null;});\nitemDot.addEventListener('pointerleave',()=>{if(!itemDot.hidden)itemHide=setTimeout(hideItemDot,ITEM_GRACE);});\n// the card: the title and a few lines, next to the «i», inside the scene\nfunction openItemCard(info){\n  itemCard.innerHTML='';\n  const x=document.createElement('button');x.className='x';x.setAttribute('aria-label','Закрыть');x.textContent='×';x.addEventListener('click',closeItemCard);\n  const h=document.createElement('h3');h.textContent=info.title;itemCard.appendChild(x);itemCard.appendChild(h);\n  (info.lines||[]).forEach(t=>{const p=document.createElement('p');p.textContent=t;itemCard.appendChild(p);});\n  // a thing with variants (info.next: hangs the next one, gives its card; info.variant: [which, how many]): a line under the others,\n  // which of how many and a link to the next one; the card turns to it\n  if(typeof info.next==='function'){const p=document.createElement('p');p.className='next';\n    if(info.variant){const c=document.createElement('span');c.textContent=info.variant.join('/');p.appendChild(c);}\n    const b=document.createElement('button');b.className='lnk';b.textContent='Следующий вариант →';b.addEventListener('click',()=>openItemCard(info.next()));\n    p.appendChild(b);itemCard.appendChild(p);}\n  // its price (₽) and where to buy it (url), if it has them: a row under the lines, the link in a new tab; a thing made of several\n  // products has a row each (info.buy: [{name, price, url, shop, n — how many of it}]); more than one thing (rows, or n of one): the total under\n  // them. All in one block (buys), its columns one grid — names, prices, links — so the prices stand under each other\n  const rows=info.buy||(info.price||info.url?[info]:[]);\n  if(rows.length){const buys=document.createElement('div');buys.className='buys';\n    const row=(it,cls)=>{const r=document.createElement('div');r.className=cls;\n      if(it.name){const n=document.createElement('span');n.className='nm';n.textContent=it.name;r.appendChild(n);}\n      if(it.price){const b=document.createElement('b');b.textContent=(it.n>1?it.n+' × ':'')+it.price.toLocaleString('ru-RU')+' ₽';r.appendChild(b);}\n      if(it.url){const l=document.createElement('a');l.href=it.url;l.target='_blank';l.rel='noopener';l.textContent=it.shop||info.shop||'Купить';r.appendChild(l);}\n      buys.appendChild(r);};\n    rows.forEach((it,i)=>row(it,'buy'+(i?' more':'')));\n    if(rows.length>1||rows.some(it=>it.n>1))row({name:'Итого',price:rows.reduce((t,it)=>t+(it.n||1)*(it.price||0),0)},'buy total');\n    itemCard.appendChild(buys);}\n  itemCard.hidden=false;\n  const dx=parseFloat(itemDot.style.left)||0,dy=parseFloat(itemDot.style.top)||0,w=itemCard.offsetWidth||280,hh=itemCard.offsetHeight||120;\n  itemCard.style.left=Math.max(8,Math.min(viewer.clientWidth-w-8,dx))+'px';\n  itemCard.style.top=(dy+32+hh<viewer.clientHeight-8?dy+32:Math.max(8,dy-hh-8))+'px';\n  hideItemDot();\n}\nitemDot.addEventListener('click',()=>{if(itemInfo)openItemCard(itemInfo);});\ncanvas.addEventListener('pointerdown',()=>{clearTimeout(itemTimer);hideItemDot();closeItemCard();});\ncanvas.addEventListener('wheel',()=>{clearTimeout(itemTimer);hideItemDot();});\ndocument.addEventListener('keydown',e=>{if(e.key==='Escape'){hideItemDot();closeItemCard();}});\n\n/* ---------- render loop ---------- */\nconst preHooks=[];     // (dt) => void: before the camera moves (a flight between views advances here)\nconst frameHooks=[];   // (dt, ease) => void: walls, doors, labels… — called every frame after the camera has moved\n// the «i» belongs to where the cursor rested: the camera moving takes it away; another view takes the card away too\nlet itemView=null;\nframeHooks.push(()=>{\n  if(!itemDot.hidden&&itemCam&&camera.position.distanceTo(itemCam)>1e-4)hideItemDot();\n  if(view!==itemView){itemView=view;hideItemDot();closeItemCard();}\n});\nlet camDrive=null;     // while set, it places the camera instead of the easing toward the goal\nconst insetHide=[];    // objects kept out of the mini view (dimension labels are sized for the main camera)\n\n/* ---------- dimension labels, the plan's and the rooms': a white plate with the text over everything (or, depth, hidden behind\n   what stands in front). A label is h tall in the scene (m), but on screen no taller than LABEL_PX, and smaller than it can be\n   read it fades out: near it stays readable, far it shrinks with the model instead of covering it. fitLabels, every frame ---------- */\nconst LABEL_PX=22,LABEL_FADE=[6,8];   // px: gone at the first, whole from the second\nfunction dimLabel(text,h,depth=false){\n  const c=document.createElement('canvas'),g=c.getContext('2d'),f=44;\n  g.font=`500 ${f}px \"JetBrains Mono\", monospace`;const w=Math.ceil(g.measureText(text).width)+36;\n  c.width=w;c.height=f+26;g.font=`500 ${f}px \"JetBrains Mono\", monospace`;\n  g.fillStyle='rgba(255,255,255,.94)';const r=12;g.beginPath();g.moveTo(r,0);g.arcTo(w,0,w,c.height,r);g.arcTo(w,c.height,0,c.height,r);g.arcTo(0,c.height,0,0,r);g.arcTo(0,0,w,0,r);g.fill();\n  g.fillStyle=text.includes('?')?'#9a4d16':'#1f4a3f';g.textBaseline='middle';g.fillText(text,18,c.height/2+2);\n  const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;\n  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,depthTest:depth,transparent:true}));\n  s.renderOrder=20;s.userData.ar=w/c.height;s.userData.h=h;s.scale.set(h*s.userData.ar,h,1);return s;\n}\nconst _lv=new THREE.Vector3();\nfunction fitLabels(list){\n  const k=2*Math.tan(camera.fov*Math.PI/360)/(viewer.clientHeight||1);   // m per px at 1 m\n  list.forEach(s=>{const H=s.userData.h;if(typeof H!=='number')return;   // a label (the lines beside it are left alone)\n    const px=H/Math.max(1e-9,s.getWorldPosition(_lv).distanceTo(camera.position)*k),h=H*Math.min(1,LABEL_PX/px);   // its own height on screen, px\n    s.scale.set(h*s.userData.ar,h,1);s.material.opacity=Math.min(1,Math.max(0,(px-LABEL_FADE[0])/(LABEL_FADE[1]-LABEL_FADE[0])));});\n}\nconst _d=new THREE.Vector3();\nlet lastT=performance.now();\nfunction loop(){\n  const now=performance.now(),dt=Math.min(.1,(now-lastT)/1000);lastT=now;\n  // easing per second, not per frame: the same speed at 60 and 120 Hz (factors are per 1/120 s)\n  const ease=f=>reduce?1:1-Math.pow(1-f,dt*120);\n  preHooks.forEach(f=>f(dt));\n  if(camDrive)camDrive();\n  else{ const k=ease(.14);\n    cam.theta+=(goal.theta-cam.theta)*k;cam.phi+=(goal.phi-cam.phi)*k;cam.r+=(goal.r-cam.r)*k;\n    cam.target.lerp(goalT,k); }\n  const sp=Math.sin(cam.phi);\n  _d.set(sp*Math.sin(cam.theta),Math.cos(cam.phi),sp*Math.cos(cam.theta));\n  camera.position.copy(cam.target).addScaledVector(_d,cam.r);camera.lookAt(cam.target);camera.updateMatrixWorld();\n  frameHooks.forEach(f=>f(dt,ease));\n  if(showDebug)updateDebug();\n  renderer.render(scene,camera);\n  if(showDebug){\n    // the mini view has its own small canvas, so the frame can have properly rounded, clipped corners\n    const w=insetCv.clientWidth,h=insetCv.clientHeight;\n    if(w&&h){if(insetCv.width!==Math.round(w*insetR.getPixelRatio()))insetR.setSize(w,h,false);\n      ovCam.aspect=w/h;ovCam.updateProjectionMatrix();\n      const was=insetHide.map(o=>o.visible);insetHide.forEach(o=>o.visible=false);\n      insetR.render(scene,ovCam);\n      insetHide.forEach((o,i)=>o.visible=was[i]);}\n  }\n  requestAnimationFrame(loop);\n}\n\n<\/script>\n<script>\n/* ---------- the room in 3D: walls, window, door, the floor and the room's name ----------\n   Walls are built for the current view: only the walls flagged for it, hidden by its fade rules in the cut mode. */\n/* wall finishes, matte paint. \"white\" is the wall colour of the room tabs (follows the theme);\n   p: swatch colour when the scene colour does not show the paint itself (the lit white wall, not its base tone) */\nconst WALLC={\n  white:{n:'Белый',c:'--scene-wall',r:.95,p:'#F7F6F2'},\n  greige:{n:'Greige',c:'#C7BEB1',r:.9},\n  french:{n:'French Grey',c:'#B8B9A6',r:.9}\n};\nconst wallCol=w=>w.c.startsWith('--')?css(w.c):w.c;\nconst floorMat=new THREE.MeshStandardMaterial({roughness:.95});\n/* the faces the outlines lie on (walls, the room floors, the walk's ceiling) are set a hair back in depth:\n   a line along an inner corner lies on both faces exactly and would lose the depth test to them; on an outer corner it shows\n   only because half of it is past the wall's edge */\nconst BEHIND={polygonOffset:true,polygonOffsetFactor:1,polygonOffsetUnits:1};\nconst wallMat=new THREE.MeshStandardMaterial({roughness:.95,side:THREE.DoubleSide,...BEHIND});\n// the ceiling's colour (the walk's ceiling): white whatever the walls' paint is — the palette's «Белый», as the theme has it\nconst ceilColor=new THREE.Color();\nconst edgeMat=new THREE.LineBasicMaterial({color:0x4a4d50,transparent:true,opacity:.35});\n// how dark the walls' and doors' outlines are in a view: in «Контуры» (only the outlines of the walls) dark, else as «Контур стен» (one setting for every view)\nconst edgeOp=V=>V.Wm==='edges'?.9:S.edge?.5:0;\nconst winMat=new THREE.MeshStandardMaterial({color:0xf4f4f1,roughness:.5});\nconst glassMat=new THREE.MeshStandardMaterial({color:0x9fc3d4,roughness:.1,metalness:.1,transparent:true,opacity:.35,depthWrite:false});\nconst footMat=new THREE.MeshBasicMaterial({color:0x3b3d3f,polygonOffset:true,polygonOffsetFactor:-2});\nconst lowFootMat=new THREE.MeshBasicMaterial({color:0x5a5d60,polygonOffset:true,polygonOffsetFactor:-2});   // a low wall's footprint: a shade lighter, not quite a wall\nconst floor=new THREE.Mesh(new THREE.PlaneGeometry(30,30),floorMat);\nfloor.rotation.x=-Math.PI/2;floor.position.set(CX,-.002,CZ);floor.receiveShadow=true;scene.add(floor);   // the walls cast their shadows outside the room\n\n\n// take everything out of a group; its own materials and textures go too, shared ones stay (own=false)\nfunction emptyGroup(g,own=true){\n  g.children.slice().forEach(c=>{g.remove(c);c.traverse(o=>{if(o.geometry)o.geometry.dispose();\n    if(own&&o.material)[].concat(o.material).forEach(m=>{if(m.map)m.map.dispose();m.dispose();});});});\n}\n\n/* room floors and the names on them: rebuilt when the sizes change */\nconst roomGroup=new THREE.Group();scene.add(roomGroup);\nlet roomMats=[];\nconst roomPoly=r=>r.poly||[[r.r[0],r.r[2]],[r.r[1],r.r[2]],[r.r[1],r.r[3]],[r.r[0],r.r[3]]];   // the floor's outline [x,z]…\nconst polySigned=q=>q.reduce((s,a,i)=>{const b=q[(i+1)%q.length];return s+a[0]*b[1]-b[0]*a[1];},0)/2;   // mm², > 0 counter-clockwise in x,z\nconst polyArea=q=>Math.abs(polySigned(q));\n// a flat floor on an outline, lying at y 0\nconst polyFloorGeometry=q=>new THREE.ShapeGeometry(new THREE.Shape(q.map(p=>new THREE.Vector2(p[0]*MM,-p[1]*MM)))).rotateX(-Math.PI/2);\nconst roomArea=r=>`${(polyArea(roomPoly(r))/1e6).toFixed(2).replace('.',',')} м²`;\nconst roomCaption=r=>`${r.name} · ${roomArea(r)}`;\nfunction buildRooms(){\n  emptyGroup(roomGroup);emptyGroup(namesGroup);nameTexts.length=0;\n  roomMats=ROOMS.map(r=>{\n    const m=new THREE.MeshStandardMaterial({roughness:.9,...BEHIND});\n    const p=new THREE.Mesh(polyFloorGeometry(roomPoly(r)),m);p.receiveShadow=true;roomGroup.add(p);return m;});\n  ROOMS.forEach(r=>{const t=roomCaption(r);floorText(t,r.at[0],r.at[1],.153,t.length-roomArea(r).length);});   // the name and the floor area of the room (153 mm a line)\n}\n\n/* room names lying on the floor */\nconst namesGroup=new THREE.Group();scene.add(namesGroup);\nconst nameTexts=[];\nconst nameFont=f=>`400 ${f}px \"Tenor Sans\", Georgia, serif`;\n// the canvas is as wide as the text in the font as it is now: built before the web font has come, a name is measured in\n// the fallback, narrower one, and paintNames widens it (canvas and plane) once the font is there\nconst nameW=n=>{n.g.font=nameFont(n.f);return Math.ceil(n.g.measureText(n.text).width)+24;};\n// where the area part of a name lies across the texture (0..1), in the font as it is now\nconst areaSpan=n=>{n.g.font=nameFont(n.f);const w=n.c.width;return [(12+n.g.measureText(n.text.slice(0,n.cut)).width)/w,(12+n.g.measureText(n.text).width)/w];};\nfunction floorText(text,x,z,h,cut=0){   // cut: where the area starts in the text\n  const c=document.createElement('canvas'),g=c.getContext('2d'),f=96;\n  c.height=f+30;\n  const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=8;\n  const m=new THREE.Mesh(new THREE.PlaneGeometry(1,h),new THREE.MeshBasicMaterial({map:t,transparent:true,depthWrite:false}));\n  m.rotation.x=-Math.PI/2;m.position.set(x*MM,.004,z*MM);m.renderOrder=2;namesGroup.add(m);\n  nameTexts.push({c,g,t,m,h,text,f,cut});\n}\nfunction paintNames(){\n  const col=css('--fg');\n  nameTexts.forEach(n=>{\n    const w=nameW(n);\n    if(w!==n.c.width){n.c.width=w;n.t.dispose();n.m.scale.x=n.h*w/n.c.height;}   // a new size: the texture is made anew\n    n.g.clearRect(0,0,n.c.width,n.c.height);n.g.font=nameFont(n.f);\n    n.g.fillStyle=col;n.g.globalAlpha=.55;n.g.textBaseline='middle';n.g.fillText(n.text,12,n.c.height/2+4);n.t.needsUpdate=true;});\n}\nbuildRooms();\n\n\n/* ---------- walls ---------- */\nlet wallGroup=null, wallParts=[];   // {m: wall mesh, f: () => visible in \"cut\" mode}\nlet wallLines=[], linesTop=-1;      // {e: edge lines of a whole wall, w, f}; linesTop: cut height (mm) they are drawn for\nconst doors=[];                     // {g: hinge pivot, h: leaf height, t: target angle, a: angle, max, s: the way it turns (±1)}\nlet arcs=null;\n/* edges of a whole wall cut at height top (mm): outer corners, opening reveals and the cut top only.\n   The wall is built from boxes (pieces between openings, lintels, sills), but the joints between them are not drawn,\n   so a wall with a door or a window reads as one piece */\nfunction wallOutline(w,top){\n  const [x0,x1,z0,z1]=w.r,alongX=w.along;top=Math.min(top,w.h||H);   // a low wall ends at its own height\n  const [u0,u1,v0,v1]=alongX?[x0,x1,z0,z1]:[z0,z1,x0,x1];   // u along the wall, v across it\n  const s=[],P=(u,y,v)=>alongX?s.push(u*MM,y*MM,v*MM):s.push(v*MM,y*MM,u*MM);\n  const seg=(ua,ya,va,ub,yb,vb)=>{P(ua,ya,va);P(ub,yb,vb);};\n  const holes=w.holes||[];\n  // section of the wall at height y: its length minus the openings cut through at that height\n  const ring=(y,open)=>{let cur=u0;const iv=[];\n    holes.filter(open).sort((p,q)=>p[0]-q[0]).forEach(([a,b])=>{iv.push([cur,a]);cur=b;});iv.push([cur,u1]);\n    iv.forEach(([a,b])=>{if(b-a<1)return;seg(a,y,v0,b,y,v0);seg(a,y,v1,b,y,v1);seg(a,y,v0,a,y,v1);seg(b,y,v0,b,y,v1);});};\n  ring(0,([,,,sill=0])=>sill===0);\n  ring(top,([,,h,sill=0])=>sill<top&&top<=h);\n  [u0,u1].forEach(u=>[v0,v1].forEach(v=>seg(u,0,v,u,top,v)));\n  holes.forEach(([a,b,h,sill=0])=>{if(sill>=top)return;\n    const y1=Math.min(h,top),across=y=>{[v0,v1].forEach(v=>seg(a,y,v,b,y,v));seg(a,y,v0,a,y,v1);seg(b,y,v0,b,y,v1);};\n    [v0,v1].forEach(v=>{seg(a,sill,v,a,y1,v);seg(b,sill,v,b,y1,v);});   // jambs\n    if(h<top)across(h);if(sill>0)across(sill);});                        // head and sill of the opening\n  return s;\n}\n// the walls a view shows: its flagged walls, or all of them\nconst showsWall=(vw,w)=>vw.rooms==='all'||w.rooms.some(r=>vw.rooms.includes(r));\n/* the part of a wall inside the view's frame (walls and frames are rectangles along the axes); null when nothing is left.\n   along: the wall's direction, taken from the whole wall (a short cut piece must not turn across);\n   holes are cut with it, kept: the holes that are still whole (their doors and windows can show) */\nfunction clipWall(w,fr){\n  const along=(w.r[1]-w.r[0])>=(w.r[3]-w.r[2]),holes0=w.holes||[];\n  if(!fr)return {...w,along,holes:holes0,kept:holes0.map((h,i)=>i)};\n  const r=[Math.max(w.r[0],fr[0]),Math.min(w.r[1],fr[1]),Math.max(w.r[2],fr[2]),Math.min(w.r[3],fr[3])];\n  if(r[1]-r[0]<1||r[3]-r[2]<1)return null;\n  const [u0,u1]=along?[r[0],r[1]]:[r[2],r[3]],holes=[],kept=[];\n  holes0.forEach(([a,b,...rest],i)=>{const a1=Math.max(a,u0),b1=Math.min(b,u1);if(b1-a1<1)return;\n    holes.push([a1,b1,...rest]);if(a1===a&&b1===b)kept.push(i);});\n  return {...w,r,along,holes,kept};\n}\nlet holesShown=new Set();   // 'wallId:holeIndex' of the openings on screen whole: their doors show\nlet wallFeet=[];            // {m, id, box}: dark footprints of the wall pieces on the floor\n// the walls a view shows, cut by its frame: wall id → clipped wall\nfunction viewWalls(vw){\n  const fr=vw.frame?vw.frame():null,m=new Map();\n  WALLS.filter(w=>showsWall(vw,w)).forEach(w=>{const c=clipWall(w,fr);if(c)m.set(w.id,c);});\n  return m;\n}\n/* builds the given (clipped) walls: full-height pieces between openings, a lintel over each opening, a sill under a window,\n   their footprints, and the window when its opening is whole. Every piece keeps its wall id and its box on the plan (mm),\n   so a flight between views can cut it shorter and lower without new geometry. ruleOf: the cut-mode rule of a wall;\n   lines: the outline of every whole wall */\nfunction buildWallSet(list,ruleOf,lines){\n  if(wallGroup){scene.remove(wallGroup);wallGroup.traverse(o=>{if(o.geometry)o.geometry.dispose();});}\n  wallGroup=new THREE.Group();wallParts=[];wallLines=[];wallFeet=[];linesTop=-1;holesShown=new Set();\n  const solid=(id,x0,x1,y0,y1,z0,z1,f)=>{\n    const g=new THREE.BoxGeometry((x1-x0)*MM,(y1-y0)*MM,(z1-z0)*MM);\n    const m=new THREE.Mesh(g,wallMat);\n    m.position.set((x0+x1)/2*MM,(y0+y1)/2*MM,(z0+z1)/2*MM);m.castShadow=m.receiveShadow=true;\n    wallGroup.add(m);wallParts.push({m,f,id,box:[x0,x1,z0,z1],b:y0*MM,t:y1*MM,h:(y1-y0)*MM});\n  };\n  const foot=(id,x0,x1,z0,z1,mat)=>{const m=new THREE.Mesh(new THREE.PlaneGeometry((x1-x0)*MM,(z1-z0)*MM),mat);m.rotation.x=-Math.PI/2;m.position.set((x0+x1)/2*MM,.002,(z0+z1)/2*MM);m.renderOrder=1;wallGroup.add(m);wallFeet.push({m,id,box:[x0,x1,z0,z1]});};\n  list.forEach(w=>{\n    w.kept.forEach(i=>holesShown.add(w.id+':'+i));\n    const [x0,x1,z0,z1]=w.r,alongX=w.along,f=ruleOf(w),id=w.id,fm=w.h?lowFootMat:footMat;   // a low wall's footprint lighter\n    if(lines){const e=new THREE.LineSegments(new THREE.BufferGeometry(),edgeMat);e.raycast=()=>{};wallGroup.add(e);wallLines.push({e,w,f});}\n    // split the wall along its long side: full-height pieces between openings, a lintel over each opening\n    let cur=alongX?x0:z0;const end=alongX?x1:z1;\n    const piece=(a,b,y0,y1=w.h||H)=>{if(b-a<1)return;\n      if(alongX)solid(id,a,b,y0,y1,z0,z1,f);else solid(id,x0,x1,y0,y1,a,b,f);\n      if(y0===0){if(alongX)foot(id,a,b,z0,z1,fm);else foot(id,x0,x1,a,b,fm);}};\n    (w.holes||[]).forEach(([a,b,h,sill=0])=>{piece(cur,a,0);piece(a,b,h);if(sill>0)piece(a,b,0,sill);cur=b;});\n    piece(cur,end,0);\n  });\n  // the window: white frame in the middle of the wall's thickness, a mullion when it is wide, glass and an inner sill board; hides with its wall\n  if(holesShown.has('window:0')){ const w=WALLS.find(v=>v.id==='window'),f=ruleOf(w),FW=60,FD=70,zc=A.L+A.tW/2;\n    const x0=winX-A.winW/2,x1=winX+A.winW/2,y0=A.winS,y1=A.winT;\n    const part=(a,b,c,d,e,g,mat,shadow=true)=>{const m=new THREE.Mesh(new THREE.BoxGeometry((b-a)*MM,(d-c)*MM,(g-e)*MM),mat);\n      m.position.set((a+b)/2*MM,(c+d)/2*MM,(e+g)/2*MM);m.castShadow=shadow;m.receiveShadow=true;wallGroup.add(m);\n      wallParts.push({m,f,id:'window',box:[a,b,e,g],b:c*MM,t:d*MM,h:(d-c)*MM,glass:!shadow});};\n    const bar=(a,b,c,d)=>part(a,b,c,d,zc-FD/2,zc+FD/2,winMat);\n    bar(x0,x1,y0,y0+FW);bar(x0,x1,y1-FW,y1);bar(x0,x0+FW,y0+FW,y1-FW);bar(x1-FW,x1,y0+FW,y1-FW);\n    if(A.winW>=1200)bar(winX-FW/2,winX+FW/2,y0+FW,y1-FW);\n    part(x0+FW,x1-FW,y0+FW,y1-FW,zc-4,zc+4,glassMat,false);\n    part(x0-50,x1+50,y0-10,y0+20,A.L-50,zc-FD/2-1,winMat); }   // sill board top sits above the wall opening, so the two faces never coincide (no z-fighting)\n  scene.add(wallGroup);\n  // doors and their swings show with their whole openings\n  doors.forEach(d=>{const on=holesShown.has(d.hole);d.g.visible=on;if(d.frame)d.frame.visible=on;});\n  if(arcs)arcs.children.forEach(l=>{l.visible=holesShown.has(l.userData.hole);});\n}\n// the walls of a view at rest: exact pieces, outlines, its cut-mode rules\nfunction buildWalls(vw){dropMorph();buildWallSet([...viewWalls(vw).values()],w=>fadeRule(w,vw),true);}\n\n/* ---------- a flight between views ----------\n   The walls of both views at once. How each wall looks is taken twice: at the start, as it is on screen (the old view's\n   wall mode and cut-mode rules, the camera where it is), and at the end, as the new view will show it (the camera where\n   the flight ends). In between nothing is decided per frame: a wall only goes from its rect and height to the new ones —\n   up from the floor, down into it, shorter or longer — so nothing pops or blinks on the way. A wall hidden at both ends\n   stays hidden. Pieces are built for the span of both rects and cut to the current one by scale, like the cut height;\n   at the end the new view's walls are built exactly */\nlet morph=null;   // {w: id → {rF,rT,cF,cT,hF,hT,exT,kept}, e, opF,opT, lnF,lnT, doors, mats: id → own materials}\n// is a wall seen by the camera at c (m) under its cut-mode rule: the camera must be on the room's side of its face\nconst sideVisible=(side,r,c)=>!side||({'-x':c.x>r[1],'+x':c.x<r[0],'-z':c.z>r[3],'+z':c.z<r[2]})[side];\n// a view's walls at rest with the camera at pos: id → {r, cut: the height it shows (0: hidden), h: its height for the doors, kept}.\n// A door whose opening is whole stands at the view's height even when its wall is hidden by the cut mode; one that is not\n// there goes with its wall (up from the floor or down into it)\nfunction wallsAtRest(id,pos){\n  const vw=VIEWS[id],V=VS[id],m=new Map();\n  const h=V.Wm==='feet'?0:V.Wm==='row'?H*.1:H*V.Wh/100;\n  viewWalls(vw).forEach((c,k)=>{\n    const seen=V.Wm!=='auto'||sideVisible(fadeSide(c,vw),fadeWall(c,vw).r.map(v=>v*MM),pos),cut=seen?h:0;\n    m.set(k,{r:c.r,cut,h:c.kept.length?h:cut,kept:c.kept});});\n  return m;\n}\n// a wall of the flight at progress e: its rect (mm), the height it shows and the height its doors are cut at (mm)\nfunction morphWall(s,e){return {r:s.rF&&s.rT?s.rF.map((v,i)=>v+(s.rT[i]-v)*e):(s.rF||s.rT),cut:s.cF+(s.cT-s.cF)*e,h:s.hF+(s.hT-s.hF)*e};}\n// the walls on screen now: a new flight starts from here, even in the middle of another one\nfunction wallsNow(){\n  if(!morph)return wallsAtRest(view,camera.position);\n  const m=new Map();\n  morph.w.forEach((s,id)=>{const n=morphWall(s,morph.e);m.set(id,{r:n.r,cut:n.cut,h:n.h,kept:s.kept});});\n  return m;\n}\n// the walls of a flight have their own materials (they fade by themselves); they go with the flight\nfunction dropMorph(){\n  if(!morph)return;\n  morph.mats.forEach(m=>Object.values(m).forEach(x=>x.dispose()));\n  morph=null;\n}\n/* a door in a flight shows as at rest: while its opening is whole in its wall's rect on the way (and whole at one end\n   of the flight at least); its height goes with the wall (wallsAtRest: h) */\nfunction doorInFlight(d,at){\n  const [id,i]=d.hole.split(':'),s=morph.w.get(id);\n  if(!s||!s.kept.includes(+i))return false;\n  const c=clipWall(WALLS.find(v=>v.id===id),at(id).r);\n  return !!c&&c.kept.includes(+i);\n}\n// pos: where the camera ends the flight (m)\nfunction startWallMorph(from,toId,pos){\n  const to=wallsAtRest(toId,pos),w=new Map(),list=[],V=VS[toId];\n  new Set([...from.keys(),...to.keys()]).forEach(id=>{\n    const F=from.get(id),T=to.get(id),a=(F||T).r,b=(T||F).r;\n    const c=clipWall(WALLS.find(v=>v.id===id),[Math.min(a[0],b[0]),Math.max(a[1],b[1]),Math.min(a[2],b[2]),Math.max(a[3],b[3])]);\n    if(!c)return;\n    // an opening whole in either view keeps its door or window while its wall is there\n    const kept=new Set([...(F?F.kept:[]),...(T?T.kept:[])]);c.kept=c.kept.filter(i=>kept.has(i));\n    list.push(c);\n    w.set(id,{rF:F?F.r:null,rT:T?T.r:null,cF:F?F.cut:0,cT:T?T.cut:0,hF:F?F.h:0,hT:T?T.h:0,exT:!!T,kept:c.kept});\n  });\n  const doorsF=doorGroup.visible;   // as on screen now\n  dropMorph();buildWallSet(list,()=>()=>true,true);\n  // every wall of the flight gets its own materials: near the floor it fades away instead of leaving a dark slab,\n  // its footprint fades out or in, its outline fades with its height\n  const mats=new Map();\n  list.forEach(c=>mats.set(c.id,{body:wallMat.clone(),line:edgeMat.clone(),foot:(c.h?lowFootMat:footMat).clone()}));\n  wallParts.forEach(p=>{const m=mats.get(p.id);if(m&&p.m.material===wallMat)p.m.material=m.body;});\n  wallLines.forEach(l=>{l.e.material=mats.get(l.w.id).line;});\n  wallFeet.forEach(p=>{p.m.material=mats.get(p.id).foot;});\n  // the walls' see-through and their outlines go from how they look now to the new view's mode (in «Контуры» they are see-through)\n  const edgesOnly=V.Wm==='edges';\n  morph={w,e:0,opF:wallMat.opacity,opT:edgesOnly?0:1,lnF:edgeMat.opacity,lnT:edgeOp(V),\n    doors:doorsF&&V.dm!=='none'&&V.Wm!=='feet',mats};   // doors show only if both ends show them\n}\n// a piece cut to the rect r (mm) along x and z by scale; false when nothing of it is left. flat: a footprint (its z is its local y)\n// Works while walls are plain colour: a textured wall (tiles) would stretch, its pieces would have to be rebuilt instead.\nfunction fitBox(m,box,r,flat){\n  const x0=Math.max(box[0],r[0]),x1=Math.min(box[1],r[1]),z0=Math.max(box[2],r[2]),z1=Math.min(box[3],r[3]);\n  if(x1-x0<.5||z1-z0<.5)return false;\n  m.scale.x=(x1-x0)/(box[1]-box[0]);m.scale[flat?'y':'z']=(z1-z0)/(box[3]-box[2]);\n  m.position.x=(x0+x1)/2*MM;m.position.z=(z0+z1)/2*MM;return true;\n}\n/* \"cut\" mode: a wall hides while the camera is on its side named by the view's fade ('-x': past its -x face, …).\n   A room view hides, besides, every wall while the camera is on its side away from the room's floor;\n   the plan hides only the walls it names. A wall named with another wall's id has no rule of its own: it hides with that one */\nconst fadeWall=(w,vw)=>{const n=(vw.fade||{})[w.id];return n&&!/^[+-][xz]$/.test(n)?WALLS.find(v=>v.id===n):w;};\nfunction fadeSide(w,vw){\n  const o=fadeWall(w,vw);if(o!==w)return fadeSide(o,vw);\n  const named=(vw.fade||{})[w.id];\n  if(named||!Array.isArray(vw.rooms))return named;\n  const rm=ROOMS.find(r=>r.id===vw.rooms[0]).r,r=w.r;\n  return r[3]<=rm[2]?'-z':r[2]>=rm[3]?'+z':r[1]<=rm[0]?'-x':r[0]>=rm[1]?'+x':null;\n}\nfunction fadeRule(w,vw){const r=fadeWall(w,vw).r.map(v=>v*MM),side=fadeSide(w,vw);return side?()=>sideVisible(side,r,camera.position):()=>true;}\n\n\n/* the door: a 10 mm lining through the wall round the opening (two jambs, the head between them), the leaf in it, its room face\n   flush with the wall's; hinged at the right jamb (seen from the room), it opens into the room. Casings CW on both faces of the wall\n   over the lining's ends (flush with its inner faces), jambs to the head, the head over them (white, as the leaf);\n   a white square lever handle on each face. CW, CT, LT: apartment.js */\nconst leafMat=new THREE.MeshStandardMaterial({color:0xf1efea,roughness:.6});\nconst doorHandleMat=new THREE.MeshStandardMaterial({color:0xf7f7f5,roughness:.3});   // the door's handles: white\nconst doorGroup=new THREE.Group();scene.add(doorGroup);\nfunction door(px,pz,size,pos,mat,max){\n  const g=new THREE.Group();g.position.set(px*MM,0,pz*MM);\n  const m=new THREE.Mesh(new THREE.BoxGeometry(...size.map(v=>v*MM)),mat);m.position.set(...pos.map(v=>v*MM));m.castShadow=m.receiveShadow=true;\n  m.add(new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry),edgeMat));\n  g.add(m);doorGroup.add(g);const d={g,h:size[1]*MM,t:0,a:0,max,s:1};doors.push(d);return d;\n}\nconst doorParts=[];          // every door box (leaves, handles, casings) is cut at the wall height like the walls, never squashed;\n                             // a part marked whole (userData.whole: its top, m) shows only while the wall reaches it\n/* a square lever handle on one face of a leaf, in its holder g (mm, y up from the floor): at(o0,o1,u0,u1) turns a span o out from\n   the face and u along the leaf from the handle's axis toward the hinge into the holder's [x0,x1,z0,z1]. A rose 50 × 50 × 10,\n   a neck 14 × 14 out to 44, the lever 16 × 16 × 130 toward the hinge, at hy. Every part whole or hidden: top (mm) is the top of\n   the whole handle, a wall cut under it hides it */\nfunction leverHandle(g,mat,hy,top,at){\n  const blk=(o0,o1,u0,u1,y0,y1)=>{const [x0,x1,z0,z1]=at(o0,o1,u0,u1),m=new THREE.Mesh(new THREE.BoxGeometry((x1-x0)*MM,(y1-y0)*MM,(z1-z0)*MM),mat);\n    m.position.set((x0+x1)/2*MM,(y0+y1)/2*MM,(z0+z1)/2*MM);m.castShadow=true;m.userData.whole=top*MM;g.add(m);return m;};\n  blk(0,10,-25,25,hy-25,hy+25);blk(10,44,-7,7,hy-7,hy+7);blk(44,60,-8,122,hy-8,hy+8);\n}\nconst LEAF_T=40;   // the leaf's thickness\n// the door is rebuilt when the sizes change; it stays as open as it was\nfunction buildDoors(){\n  const keep=doors.map(d=>({t:d.t,a:d.a,last:d.last}));\n  emptyGroup(doorGroup,false);doors.length=0;held=null;\n  if(arcs){scene.remove(arcs);emptyGroup(arcs);}\n  const bw=dB-dA-2*LT-6,bh=A.dH-LT-10,hx=dB-LT-3;   // the leaf in the lining: 3 to either jamb, 5 under the head and over the floor; its hinge\n  // the leaf runs from the hinge toward -x; turning it (s = 1) takes its free edge into the room (+z)\n  const d=door(hx,0,[bw,bh,LEAF_T],[-bw/2,bh/2+5,-LEAF_T/2],leafMat,1.5);d.hole='door:0';\n  // the handles, square: 1000 up, 60 in from the leaf's free edge, one out of each face\n  { const ux=60-bw,hy=1000;\n    [[0,1],[-LEAF_T,-1]].forEach(([fz,s])=>leverHandle(d.g,doorHandleMat,hy,hy+25,(o0,o1,u0,u1)=>[ux+u0,ux+u1,...(s>0?[fz+o0,fz+o1]:[fz-o1,fz-o0])])); }\n  const cs=new THREE.Group();doorGroup.add(cs);d.frame=cs;   // the casings and the lining: a click on them works the door, they hide with it\n  const yt=A.dH;\n  const plank=(x0,x1,za,zb,ya,yb,role)=>{const m=new THREE.Mesh(new THREE.BoxGeometry((x1-x0)*MM,(yb-ya)*MM,(zb-za)*MM),leafMat);\n    m.position.set((x0+x1)/2*MM,(ya+yb)/2*MM,(za+zb)/2*MM);m.castShadow=m.receiveShadow=true;\n    m.add(new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry),edgeMat));m.userData[role]=true;cs.add(m);};\n  // the casings: the room face, the other face; their inner edges flush with the lining's faces, so they cover its ends\n  const c0=dA+LT,c1=dB-LT,ct=yt-LT;\n  [[0,CT],[-A.tD-CT,-A.tD]].forEach(([z0,z1])=>{\n    plank(c0-CW,c0,z0,z1,0,ct,'casing');plank(c1,c1+CW,z0,z1,0,ct,'casing');plank(c0-CW,c1+CW,z0,z1,ct,ct+CW,'casing');});\n  // the lining: face to face of the wall, its ends under the casings\n  plank(dA,dA+LT,-A.tD,0,0,yt-LT,'lining');plank(dB-LT,dB,-A.tD,0,0,yt-LT,'lining');plank(dA,dB,-A.tD,0,yt-LT,yt,'lining');\n  // door swing on the floor, drawn the way plans show it: from the leaf shut (toward -x) to it open (into the room)\n  { arcs=new THREE.Group();const am=new THREE.LineDashedMaterial({color:0x6b7069,dashSize:.04,gapSize:.03});\n    const arc=(cx,cz,r,a0,a1,leaf,hole)=>{const pts=[];for(let i=0;i<=32;i++){const a=a0+(a1-a0)*i/32;pts.push(new THREE.Vector3((cx+r*Math.cos(a))*MM,.006,(cz+r*Math.sin(a))*MM));}\n      const l=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),am);l.computeLineDistances();l.userData.hole=hole;arcs.add(l);\n      const e=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(cx*MM,.006,cz*MM),new THREE.Vector3((cx+r*Math.cos(leaf))*MM,.006,(cz+r*Math.sin(leaf))*MM)]),new THREE.LineBasicMaterial({color:0x6b7069}));e.userData.hole=hole;arcs.add(e);};\n    arc(hx,0,bw,Math.PI,Math.PI/2,Math.PI/2,'door:0');\n    scene.add(arcs); }\n  doors.forEach((d,i)=>{if(keep[i])Object.assign(d,keep[i]);});\n  doorParts.length=0;\n  doors.forEach(d=>{const id=d.hole.split(':')[0];[d.g,d.frame].forEach(g=>{if(g)g.traverse(o=>{o.userData.wall=id;});});});   // a door goes down with its wall\n  doorGroup.traverse(m=>{if(!m.isMesh)return;if(typeof m.userData.whole===\"number\"){doorParts.push({m,whole:m.userData.whole,wall:m.userData.wall});return;}const h=m.geometry.parameters.height,y=m.position.y;doorParts.push({m,h,b:y-h/2,t:y+h/2,wall:m.userData.wall});});\n}\nbuildDoors();\n\n// the sizes changed: everything of the room is built again for the view on screen\nmodelHooks.push(()=>{\n  floor.position.set(CX,-.002,CZ);\n  buildRooms();buildDoors();buildWalls(VIEWS[view]);applyTheme();\n});\n\n\n/* theme colours; the wall colour is shared by all views, floor colours by room are a setting of the view */\nfunction applyTheme(){\n  scene.background=new THREE.Color(css('--scene-bg'));\n  floorMat.color.set(css('--scene-floor'));\n  const wc=WALLC[S.wc]||WALLC.white;wallMat.color.set(wallCol(wc));\n  ceilColor.set(wallCol(WALLC.white));\n  wallMat.roughness=wc.r;\n  const fl=(vs()||{}).floors!==false;\n  roomMats.forEach((m,i)=>m.color.set(fl?css(ROOMS[i].col):css('--scene-floor')));\n  paintNames();\n}\n\n/* every frame: walls are cut at the view's share of the ceiling height (bottom stays on the floor), doors swing;\n   in a flight between views every wall follows the flight instead (see morph) */\nlet wallCut=H*MM, wallFeetMode=false;   // where the walls end now (m) and whether only their footprints show («Следы») — for the dimension lines\nconst lineGeo=pts=>new THREE.BufferGeometry().setAttribute('position',new THREE.Float32BufferAttribute(pts,3));\nfunction wallsSeeThrough(op){const see=op<.999;const m=wallMat;m.opacity=op;if(m.transparent!==see){m.transparent=see;m.depthWrite=!see;m.needsUpdate=true;}}\nframeHooks.push((dt,ease)=>{\n  const V=vs();\n  const row=V.Wm==='row',edgesOnly=V.Wm==='edges',feet=V.Wm==='feet';\n  const cutMm=H*(row?10:V.Wh)/100,cut=cutMm*MM;\n  let doorCut=()=>cut;   // the height a door is cut at: its wall's\n  if(morph){\n    const e=morph.e,at=id=>morphWall(morph.w.get(id),e),op=morph.opF+(morph.opT-morph.opF)*e;\n    const ln=morph.lnF+(morph.lnT-morph.lnF)*e;\n    wallsSeeThrough(op);edgeMat.opacity=ln;\n    // the last 150 mm of a wall fade away, its outline from 200 mm; its footprint fades between the views\n    const fade=(m,o)=>{m.opacity=o;const see=o<.999;if(m.transparent!==see){m.transparent=see;m.depthWrite=!see;m.needsUpdate=true;}};\n    const low=id=>Math.min(1,at(id).cut/150);\n    morph.mats.forEach((m,id)=>{const s=morph.w.get(id),n=at(id),fF=s.rF?1:0;\n      fade(m.body,op*low(id));m.line.opacity=ln*Math.min(1,n.cut/200);fade(m.foot,fF+((s.exT?1:0)-fF)*e);});\n    wallParts.forEach(w=>{\n      const n=at(w.id),top=Math.min(w.t,n.cut*MM),fits=fitBox(w.m,w.box,n.r,false)&&top>w.b+.001;\n      w.m.visible=fits;w.m.castShadow=op*low(w.id)>.5&&!w.glass;\n      if(fits){w.m.scale.y=(top-w.b)/w.h;w.m.position.y=w.b+(top-w.b)/2;}\n    });\n    // outlines go with their walls\n    wallLines.forEach(l=>{const n=at(l.w.id),c=n.cut>=1&&clipWall(l.w,n.r);l.e.visible=!!c;\n      if(c){l.e.geometry.dispose();l.e.geometry=lineGeo(wallOutline(c,Math.min(H,n.cut)));}});\n    wallFeet.forEach(f=>{f.m.visible=fitBox(f.m,f.box,at(f.id).r,true);});\n    doorCut=id=>morph.w.has(id)?at(id).h*MM:0;\n    // a door and its swing show while its opening is whole in its wall on the way\n    doors.forEach(d=>{const on=doorInFlight(d,at);d.g.visible=on;if(d.frame)d.frame.visible=on;});\n    arcs.children.forEach(l=>{const d=doors.find(x=>x.hole===l.userData.hole);l.visible=!!d&&d.g.visible;});\n    doorGroup.visible=arcs.visible=morph.doors;\n  }else{\n    wallsSeeThrough(edgesOnly?0:1);edgeMat.opacity=edgeOp(V);\n    wallParts.forEach(w=>{\n      const top=Math.min(w.t,cut),fits=top>w.b+.001;\n      w.m.visible=fits&&!feet&&(V.Wm==='auto'?w.f():true);\n      w.m.castShadow=!edgesOnly&&!w.glass;\n      if(fits){w.m.scale.y=(top-w.b)/w.h;w.m.position.y=w.b+(top-w.b)/2;}\n    });\n    // wall edges are redrawn only when the cut height changes\n    if(cutMm!==linesTop){linesTop=cutMm;wallLines.forEach(l=>{l.e.geometry.dispose();l.e.geometry=lineGeo(wallOutline(l.w,Math.min(H,cutMm)));});}\n    wallLines.forEach(l=>l.e.visible=!feet&&(V.Wm==='auto'?l.f():true));\n    doorGroup.visible=V.dm!=='none'&&!feet;arcs.visible=V.dm!=='none'&&V.arcs!==false;   // the walk has doors without swings\n  }\n  doors.forEach(d=>{\n    if(held&&held.d===d){d.t=Math.min(d.max,Math.max(0,d.t+held.dir*HOLD_RATE*dt));d.a=d.t;}\n    else d.a+=(d.t-d.a)*ease(.07);\n    d.g.rotation.y=d.s*d.a;});\n  doorParts.forEach(p=>{if(p.whole){p.m.visible=doorCut(p.wall)>=p.whole-.001;return;}const top=Math.min(p.t,doorCut(p.wall)),fits=top>p.b+.001;p.m.visible=fits;\n    if(fits){p.m.scale.y=(top-p.b)/p.h;p.m.position.y=p.b+(top-p.b)/2;}});\n  wallCut=Math.min(cut,H*MM);wallFeetMode=feet;\n});\n\n<\/script>\n<script>\n/* ---------- views: each tab is a view of the one room ----------\n   A view names the walls it shows (rooms), which walls hide in the cut mode and from which side (fade),\n   its own settings (remembered per view) and its panel. Light and wall colour are shared by all views:\n   their block (#shared) moves into the panel of the view on screen. */\nconst VIEWS={};     // id → {rooms, fade, frame(), sun(), anchor(), defaults, panel, home(), sync(), onDoors(),\n                   //       mouse: the view takes the mouse itself (no orbit), info: its hint under «i» (data-info)}\nconst VS={};        // id → the view's own settings\nlet view=null;      // the view on screen\nconst vs=()=>VS[view];\n\n/* remembered in this browser */\nconst readJSON=k=>{try{return JSON.parse(localStorage.getItem(k)||'null');}catch(e){return null;}};\nconst writeJSON=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}};\nconst viewKey=id=>`eng-view-${id}-v1`;\nfunction saveView(id=view){writeJSON(viewKey(id),VS[id]);}\n\n/* shared settings: light and wall colour */\nconst SKEY='eng-shared-v1';\nconst S={wc:'white',light:{...LIGHT0},edge:true,fly:true};   // edge: the walls' and doors' outlines; fly: the animated flight between tabs\n{ const s=readJSON(SKEY);if(s){if(WALLC[s.wc])S.wc=s.wc;S.light={...LIGHT0,...(s.light||{})};if(s.edge===false)S.edge=false;if(s.fly===false)S.fly=false;} }\nconst saveShared=()=>writeJSON(SKEY,S);\nconst sharedEl=document.getElementById('shared');\n// wall colour swatches\nconst wcs=document.getElementById('wcs');\nwcs.innerHTML=Object.entries(WALLC).map(([k,w])=>`<button class=\"wc\" data-wc=\"${k}\" aria-pressed=\"false\"><i style=\"background:${w.p||w.c}\"><\\/i>${w.n}<\\/button>`).join('');\nconst syncWc=()=>wcs.querySelectorAll('[data-wc]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.wc===S.wc));\nwcs.querySelectorAll('[data-wc]').forEach(b=>b.addEventListener('click',()=>{S.wc=b.dataset.wc;syncWc();applyTheme();saveShared();}));\nsyncWc();\n// the walls' and doors' outlines (walls.js: edgeOp), the same in every view\nconst edgeBox=document.getElementById('wEdge');edgeBox.checked=S.edge;\nedgeBox.addEventListener('change',e=>{S.edge=e.target.checked;saveShared();});\n// the animated flight between tabs; without it the new view's walls are there at once and the camera glides to it\nconst flyBox=document.getElementById('wFly');flyBox.checked=S.fly;\nflyBox.addEventListener('change',e=>{S.fly=e.target.checked;saveShared();});\n// light\nconst lmap={Laz:'az',Lel:'el',Li:'i',La:'a'},lunit={az:'°',el:'°',i:'%',a:'%'};\nfunction syncLight(){Object.entries(lmap).forEach(([id,k])=>{document.getElementById(id).value=S.light[k];document.getElementById('o'+id).textContent=Math.round(S.light[k])+lunit[k];});placeSun();}\nObject.entries(lmap).forEach(([id,k])=>document.getElementById(id).addEventListener('input',e=>{S.light[k]=+e.target.value;syncLight();saveShared();}));\nlet spin=false;const spinBtn=document.getElementById('lightSpin');\nspinBtn.addEventListener('click',()=>{spin=!spin;spinBtn.setAttribute('aria-pressed',spin);spinBtn.textContent=spin?'Остановить':'Вращать свет';if(!spin){syncLight();saveShared();}});\ndocument.getElementById('lightReset').addEventListener('click',()=>{S.light={...LIGHT0};syncLight();saveShared();});\nsyncLight();\nframeHooks.push(dt=>{if(spin){const L=S.light;L.az+=30*dt;if(L.az>180)L.az-=360;syncLight();}});   // one turn in 12 s\n\n/* walls segment and height slider: a view has them in its panel ([data-wm], [data-wh], [data-wh-out]) or keeps its walls as set */\nfunction syncWallCtl(id){\n  const p=VIEWS[id].panel,V=VS[id],wh=p.querySelector('[data-wh]');\n  if(!wh)return;\n  wh.value=V.Wh;p.querySelector('[data-wh-out]').textContent=(V.Wm==='row'?10:V.Wh)+'%';\n  wh.disabled=V.Wm==='row'||V.Wm==='feet';wh.parentElement.style.opacity=wh.disabled?.45:1;\n  p.querySelectorAll('[data-wm]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.wm===V.Wm));\n}\n/* doors segment ([data-dm]) of a view: the apartment's doors all closed, all open (nothing pressed when they differ),\n   or no doors at all in this view. The doors are one for every view: a view with the segment follows them */\nfunction syncDoorCtl(id){\n  const bs=VIEWS[id].panel.querySelectorAll('[data-dm]'),V=VS[id];\n  if(!bs.length)return;\n  let st=V.dm;\n  if(st!=='none'){const open=doors.filter(d=>d.t!==0).length;st=open===doors.length?'open':open===0?'closed':'mixed';if(st!=='mixed')V.dm=st;}\n  bs.forEach(x=>x.setAttribute('aria-pressed',x.dataset.dm===st));\n}\n\n/* a view joins the app: its settings come from this browser, its panel gets the common controls */\nfunction addView(id,def){\n  VIEWS[id]=def;\n  VS[id]=Object.assign(JSON.parse(JSON.stringify(def.defaults)),readJSON(viewKey(id))||{});\n  const p=def.panel;\n  if(!p.querySelector(`[data-wm=\"${VS[id].Wm}\"]`))VS[id].Wm=def.defaults.Wm;   // a walls' mode this view has no button for (a saved one renamed since) — its default\n  p.querySelectorAll('[data-wm]').forEach(b=>b.addEventListener('click',()=>{VS[id].Wm=b.dataset.wm;syncWallCtl(id);saveView(id);}));\n  const wh=p.querySelector('[data-wh]');if(wh)wh.addEventListener('input',e=>{VS[id].Wh=+e.target.value;syncWallCtl(id);saveView(id);});\n  p.querySelectorAll('[data-dm]').forEach(b=>b.addEventListener('click',()=>{\n    const dm=VS[id].dm=b.dataset.dm;if(dm!=='none')doors.forEach(d=>d.t=dm==='open'?d.max:0);\n    saveView(id);doorsChanged();}));\n}\n\n/* a door was clicked or held:\n   every view updates its door controls from the doors as they are and remembers */\nfunction doorsChanged(){Object.keys(VIEWS).forEach(id=>{const v=VIEWS[id],seg=!!v.panel.querySelector('[data-dm]');\n  if(seg)syncDoorCtl(id);if(v.onDoors)v.onDoors();if(seg||v.onDoors)saveView(id);});}\n\n/* the sun aims at the middle of the view and its shadows cover the view (tighter in a room: sharper shadows);\n   the camera mini view frames the view's frame, or the whole apartment */\nfunction aimView(){const vw=VIEWS[view],s=vw.sun();aimSun(s.x,s.y,s.z,s.half);frameInset(insetFrame(vw));}\n// the part of the apartment the mini view keeps in its shot: the view's frame or the whole apartment (mm: x0 x1 z0 z1)\nconst insetFrame=vw=>vw.frame?vw.frame():[BOX.x0,BOX.x1,BOX.z0,BOX.z1];\nconst insetNow=()=>[apt.min.x,apt.max.x,apt.min.z,apt.max.z].map(v=>v/MM);\nfunction frameInset(f){apt.min.set(f[0]*MM,0,f[2]*MM);apt.max.set(f[1]*MM,H*MM,f[3]*MM);}\nmodelHooks.push(()=>{if(tr){tr=null;camDrive=null;}if(view)aimView();});   // the walls were just built anew for the view: a flight is over\n\n/* ---------- a flight between views ----------\n   One progress p (eased: e) moves everything together: the camera from where it was to the new view's goal,\n   the walls (walls.js: morph), the sun and its shadows,\n   the part of the apartment the mini view shows.\n   A click on another tab in the middle starts a new flight from what is on screen. Orbiting, panning or zooming\n   takes the camera back from the flight; the rest finishes */\nconst FLY=.85;   // seconds\nlet tr=null;     // {p, e, cam0, sun0, sunT, box0, boxT, pres0: how much of each view was on screen at the start}\nconst inTransition=()=>!!tr;\n// how much of a view is on screen: 1 or 0, in between while flying (the room's names, the walk's wide angle)\nfunction presence(id){const t=view===id?1:0;return tr?tr.pres0[id]+(t-tr.pres0[id])*tr.e:t;}\nfunction driveCam(){const c=tr.cam0,e=tr.e;\n  cam.theta=c.theta+(goal.theta-c.theta)*e;cam.phi=c.phi+(goal.phi-c.phi)*e;cam.r=c.r+(goal.r-c.r)*e;cam.target.copy(c.t).lerp(goalT,e);}\nfunction endTransition(){\n  tr=null;\n  if(camDrive===driveCam){camDrive=null;cam.theta=goal.theta;cam.phi=goal.phi;cam.r=goal.r;cam.target.copy(goalT);}\n  buildWalls(VIEWS[view]);aimView();\n}\npreHooks.push(dt=>{\n  if(!tr)return;\n  tr.p=Math.min(1,tr.p+dt/FLY);const e=tr.e=tr.p*tr.p*(3-2*tr.p);\n  if(morph)morph.e=e;\n  const a=tr.sun0,b=tr.sunT,l=(u,v)=>u+(v-u)*e;\n  aimSun(l(a.x,b.x),l(a.y,b.y),l(a.z,b.z),l(a.half,b.half));\n  frameInset(tr.box0.map((v,i)=>l(v,tr.boxT[i])));\n  if(tr.p>=1)endTransition();\n});\n\n/* show a view: its panel, its walls, its camera — where it was left, or the view's home on the first visit.\n   animate=false puts everything there at once (first load); otherwise it is a flight, or without the animated flight\n   (the shared setting) the new view's walls at once and the camera gliding there (a jump with reduced motion) */\n// the camera of each view, its target kept from the view's anchor (a room's origin): when the plan moves the room, the camera goes with it\nconst camMem={};\nconst anchorOf=id=>{const a=VIEWS[id].anchor?VIEWS[id].anchor():[0,0];return new THREE.Vector3(a[0]*MM,0,a[1]*MM);};\nfunction showView(id,animate=true){\n  if(!VIEWS[id])id='plan';\n  if(id===view)return;\n  // what is on screen now: the flight starts from here\n  const fly=animate&&!reduce&&S.fly&&view!==null;\n  let start=null;\n  if(fly){const pres0={};Object.keys(VIEWS).forEach(k=>{pres0[k]=presence(k);});const s=sun.target.position;\n    start={walls:wallsNow(),pres0,cam0:{theta:cam.theta,phi:cam.phi,r:cam.r,t:cam.target.clone()},sun0:{x:s.x,y:s.y,z:s.z,half:sunHalf},box0:insetNow()};}\n  if(view)camMem[view]={theta:goal.theta,phi:goal.phi,r:goal.r,t:goalT.clone().sub(anchorOf(view))};\n  view=id;const vw=VIEWS[id];\n  Object.values(VIEWS).forEach(v=>{v.panel.hidden=v!==vw;});\n  // light and wall colour in its panel, if it has a place for them; the hint under «i» of the view\n  const slot=vw.panel.querySelector('[data-shared-slot]');if(slot)slot.appendChild(sharedEl);sharedEl.hidden=!slot;\n  document.querySelectorAll('#infoBtn [data-info]').forEach(t=>{t.hidden=t.dataset.info!==(vw.info||'orbit');});\n  const m=camMem[id];\n  if(m){goal.theta=m.theta;goal.phi=m.phi;goal.r=m.r;goalT.copy(m.t).add(anchorOf(id));shortWay();}else vw.home();\n  if(fly){\n    startWallMorph(start.walls,id,goalPosition());\n    tr={p:0,e:0,cam0:start.cam0,sun0:start.sun0,sunT:vw.sun(),box0:start.box0,boxT:insetFrame(vw),pres0:start.pres0};camDrive=driveCam;\n  }else{\n    tr=null;if(camDrive===driveCam)camDrive=null;buildWalls(vw);aimView();\n    if(!animate||reduce){cam.theta=goal.theta;cam.phi=goal.phi;cam.r=goal.r;cam.target.copy(goalT);}\n  }\n  syncWallCtl(id);syncDoorCtl(id);if(vw.sync)vw.sync();applyTheme();\n}\n\n<\/script>\n<script>\n/* ---------- «Комната» view: the whole room, plan dimensions, camera presets, the sizes, what the plan assumes ---------- */\n/* ---------- dimension lines ---------- */\nconst labels=[];\nconst LABEL_H=.15;   // m: a plan label's height in the scene (engine.js: dimLabel, fitLabels)\nfunction label(text){const s=dimLabel(text,LABEL_H);labels.push(s);return s;}\nconst dimMat=new THREE.LineBasicMaterial({color:0x2f5d50,depthTest:false,transparent:true});\nconst dimsGroup=new THREE.Group();scene.add(dimsGroup);\n// a dimension line from a to b (m) with ticks ±t at its ends and its label in the middle\nfunction dimLine(g,a,b,t,txt){\n  const pts=[a,b,a.clone().add(t),a.clone().sub(t),b.clone().add(t),b.clone().sub(t)];\n  const l=new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(pts),dimMat);l.renderOrder=19;g.add(l);\n  const s=label(txt);s.position.copy(a).add(b).multiplyScalar(.5);g.add(s);\n}\n// a plan dimension: on the cut walls, ticks across it\nfunction dim(x0,z0,x1,z1,txt){\n  const a=new THREE.Vector3(x0*MM,0,z0*MM),b=new THREE.Vector3(x1*MM,0,z1*MM);\n  const d=b.clone().sub(a).normalize();dimLine(dimsGroup,a,b,new THREE.Vector3(-d.z,0,d.x).multiplyScalar(.05),txt);\n}\n// the window's dimensions stand at the window itself, on the room face of its wall: width × height across its middle, the sill height from the floor beside it; they show with the window\nconst winDims=new THREE.Group();scene.add(winDims);\nfunction buildWinDims(){\n  const z=(A.L-10)*MM,x0=(winX-A.winW/2)*MM,x1=(winX+A.winW/2)*MM,y=(A.winS+A.winT)/2*MM,xs=(winX-A.winW/2-150)*MM;\n  dimLine(winDims,new THREE.Vector3(x0,y,z),new THREE.Vector3(x1,y,z),new THREE.Vector3(0,.05,0),`${A.winW} × ${A.winT-A.winS}`);\n  dimLine(winDims,new THREE.Vector3(xs,0,z),new THREE.Vector3(xs,A.winS*MM,z),new THREE.Vector3(.05,0,0),`${A.winS}`);\n  dimLine(winDims,new THREE.Vector3(xs,A.winT*MM,z),new THREE.Vector3(xs,H*MM,z),new THREE.Vector3(.05,0,0),`${H-A.winT}`);\n}\n// the doorway's height stands at the doorway too: from the floor up on the room face of its wall, 150 left of its left casing; it shows with the lintel over it, to a camera in the room (else it would show through the wall)\nconst doorDims=new THREE.Group();scene.add(doorDims);\nfunction buildDoorDims(){\n  const x=(dL-150)*MM,z=10*MM;\n  dimLine(doorDims,new THREE.Vector3(x,0,z),new THREE.Vector3(x,A.dH*MM,z),new THREE.Vector3(.05,0,0),`${A.dH}`);\n}\n// dimension lines are computed from A; when the sizes change they are rebuilt the next time they are on screen\nlet dimsDirty=true;\nfunction buildDims(){\n  [dimsGroup,winDims,doorDims].forEach(g=>g.children.slice().forEach(o=>{g.remove(o);if(o.isSprite){o.material.map.dispose();o.material.dispose();}else o.geometry.dispose();}));   // sprites share one geometry\n  labels.length=0;\n  const zd=-A.tD/2,zw=A.L+A.tW/2,xr=dL+2*CW+A.dW;   // on the door wall, on the window wall; the right casing's outer edge\n  dim(0,zd,dL,zd,`${dL}`);dim(dL,zd,xr,zd,`${xr-dL}`);dim(xr,zd,A.W,zd,`${A.dR}`);   // the door wall: left of the door, the door with its casings, right of it\n  dim(dL+CW,250,xr-CW,250,`дверь ${A.dW}`);\n  dim(0,A.L-400,A.W,A.L-400,`${A.W}`);\n  dim(250,0,250,A.L,`${A.L}`);dim(A.W-250,0,A.W-250,A.L,`${A.L}`);\n  const w0=winX-A.winW/2,w1=winX+A.winW/2;\n  dim(0,zw,w0,zw,`${w0}`);dim(w0,zw,w1,zw,`окно ${A.winW}`);dim(w1,zw,A.W,zw,`${A.W-w1}`);\n  buildWinDims();buildDoorDims();\n  dimsDirty=false;\n}\n\n\n// distance at which the whole room fits the frame from straight above\nfunction fitR(wmm=BOX.x1-BOX.x0,dmm=BOX.z1-BOX.z0){\n  const t=Math.tan(camera.fov*Math.PI/360),w=wmm*MM,d=dmm*MM;\n  return Math.max(d/2/t,w/2/(t*(camera.aspect||1)))*1.12+H*MM;   // + wall height: the wall tops are that much closer to the camera\n}\n// camera presets of the plan (buttons «Камера»)\nfunction setCam(v){\n  const f=fitR();\n  const views={\n    plan:[-.6,.62,f*1.05,CX,.3,CZ],                     // from the corner of the window and the left walls: the door wall and the right wall\n    top:[0,.0005,f,CX,0,CZ],\n    door:[-.25,1.0,f*.95,CX,.6,CZ],                     // over the window wall, looking at the door\n    window:[Math.PI-.35,.95,f*.95,CX,.6,CZ]             // over the door wall, looking at the window\n  };\n  const s=views[v];goal.theta=s[0];goal.phi=s[1];goal.r=s[2];goalT.set(s[3],s[4],s[5]);\n  shortWay();\n}\n\n/* ---------- panel ---------- */\nconst planPanel=document.querySelector('[data-panel=\"plan\"]');\nconst pq=s=>planPanel.querySelector(s);\npq('[data-cams]').querySelectorAll('[data-cam]').forEach(b=>b.addEventListener('click',()=>setCam(b.dataset.cam)));\nconst row=(k,v,q)=>`<dt>${k}<\\/dt><dd${q?' class=\"q\"':''}>${v}<\\/dd>`;\n// what the plan assumes, in numbers: redrawn when the sizes change\nconst area=()=>(A.W*A.L/1e6).toFixed(2).replace('.',',');\nfunction renderFacts(){\n  pq('#pFacts').innerHTML=\n    `<dl class=\"facts\">${\n      row('Стены',`${A.W} × ${A.L}, площадь ${area()} м²`)+row('Потолок',H)+\n      row('Дверь',`${A.dW} между наличниками ${CW}, проём ${dB-dA} × ${A.dH}`)+\n      row('Стена с дверью',`${dL} + ${CW} + ${A.dW} + ${CW} + ${A.dR}`)+\n      row('Окно',`${A.winW}, от пола ${A.winS} до ${A.winT}, по центру стены`)+\n      row('Стена с окном',`${winX-A.winW/2} + ${A.winW} + ${A.W-winX-A.winW/2}`)+\n      row('Толщина стен',`с дверью ${A.tD}, боковые ${A.tS}, с окном ${A.tW}`,true)}<\\/dl>`;\n  pq('#pSub').textContent=`${A.W} × ${A.L} мм · ${area()} м² · потолок ${H}`;\n}\nrenderFacts();\n\n/* the plan's own settings: dimensions, the room's name, the floor colour */\nfunction syncPlan(){\n  const V=VS.plan;\n  pq('#pDims').checked=V.dims;pq('#pNames').checked=V.names;pq('#pFloors').checked=V.floors;\n}\npq('#pDims').addEventListener('change',e=>{VS.plan.dims=e.target.checked;saveView('plan');});\npq('#pNames').addEventListener('change',e=>{VS.plan.names=e.target.checked;saveView('plan');});\npq('#pFloors').addEventListener('change',e=>{VS.plan.floors=e.target.checked;applyTheme();saveView('plan');});\n\n/* ---------- wall sizes: edited only here, the walk takes them as they are ----------\n   A slider stops at the last value where everything still fits and says what is in the way */\nconst SIZES=[\n  ['Комната',[\n    {k:'H',n:'Высота потолка',min:2400,max:3600,step:10},\n    {k:'W',n:'Стена с дверью и стена с окном',min:2000,max:6000,step:10},\n    {k:'L',n:'Боковые стены',min:2000,max:6000,step:1},\n    {k:'tD',n:'Толщина стены с дверью',min:50,max:600,step:10},\n    {k:'tS',n:'Толщина боковых стен',min:50,max:600,step:10},\n    {k:'tW',n:'Толщина стены с окном',min:100,max:800,step:10}]],\n  ['Дверь',[\n    {k:'dR',n:'От правого угла до наличника',min:0,max:5000,step:10},\n    {k:'dW',n:'Ширина между наличниками',min:500,max:1200,step:10},\n    {k:'dH',n:'Высота проёма',min:1800,max:2600,step:10}]],\n  ['Окно',[\n    {k:'winW',n:'Ширина',min:400,max:3000,step:10},\n    {k:'winS',n:'Низ от пола',min:0,max:1500,step:10},\n    {k:'winT',n:'Верх от пола',min:1200,max:3500,step:10}]]\n];\nconst sizeFields=SIZES.flatMap(([,fs])=>fs);\nsizeFields.forEach(f=>{f.get=f.get||(a=>a[f.k]);f.set=f.set||((a,v)=>({...a,[f.k]:v}));});\npq('#pSizes').innerHTML=SIZES.map(([g,fs])=>`<div><h3>${g}, мм<\\/h3>${fs.map(f=>\n  `<div class=\"field\"><label for=\"pS-${f.k}\">${f.n}<\\/label><output data-size-out=\"${f.k}\"><\\/output><input type=\"range\" id=\"pS-${f.k}\" data-size=\"${f.k}\" min=\"${f.min}\" max=\"${f.max}\" step=\"${f.step}\"><\\/div>`).join('')}<\\/div>`).join('');\nconst sizeMsg=pq('#pSizeMsg');\nfunction syncSizes(){sizeFields.forEach(f=>{const v=f.get(A);pq(`[data-size=\"${f.k}\"]`).value=v;pq(`[data-size-out=\"${f.k}\"]`).textContent=v;});}\n// the value v if everything fits with it; otherwise the last one toward v that fits (on the slider's step from the current value)\nfunction fitSize(f,v){\n  const cur=f.get(A),bad=aptProblems(f.set(A,v));\n  if(!bad.length||aptProblems(A).length)return {v,why:''};\n  let lo=cur,hi=v;\n  while(Math.abs(hi-lo)>1){const mid=Math.round((lo+hi)/2);if(aptProblems(f.set(A,mid)).length)hi=mid;else lo=mid;}\n  return {v:cur+Math.trunc((lo-cur)/f.step)*f.step,why:bad[0]};\n}\nsizeFields.forEach(f=>pq(`[data-size=\"${f.k}\"]`).addEventListener('input',e=>{\n  const {v,why}=fitSize(f,+e.target.value);\n  if(v!==f.get(A))setModel(f.set(A,v));\n  syncSizes();sizeMsg.textContent=why?`Дальше нельзя: ${why}`:'';\n}));\nsyncSizes();\nconst sizesBox=pq('#pSizesBox');\n{ const s=readJSON('eng-plan-sizes');sizesBox.open=s!==false; }\nsizesBox.addEventListener('toggle',()=>writeJSON('eng-plan-sizes',sizesBox.open));\n\n// sizes as the starting ones: in this browser, or as a code to send to the chat so they become the defaults for everyone\nconst aMsg=pq('#pAMsg');\npq('#pSaveA').addEventListener('click',()=>{try{localStorage.setItem(MKEY,JSON.stringify(modelDiff()));aMsg.textContent='Сохранено в этом браузере';}catch(e){aMsg.textContent='Браузер не дал сохранить. Скопируйте код и пришлите в чат';}});\npq('#pResetA').addEventListener('click',()=>{try{localStorage.removeItem(MKEY);}catch(e){}setModel({});aMsg.textContent='Исходные размеры возвращены';sizeMsg.textContent='';});\npq('#pCopyA').addEventListener('click',()=>{\n  const ta=pq('#pACode');ta.value=JSON.stringify(modelDiff());\n  (navigator.clipboard?navigator.clipboard.writeText(ta.value):Promise.reject()).then(()=>{aMsg.textContent='Код скопирован';}).catch(()=>{ta.hidden=false;ta.focus();ta.select();aMsg.textContent='Выделено — нажмите Ctrl+C';});\n});\n\n// the sizes changed: the plan's dimensions, numbers and sliders follow\nmodelHooks.push(()=>{dimsDirty=true;renderFacts();syncSizes();});\n\n/* every frame: dimensions and the room's name belong to the plan; dimension lines lie on the cut walls, the window's and the doorway height stand at them */\ninsetHide.push(dimsGroup,winDims,doorDims);\nframeHooks.push(()=>{\n  // dimensions come when the plan is reached; room floors and names change halfway (room views have the plain floor, as before)\n  const on=view==='plan'&&!inTransition(),half=presence('plan')>=.5;\n  dimsGroup.visible=on&&VS.plan.dims;namesGroup.visible=half&&VS.plan.names;roomGroup.visible=half;\n  if(dimsGroup.visible&&dimsDirty)buildDims();\n  dimsGroup.position.y=(wallFeetMode?0:wallCut)+.02;\n  winDims.visible=dimsGroup.visible&&wallParts.some(w=>w.glass&&w.m.visible);   // the window's glass is on screen\n  doorDims.visible=dimsGroup.visible&&camera.position.z>0&&wallParts.some(w=>w.id==='door'&&Math.abs(w.b-A.dH*MM)<1e-6&&w.m.visible);   // the lintel over the doorway is on screen, seen from the room\n  // dimension labels: readable near, shrinking with the plan far (engine.js: fitLabels)\n  if(dimsGroup.visible)fitLabels(labels);\n});\n\n/* the area of a room's name under the cursor: its floor is tinted and framed by a band along the walls, drawn over them */\nconst HOVER_BAND=40;   // mm, inward from the outline\nconst hoverFillMat=new THREE.MeshBasicMaterial({color:0x2f5d50,depthTest:false,transparent:true,opacity:.14,side:THREE.DoubleSide});\nconst hoverBandMat=new THREE.MeshBasicMaterial({color:0x2f5d50,depthTest:false,transparent:true,opacity:.9,side:THREE.DoubleSide});\nconst hoverFrame=new THREE.Group();hoverFrame.visible=false;scene.add(hoverFrame);\n// the outline moved inward by d: each corner along the bisector of its two edges (mitred), mm\nfunction insetPoly(q,d){\n  const n=q.length,ccw=polySigned(q)>0;\n  const nrm=(a,b)=>{const dx=b[0]-a[0],dz=b[1]-a[1],l=Math.hypot(dx,dz);return ccw?[-dz/l,dx/l]:[dz/l,-dx/l];};   // the edge's inward normal\n  return q.map((p,i)=>{const a=nrm(q[(i+n-1)%n],p),b=nrm(p,q[(i+1)%n]),k=d/(1+a[0]*b[0]+a[1]*b[1]);return [p[0]+(a[0]+b[0])*k,p[1]+(a[1]+b[1])*k];});\n}\nfunction bandGeometry(q,d){\n  const r=insetPoly(q,d),n=q.length,pos=[],idx=[];\n  q.forEach((p,i)=>{pos.push(p[0]*MM,0,p[1]*MM,r[i][0]*MM,0,r[i][1]*MM);const j=(i+1)%n;idx.push(2*i,2*j,2*j+1,2*i,2*j+1,2*i+1);});\n  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setIndex(idx);return g;\n}\nlet hoverRoom=-1;\nfunction setHoverRoom(i){\n  if(i===hoverRoom)return;hoverRoom=i;\n  emptyGroup(hoverFrame,false);\n  if(i<0){hoverFrame.visible=false;return;}\n  const q=roomPoly(ROOMS[i]);\n  const fill=new THREE.Mesh(polyFloorGeometry(q),hoverFillMat);fill.renderOrder=17;\n  const band=new THREE.Mesh(bandGeometry(q,HOVER_BAND),hoverBandMat);band.renderOrder=18;\n  hoverFrame.add(fill,band);hoverFrame.visible=true;\n}\n// which room's area is under the cursor (-1: none): labelHits — the ray through the names, sceneHits — through the whole scene.\n// Only over the area («13,00 м²»), not the whole inscription, and only where it is seen: anything in front of it (a wall, a door)\n// hides it. The names themselves and the frame don't count, nor a part of a surface clipped away\nconst inGroup=(o,g)=>{while(o){if(o===g)return true;o=o.parent;}return false;};\nconst clippedAt=h=>[].concat(h.object.material||[]).some(m=>m&&m.clippingPlanes&&m.clippingPlanes.some(p=>p.distanceToPoint(h.point)<0));\nfunction roomUnderCursor(labelHits,sceneHits){\n  const h=labelHits[0],i=h?nameTexts.findIndex(n=>n.m===h.object):-1;\n  if(i<0)return -1;\n  const [u0,u1]=areaSpan(nameTexts[i]);if(!h.uv||h.uv.x<u0||h.uv.x>u1)return -1;\n  const front=sceneHits.find(x=>hittable(x)&&!inGroup(x.object,namesGroup)&&!inGroup(x.object,hoverFrame)&&!clippedAt(x));\n  return front&&front.distance<h.distance-1e-4?-1:i;\n}\ncanvas.addEventListener('pointermove',e=>{\n  if(view!=='plan'||inTransition()||!namesGroup.visible||e.buttons){setHoverRoom(-1);return;}\n  aimRay(e);\n  const lh=ray.intersectObjects(nameTexts.map(n=>n.m));\n  setHoverRoom(lh.length?roomUnderCursor(lh,ray.intersectObjects(scene.children,true)):-1);\n});\ncanvas.addEventListener('pointerleave',()=>setHoverRoom(-1));\nmodelHooks.push(()=>setHoverRoom(-1));   // the sizes changed: the frame is gone until the cursor moves\nframeHooks.push(()=>{if(hoverRoom>=0){if(!namesGroup.visible)setHoverRoom(-1);else hoverFrame.position.y=(wallFeetMode?0:wallCut)+.02;}});\n\naddView('plan',{\n  rooms:'all',\n  // the cut mode hides a wall while the camera looks at it from outside the room\n  fade:Object.fromEntries(WALLS.filter(w=>w.ext).map(w=>[w.id,w.ext])),\n  defaults:{Wm:'auto',Wh:100,dm:'closed',dims:true,names:true,floors:true},\n  sun:()=>({x:CX,y:0,z:CZ,half:4.6}),   // shadows cover the whole room from any direction\n  panel:planPanel,\n  home:()=>setCam('plan'),\n  sync:syncPlan\n});\nif(VS.plan.dm!=='none')doors.forEach(d=>d.t=VS.plan.dm==='open'?d.max:0);\n\n<\/script>\n<script>\n/* ---------- «Обход»: the room from the eyes, walked through as in a game ----------\n   W A S D or the arrows — walk (two fingers on a trackpad too: up — forward, down — back, to the sides — sideways, any angle\n   between; the mouse's wheel — forward and back), the mouse — look (a click on the scene takes the mouse, Esc or the right button gives it back; where the browser\n   does not let the page take it, drag to look), Space — jump, Ctrl or C — crouch, Shift — a slow step, E or a click — the door or\n   cabinet front in the middle of the screen (under the cursor while dragging); the mouse taken, the button held HOLD_MS moves it\n   gradually, as a long press in the other views, a shorter press opens or closes it on release. On a touch screen a finger in the lower left corner of\n   the scene (a square of STICK_ZONE of its width) holds a stick (the circle comes under it): the farther from its centre, the\n   faster the walk; elsewhere a finger looks; a tap is the door under the finger. The panel sets the eye height, the walls' look, the doors, and has the common wall colour (with\n   the outlines) and light.\n   The camera is the orbit's, its centre a step (LOOK) in front of the eyes: a flight to the walk and from it, and the camera\n   remembered for the view, work as in any view. Walls (however they look) and the closed door stop the walker;\n   with «Без двери» the doorway is free */\nconst walkPanel=document.querySelector('[data-panel=\"walk\"]');\nconst LOOK=1;                       // m: the orbit's centre in front of the eyes\nconst BODY=.15;                     // m: the walker seen from above is a circle of this radius (a person turned sideways)\nconst STEP=.3;                      // m: what is lower than this above the feet is stepped over (plinths, a low sill)\nconst RUN=2.4,SLOW=1.2,LOW=.9;      // m/s: walking, with Shift, crouching\nconst JUMP=3.3,GRAV=12;             // m/s, m/s²: a jump of about 45 cm\nconst CROUCH_K=.32;                 // crouching lowers the eyes by this share\nconst OPEN_A=1;                     // rad: a door open this far lets the walker through\nconst SENS=.0025;                   // rad per pixel of the mouse\nconst SENS_TOUCH=2;                 // a finger turns the eyes this many times more: a phone's screen is small\nconst FOV0=camera.fov,FOV_WALK=62;  // the walk sees wider, like a game\n/* the trackpad: what two fingers moved (the wheel's delta) is a way to go in the eyes' frame, PAD m per pixel, gone at the gait's\n   speed and no more than PAD_LAG s of it behind (the rest of a fast swipe and of the system's glide is dropped) */\nconst PAD=.004,PAD_LAG=.15;\nconst pad={f:0,s:0};                // m still to go: forward, to the right\n\nconst keys=new Set();let jumpQ=false;\n/* the stick of a touch screen: the finger's offset from where it came down, a share of STICK_R; a little of it (STICK_DEAD) is\n   no step yet, so a tap does not walk */\nconst STICK_R=48,STICK_DEAD=.15;    // px (the circle's radius in the page), share\nconst STICK_ZONE=.33;               // the stick's corner: a square this share of the scene's width (no taller than the scene)\nlet stick=null;                     // {id, x0, y0: where the finger came down, x, y: where it is} (client px)\nlet touchUI=!!(window.matchMedia&&matchMedia('(hover: none) and (pointer: coarse)').matches),stickUsed=false;\nfunction stickOff(){   // the knob's offset, px, no farther than the circle\n  if(!stick)return [0,0];\n  const dx=stick.x-stick.x0,dy=stick.y-stick.y0,m=Math.hypot(dx,dy),k=m>STICK_R?STICK_R/m:1;\n  return [dx*k,dy*k];\n}\nfunction stickVec(){   // right, down: 0…1 together\n  const [dx,dy]=stickOff(),m=Math.hypot(dx,dy)/STICK_R;\n  if(m<STICK_DEAD)return [0,0];\n  const k=(m-STICK_DEAD)/(1-STICK_DEAD)/m/STICK_R;\n  return [dx*k,dy*k];\n}\nconst pl={on:false,feet:0,vy:0,c:0,vx:0,vz:0};   // the walker: feet above the floor (m), vertical speed, crouch 0…1, speed (m/s)\nconst walking=()=>view==='walk'&&!inTransition();\nconst locked=()=>!!document.pointerLockElement&&document.pointerLockElement===canvas;\n\n/* the eyes: where the orbit puts the camera (goal), and back */\nconst lookDir=()=>{const sp=Math.sin(goal.phi);return [sp*Math.sin(goal.theta),Math.cos(goal.phi),sp*Math.cos(goal.theta)];};\nfunction eyeNow(){const d=lookDir();return [goalT.x+goal.r*d[0],goalT.y+goal.r*d[1],goalT.z+goal.r*d[2]];}\nfunction setEye(x,y,z){const d=lookDir();goalT.set(x-goal.r*d[0],y-goal.r*d[1],z-goal.r*d[2]);}\n// the eye height standing (m): as set, low enough for a jump under the ceiling\nconst eyeH=()=>Math.min(VS.walk.eye*MM,H*MM-.6);\nfunction look(dx,dy,k=1){\n  const e=eyeNow();\n  goal.theta-=dx*SENS*k;goal.phi=Math.min(Math.PI-.08,Math.max(.08,goal.phi-dy*SENS*k));\n  setEye(...e);\n}\n/* the first visit: in the room a step from the door, in the middle of the doorway, looking toward the window */\nfunction walkHome(){goal.theta=Math.PI;goal.phi=Math.PI/2;goal.r=LOOK;setEye((dA+dB)/2*MM,eyeH(),.6);shortWay();}\n\n/* ---------- what is in the way, m: [x0,x1,z0,z1,y0,y1] ----------\n   The walls without their openings (rebuilt with the sizes); a window is not a way through; a door opening is while its door\n   is open */\nlet wallBoxes=[],doorways=[];\nfunction walkWalls(){\n  wallBoxes=[];doorways=[];\n  WALLS.forEach(w0=>{\n    const w=clipWall(w0,null),[x0,x1,z0,z1]=w.r;\n    const box=(a,b,y0,y1)=>(w.along?[a,b,z0,z1]:[x0,x1,a,b]).map(v=>v*MM).concat([y0*MM,y1*MM]);\n    let cur=w.along?x0:z0;const end=w.along?x1:z1;\n    w.holes.forEach(([a,b,h,sill=0],i)=>{\n      if(a>cur)wallBoxes.push(box(cur,a,0,H));\n      if(sill>0)wallBoxes.push(box(a,b,0,H));\n      else{wallBoxes.push(box(a,b,h,H));doorways.push({hole:w.id+':'+i,b:box(a,b,0,h)});}\n      cur=b;});\n    if(end>cur)wallBoxes.push(box(cur,end,0,w.h||H));   // a low wall (the shower step) is lower than STEP: stepped over\n  });\n}\nwalkWalls();modelHooks.push(walkWalls);\nfunction walkObstacles(){\n  const shut=new Set(VS.walk.dm==='none'?[]:doors.filter(d=>d.a<OPEN_A).map(d=>d.hole));\n  return wallBoxes.concat(doorways.filter(w=>shut.has(w.hole)).map(w=>w.b));\n}\n// how far the circle's centre at u is from the box b along axis i (0: x, 1: z); 0 inside its span\nconst gap=(b,i,u)=>Math.max(b[2*i]-u,0,u-b[2*i+1]);\nconst hits=(b,x,z,lo,hi)=>hi>b[4]&&lo<b[5]&&gap(b,0,x)**2+gap(b,1,z)**2<BODY*BODY;\n/* a move from x,z by dx,dz for a body from lo to hi (m above the floor): along each axis on its own, so the walker slides\n   along a wall; a move into something ends where the body touches it. What the walker already stands in (a door closed on\n   them, a wall moved by the plan) does not hold them. Returns the new x, z and whether each axis went all the way */\nfunction walkSlide(x,z,dx,dz,lo,hi,boxes=walkObstacles()){\n  const inside=new Set(boxes.filter(b=>hits(b,x,z,lo,hi)));\n  const inWay=(x,z)=>boxes.filter(b=>!inside.has(b)&&hits(b,x,z,lo,hi));\n  // one axis (0: x, 1: z): from v by d, the other coordinate at o; up to the nearest face in the way\n  const axis=(i,v,d,o)=>{\n    const at=t=>i?inWay(o,t):inWay(t,o),bs=at(v+d);if(!bs.length)return [v+d,true];\n    // the circle touches a box at its face, or at its corner when the other coordinate is past its span\n    const reach=b=>Math.sqrt(Math.max(0,BODY*BODY-gap(b,1-i,o)**2));\n    const t=d>0?Math.max(v,Math.min(...bs.map(b=>b[2*i]-reach(b)))-1e-6):Math.min(v,Math.max(...bs.map(b=>b[2*i+1]+reach(b)))+1e-6);\n    return [at(t).length?v:t,false];\n  };\n  const [nx,fx]=axis(0,x,dx,z),[nz,fz]=axis(1,z,dz,nx);\n  return [nx,nz,fx,fz];\n}\n\n/* ---------- every frame in the walk: the keys move the walker, the camera follows exactly ---------- */\nconst walkCam=()=>{cam.theta=goal.theta;cam.phi=goal.phi;cam.r=goal.r;cam.target.copy(goalT);};\nconst keyOn=c=>keys.has(c)?1:0;\nconst gait=()=>pl.c>.5?LOW:keys.has('ShiftLeft')||keys.has('ShiftRight')?SLOW:RUN;   // m/s\nfunction walkStep(dt){\n  const [ex,,ez]=eyeNow();goal.r=LOOK;\n  if(!pl.on){Object.assign(pl,{on:true,feet:0,vy:0,c:0,vx:0,vz:0});pad.f=pad.s=0;}\n  pl.c+=(Math.max(keyOn('KeyC'),keyOn('ControlLeft'),keyOn('ControlRight'))-pl.c)*Math.min(1,dt*10);\n  const eye=eyeH()*(1-CROUCH_K*pl.c),ground=pl.feet<=0;\n  // where the keys and the stick lead, at the speed of the gait (the stick: its share of it); on the ground the speed follows at\n  // once, in the air hardly\n  const [sx,sy]=stickVec();\n  const f=Math.max(keyOn('KeyW'),keyOn('ArrowUp'))-Math.max(keyOn('KeyS'),keyOn('ArrowDown'))-sy,s=Math.max(keyOn('KeyD'),keyOn('ArrowRight'))-Math.max(keyOn('KeyA'),keyOn('ArrowLeft'))+sx;\n  const th=goal.theta;let wx=-Math.sin(th)*f+Math.cos(th)*s,wz=-Math.cos(th)*f-Math.sin(th)*s;\n  const n=Math.hypot(wx,wz),top=gait()*Math.min(1,n);\n  if(n){wx*=top/n;wz*=top/n;}\n  const a=Math.min(1,dt*(ground?20:2));pl.vx+=(wx-pl.vx)*a;pl.vz+=(wz-pl.vz)*a;\n  if(ground&&jumpQ){pl.vy=JUMP;jumpQ=false;}\n  pl.vy-=GRAV*dt;pl.feet=Math.max(0,pl.feet+pl.vy*dt);if(pl.feet===0&&pl.vy<0)pl.vy=0;\n  // the trackpad's way: a step of it at the gait's speed, on top of the keys'\n  let px=0,pz=0;const pm=Math.hypot(pad.f,pad.s);\n  if(pm>1e-9){\n    const g=gait(),lag=Math.min(pm,g*PAD_LAG),k=Math.min(lag,g*dt)/pm,f=pad.f*k,s=pad.s*k;\n    pad.f=pad.f*lag/pm-f;pad.s=pad.s*lag/pm-s;\n    px=-Math.sin(th)*f+Math.cos(th)*s;pz=-Math.cos(th)*f-Math.sin(th)*s;\n  }\n  const [x,z,fx,fz]=walkSlide(ex,ez,pl.vx*dt+px,pl.vz*dt+pz,pl.feet+STEP,pl.feet+eye+.1);\n  if(!fx)pl.vx=0;if(!fz)pl.vz=0;if(!fx||!fz)pad.f=pad.s=0;   // into something: what is left of the swipe does not push on\n  setEye(x,pl.feet+eye,z);\n}\npreHooks.push(dt=>{\n  if(!walking()){letGo();pl.on=false;pad.f=pad.s=0;if(view!=='walk'){keys.clear();jumpQ=false;stick=null;}if(camDrive===walkCam)camDrive=null;return;}\n  // the button held long enough takes the door in the aim (none there: nothing, till the button is up)\n  if(press&&!press.long&&(press.s+=dt)>=HOLD_MS/1000){\n    press.long=true;const rc=canvas.getBoundingClientRect();\n    press.d=pickDoor({clientX:rc.left+rc.width/2,clientY:rc.top+rc.height/2});if(press.d)holdDoor(press.d);\n  }\n  walkStep(dt);camDrive=walkCam;\n});\n\n/* ---------- the mouse and the keys ---------- */\n// the door or cabinet front at a point of the canvas (the middle of the screen while the mouse is taken), or an item with a click of its own\nfunction useDoor(cx,cy){\n  if(cx===undefined){const rc=canvas.getBoundingClientRect();cx=rc.left+rc.width/2;cy=rc.top+rc.height/2;}\n  clickAt({clientX:cx,clientY:cy});\n}\nlet drag=null;\nlet press=null;   // the left button down while the mouse is taken: {s: seconds down, long: held HOLD_MS, d: the door in the aim then}\nfunction letGo(){const p=press;press=null;if(p&&p.d){if(held&&held.d===p.d)held=null;doorsChanged();}}\ncanvas.addEventListener('pointerdown',e=>{\n  if(!walking())return;\n  // a finger in the lower left corner holds the stick (one at a time); elsewhere it looks, as the mouse drags\n  if(e.pointerType==='touch'){\n    touchUI=true;const rc=canvas.getBoundingClientRect(),side=Math.min(rc.width*STICK_ZONE,rc.height);\n    if(!stick&&e.clientX<rc.left+side&&e.clientY>rc.top+rc.height-side){stick={id:e.pointerId,x0:e.clientX,y0:e.clientY,x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId);return;}\n  }else if(e.pointerType==='mouse')touchUI=false;\n  // the right button gives the mouse back, as Esc does\n  if(e.button===2){drag=null;if(locked()&&document.exitPointerLock)document.exitPointerLock();return;}\n  if(e.button!==undefined&&e.button!==0)return;\n  if(locked()){letGo();press={s:0,long:false,d:null};return;}\n  drag={x:e.clientX,y:e.clientY,x0:e.clientX,y0:e.clientY,id:e.pointerId,k:e.pointerType==='touch'?SENS_TOUCH:1};canvas.setPointerCapture(e.pointerId);\n  if(e.pointerType!=='touch'&&canvas.requestPointerLock){try{const r=canvas.requestPointerLock();if(r&&r.catch)r.catch(()=>{});}catch(err){}}\n});\ncanvas.addEventListener('pointermove',e=>{\n  if(!walking())return;\n  if(stick&&stick.id===e.pointerId){stick.x=e.clientX;stick.y=e.clientY;if(Math.hypot(stick.x-stick.x0,stick.y-stick.y0)>=6)stickUsed=true;return;}\n  if(locked())look(e.movementX||0,e.movementY||0);\n  else if(drag&&drag.id===e.pointerId){look(e.clientX-drag.x,e.clientY-drag.y,drag.k);drag.x=e.clientX;drag.y=e.clientY;}\n});\n// each finger ends its own: the stick's going leaves the look going on, and back\ncanvas.addEventListener('pointerup',e=>{\n  // the button down while the mouse was taken: a held door is let go, a short press is a click (unless Esc gave the mouse back)\n  if(press&&(e.button===undefined||e.button===0)){const short=!press.long;letGo();if(short&&locked())useDoor();return;}\n  // a click or a tap without a move, the mouse not taken: the door under the cursor or the finger\n  const tap=d=>d&&walking()&&!locked()&&Math.hypot(e.clientX-d.x0,e.clientY-d.y0)<6&&useDoor(e.clientX,e.clientY);\n  if(stick&&stick.id===e.pointerId){const d=stick;stick=null;tap(d);return;}\n  if(drag&&drag.id!==e.pointerId)return;\n  const d=drag;drag=null;tap(d);\n});\ncanvas.addEventListener('pointercancel',e=>{\n  letGo();\n  if(stick&&stick.id===e.pointerId)stick=null;else if(!drag||drag.id===e.pointerId)drag=null;\n});\nconst GAME=new Set(['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','KeyC','ControlLeft','ControlRight','KeyE','ShiftLeft','ShiftRight']);\n// the keys are the game's in the walk, unless typing or a slider has them. With Ctrl held the browser keeps its own shortcuts\n// that a page cannot take (Ctrl+W closes the tab, Ctrl+T, Ctrl+N); the others with a game key (Ctrl+D, Ctrl+S…) are the game's\nconst forUs=e=>view==='walk'&&GAME.has(e.code)&&!/^(INPUT|TEXTAREA|SELECT|BUTTON)$/.test((e.target&&e.target.tagName)||'');\ndocument.addEventListener('keydown',e=>{\n  if(!forUs(e))return;e.preventDefault();\n  if(!e.repeat){if(e.code==='Space')jumpQ=true;if(e.code==='KeyE'&&walking())useDoor();}\n  keys.add(e.code);\n});\n/* two fingers on a trackpad (the wheel): with natural scrolling fingers up give deltaY > 0 — forward, fingers to the right give\n   deltaX < 0 — to the right. A pinch comes as the wheel with Ctrl: nothing. The page's scroll and the swipe back in the history\n   are held off (engine.js) */\ncanvas.addEventListener('wheel',e=>{\n  if(!walking()||e.ctrlKey)return;\n  const k=PAD*(e.deltaMode===1?16:e.deltaMode===2?400:1);\n  pad.f+=(e.deltaY||0)*k;pad.s-=(e.deltaX||0)*k;\n},{passive:false});\ndocument.addEventListener('keyup',e=>{keys.delete(e.code);if(e.code==='Space')jumpQ=false;});\naddEventListener('blur',()=>{keys.clear();jumpQ=false;});\n\n/* ---------- what the walk shows: a ceiling (over solid walls u (function(){

  const tabs=['plan','walk'];

  // keep the explicit light/dark choice in sync inside the frame

    try{const t=document.documentElement.getAttribute('data-theme');const r=fr.contentDocument&&fr.contentDocument.documentElement;

      fr.srcdoc=PAGES.app;}
