runs from the hinge toward -x; turning it (s = 1) takes its free edge into the room (+z)\n  const d=door(hx,0,[bw,bh,LEAF_T],[-bw/2,bh/2+5,-LEAF_T/2],leafMat,1.5);d.hole='door:0';\n  // the handles, square: 1000 up, 60 in from the leaf's free edge, one out of each face\n  { const ux=60-bw,hy=1000;\n    [[0,1],[-LEAF_T,-1]].forEach(([fz,s])=>leverHandle(d.g,doorHandleMat,hy,hy+25,(o0,o1,u0,u1)=>[ux+u0,ux+u1,...(s>0?[fz+o0,fz+o1]:[fz-o1,fz-o0])])); }\n  const cs=new THREE.Group();doorGroup.add(cs);d.frame=cs;   // the casings and the lining: a click on them works the door, they hide with it\n  const yt=A.dH;\n  const plank=(x0,x1,za,zb,ya,yb,role)=>{const m=new THREE.Mesh(new THREE.BoxGeometry((x1-x0)*MM,(yb-ya)*MM,(zb-za)*MM),leafMat);\n    m.position.set((x0+x1)/2*MM,(ya+yb)/2*MM,(za+zb)/2*MM);m.castShadow=m.receiveShadow=true;\n    m.add(new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry),edgeMat));m.userData[role]=true;cs.add(m);};\n  // the casings: the room face, the other face; their inner edges flush with the lining's faces, so they cover its ends\n  const c0=dA+LT,c1=dB-LT,ct=yt-LT;\n  [[0,CT],[-A.tD-CT,-A.tD]].forEach(([z0,z1])=>{\n    plank(c0-CW,c0,z0,z1,0,ct,'casing');plank(c1,c1+CW,z0,z1,0,ct,'casing');plank(c0-CW,c1+CW,z0,z1,ct,ct+CW,'casing');});\n  // the lining: face to face of the wall, its ends under the casings\n  plank(dA,dA+LT,-A.tD,0,0,yt-LT,'lining');plank(dB-LT,dB,-A.tD,0,0,yt-LT,'lining');plank(dA,dB,-A.tD,0,yt-LT,yt,'lining');\n  // door swing on the floor, drawn the way plans show it: from the leaf shut (toward -x) to it open (into the room)\n  { arcs=new THREE.Group();const am=new THREE.LineDashedMaterial({color:0x6b7069,dashSize:.04,gapSize:.03});\n    const arc=(cx,cz,r,a0,a1,leaf,hole)=>{const pts=[];for(let i=0;i<=32;i++){const a=a0+(a1-a0)*i/32;pts.push(new THREE.Vector3((cx+r*Math.cos(a))*MM,.006,(cz+r*Math.sin(a))*MM));}\n      const l=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),am);l.computeLineDistances();l.userData.hole=hole;arcs.add(l);\n      const e=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(cx*MM,.006,cz*MM),new THREE.Vector3((cx+r*Math.cos(leaf))*MM,.006,(cz+r*Math.sin(leaf))*MM)]),new THREE.LineBasicMaterial({color:0x6b7069}));e.userData.hole=hole;arcs.add(e);};\n    arc(hx,0,bw,Math.PI,Math.PI/2,Math.PI/2,'door:0');\n    scene.add(arcs); }\n  doors.forEach((d,i)=>{if(keep[i])Object.assign(d,keep[i]);});\n  doorParts.length=0;\n  doors.forEach(d=>{const id=d.hole.split(':')[0];[d.g,d.frame].forEach(g=>{if(g)g.traverse(o=>{o.userData.wall=id;});});});   // a door goes down with its wall\n  doorGroup.traverse(m=>{if(!m.isMesh)return;if(typeof m.userData.whole===\"number\"){doorParts.push({m,whole:m.userData.whole,wall:m.userData.wall});return;}const h=m.geometry.parameters.height,y=m.position.y;doorParts.push({m,h,b:y-h/2,t:y+h/2,wall:m.userData.wall});});\n}\nbuildDoors();\n\n// the sizes changed: everything of the room is built again for the view on screen\nmodelHooks.push(()=>{\n  floor.position.set(CX,-.002,CZ);\n  buildRooms();buildDoors();buildWalls(VIEWS[view]);applyTheme();\n});\n\n\n/* theme colours; the wall colour is shared by all views, floor colours by room are a setting of the view */\nfunction applyTheme(){\n  scene.background=new THREE.Color(css('--scene-bg'));\n  floorMat.color.set(css('--scene-floor'));\n  const wc=WALLC[S.wc]||WALLC.cocoa;wallMat.color.set(wallCol(wc));wallTexU.wallTexOn.value=wc.tex?1:0;\n  ceilColor.set(wallCol(WALLC.white));\n  wallMat.roughness=wc.r;\n  const fl=(vs()||{}).floors!==false;\n  roomMats.forEach((m,i)=>m.color.set(fl?css(ROOMS[i].col):css('--scene-floor')));\n  paintNames();\n}\n\n/* every frame: walls are cut at the view's share of the ceiling height (bottom stays on the floor), doors swing;\n   in a flight between views every wall follows the flight instead (see morph) */\nlet wallCut=H*MM, wallFeetMode=false;   // where the walls end now (m) and whether only their footprints show («Следы») — for the dimension lines\nconst lineGeo=pts=>new THREE.BufferGeometry().setAttribute('position',new THREE.Float32BufferAttribute(pts,3));\nfunction wallsSeeThrough(op){const see=op<.999;const m=wallMat;m.opacity=op;if(m.transparent!==see){m.transparent=see;m.depthWrite=!see;m.needsUpdate=true;}}\nframeHooks.push((dt,ease)=>{\n  const V=vs();\n  const row=V.Wm==='row',edgesOnly=V.Wm==='edges',feet=V.Wm==='feet';\n  const cutMm=H*(row?10:V.Wh)/100,cut=cutMm*MM;\n  let doorCut=()=>cut;   // the height a door is cut at: its wall's\n  if(morph){\n    const e=morph.e,at=id=>morphWall(morph.w.get(id),e),op=morph.opF+(morph.opT-morph.opF)*e;\n    const ln=morph.lnF+(morph.lnT-morph.lnF)*e;\n    wallsSeeThrough(op);edgeMat.opacity=ln;\n    // the last 150 mm of a wall fade away, its outline from 200 mm; its footprint fades between the views\n    const fade=(m,o)=>{m.opacity=o;const see=o<.999;if(m.transparent!==see){m.transparent=see;m.depthWrite=!see;m.needsUpdate=true;}};\n    const low=id=>Math.min(1,at(id).cut/150);\n    morph.mats.forEach((m,id)=>{const s=morph.w.get(id),n=at(id),fF=s.rF?1:0;\n      fade(m.body,op*low(id));m.line.opacity=ln*Math.min(1,n.cut/200);fade(m.foot,fF+((s.exT?1:0)-fF)*e);});\n    wallParts.forEach(w=>{\n      const n=at(w.id),top=Math.min(w.t,n.cut*MM),fits=fitBox(w.m,w.box,n.r,false)&&top>w.b+.001;\n      w.m.visible=fits;w.m.castShadow=op*low(w.id)>.5&&!w.glass&&!w.photo;\n      if(fits){w.m.scale.y=(top-w.b)/w.h;w.m.position.y=w.b+(top-w.b)/2;if(w.fit)w.fit(w.m.scale.y);}\n    });\n    // outlines go with their walls\n    wallLines.forEach(l=>{const n=at(l.w.id),c=n.cut>=1&&clipWall(l.w,n.r);l.e.visible=!!c;\n      if(c){l.e.geometry.dispose();l.e.geometry=lineGeo(wallOutline(c,Math.min(H,n.cut)));}});\n    wallFeet.forEach(f=>{f.m.visible=fitBox(f.m,f.box,at(f.id).r,true);});\n    doorCut=id=>morph.w.has(id)?at(id).h*MM:0;\n    // a door and its swing show while its opening is whole in its wall on the way\n    doors.forEach(d=>{const on=doorInFlight(d,at);d.g.visible=on;if(d.frame)d.frame.visible=on;});\n    arcs.children.forEach(l=>{const d=doors.find(x=>x.hole===l.userData.hole);l.visible=!!d&&d.g.visible;});\n    doorGroup.visible=arcs.visible=morph.doors;\n  }else{\n    wallsSeeThrough(edgesOnly?0:1);edgeMat.opacity=edgeOp(V);\n    wallParts.forEach(w=>{\n      const top=Math.min(w.t,cut),fits=top>w.b+.001;\n      w.m.visible=fits&&!feet&&!(edgesOnly&&(w.trim||w.photo))&&(V.Wm==='auto'?w.f():true);\n      w.m.castShadow=!edgesOnly&&!w.glass&&!w.photo;\n      if(fits){w.m.scale.y=(top-w.b)/w.h;w.m.position.y=w.b+(top-w.b)/2;if(w.fit)w.fit(w.m.scale.y);}\n    });\n    // wall edges are redrawn only when the cut height changes\n    if(cutMm!==linesTop){linesTop=cutMm;wallLines.forEach(l=>{l.e.geometry.dispose();l.e.geometry=lineGeo(wallOutline(l.w,Math.min(H,cutMm)));});}\n    wallLines.forEach(l=>l.e.visible=!feet&&(V.Wm==='auto'?l.f():true));\n    doorGroup.visible=V.dm!=='none'&&!feet;arcs.visible=V.dm!=='none'&&V.arcs!==false;   // the walk has doors without swings\n  }\n  doors.forEach(d=>{\n    if(held&&held.d===d){d.t=Math.min(d.max,Math.max(0,d.t+held.dir*HOLD_RATE*dt));d.a=d.t;}\n    else d.a+=(d.t-d.a)*ease(.07);\n    d.g.rotation.y=d.s*d.a;});\n  doorParts.forEach(p=>{if(p.whole){p.m.visible=doorCut(p.wall)>=p.whole-.001;return;}const top=Math.min(p.t,doorCut(p.wall)),fits=top>p.b+.001;p.m.visible=fits;\n    if(fits){p.m.scale.y=(top-p.b)/p.h;p.m.position.y=p.b+(top-p.b)/2;}});\n  wallCut=Math.min(cut,H*MM);wallFeetMode=feet;\n});\n\n<\/script>\n<script>\n/* ---------- views: each tab is a view of the one room ----------\n   A view names the walls it shows (rooms), which walls hide in the cut mode and from which side (fade),\n   its own settings (remembered per view) and its panel. Light and wall colour are shared by all views:\n   their block (#shared) moves into the panel of the view on screen. */\nconst VIEWS={};     // id → {rooms, fade, frame(), sun(), anchor(), defaults, panel, home(), sync(), onDoors(),\n                   //       mouse: the view takes the mouse itself (no orbit), info: its hint under «i» (data-info)}\nconst VS={};        // id → the view's own settings\nlet view=null;      // the view on screen\nconst vs=()=>VS[view];\n\n/* remembered in this browser */\nconst readJSON=k=>{try{return JSON.parse(localStorage.getItem(k)||'null');}catch(e){return null;}};\nconst writeJSON=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}};\nconst viewKey=id=>`eng-view-${id}-v1`;\nfunction saveView(id=view){writeJSON(viewKey(id),VS[id]);}\n\n/* shared settings: light and wall colour */\nconst SKEY='eng-shared-v1';\nconst S={wc:'cocoa',light:{...LIGHT0},edge:true,fly:true};   // edge: the walls' and doors' outlines; fly: the animated flight between tabs\n{ const s=readJSON(SKEY);if(s){if(WALLC[s.wc])S.wc=s.wc;S.light={...LIGHT0,...(s.light||{})};if(s.edge===false)S.edge=false;if(s.fly===false)S.fly=false;} }\nconst saveShared=()=>writeJSON(SKEY,S);\nconst sharedEl=document.getElementById('shared');\n// wall colour swatches\nconst wcs=document.getElementById('wcs');\nwcs.innerHTML=Object.entries(WALLC).map(([k,w])=>`<button class=\"wc\" data-wc=\"${k}\" aria-pressed=\"false\"><i style=\"background:${w.p||w.c}\"><\\/i>${w.n}<\\/button>`).join('');\nconst syncWc=()=>wcs.querySelectorAll('[data-wc]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.wc===S.wc));\nwcs.querySelectorAll('[data-wc]').forEach(b=>b.addEventListener('click',()=>{S.wc=b.dataset.wc;syncWc();applyTheme();saveShared();}));\nsyncWc();\n// the walls' and doors' outlines (walls.js: edgeOp), the same in every view\nconst edgeBox=document.getElementById('wEdge');edgeBox.checked=S.edge;\nedgeBox.addEventListener('change',e=>{S.edge=e.target.checked;saveShared();});\n// the animated flight between tabs; without it the new view's walls are there at once and the camera glides to it\nconst flyBox=document.getElementById('wFly');flyBox.checked=S.fly;\nflyBox.addEventListener('change',e=>{S.fly=e.target.checked;saveShared();});\n// light\nconst lmap={Laz:'az',Lel:'el',Li:'i',La:'a'},lunit={az:'°',el:'°',i:'%',a:'%'};\nfunction syncLight(){Object.entries(lmap).forEach(([id,k])=>{document.getElementById(id).value=S.light[k];document.getElementById('o'+id).textContent=Math.round(S.light[k])+lunit[k];});placeSun();}\nObject.entries(lmap).forEach(([id,k])=>document.getElementById(id).addEventListener('input',e=>{S.light[k]=+e.target.value;syncLight();saveShared();}));\nlet spin=false;const spinBtn=document.getElementById('lightSpin');\nspinBtn.addEventListener('click',()=>{spin=!spin;spinBtn.setAttribute('aria-pressed',spin);spinBtn.textContent=spin?'Остановить':'Вращать свет';if(!spin){syncLight();saveShared();}});\ndocument.getElementById('lightReset').addEventListener('click',()=>{S.light={...LIGHT0};syncLight();saveShared();});\nsyncLight();\nframeHooks.push(dt=>{if(spin){const L=S.light;L.az+=30*dt;if(L.az>180)L.az-=360;syncLight();}});   // one turn in 12 s\n\n/* walls segment and height slider: a view has them in its panel ([data-wm], [data-wh], [data-wh-out]) or keeps its walls as set */\nfunction syncWallCtl(id){\n  const p=VIEWS[id].panel,V=VS[id],wh=p.querySelector('[data-wh]');\n  if(!wh)return;\n  wh.value=V.Wh;p.querySelector('[data-wh-out]').textContent=(V.Wm==='row'?10:V.Wh)+'%';\n  wh.disabled=V.Wm==='row'||V.Wm==='feet';wh.parentElement.style.opacity=wh.disabled?.45:1;\n  p.querySelectorAll('[data-wm]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.wm===V.Wm));\n}\n/* doors segment ([data-dm]) of a view: the apartment's doors all closed, all open (nothing pressed when they differ),\n   or no doors at all in this view. The doors are one for every view: a view with the segment follows them */\nfunction syncDoorCtl(id){\n  const bs=VIEWS[id].panel.querySelectorAll('[data-dm]'),V=VS[id];\n  if(!bs.length)return;\n  let st=V.dm;\n  if(st!=='none'){const open=doors.filter(d=>d.t!==0).length;st=open===doors.length?'open':open===0?'closed':'mixed';if(st!=='mixed')V.dm=st;}\n  bs.forEach(x=>x.setAttribute('aria-pressed',x.dataset.dm===st));\n}\n\n/* a view joins the app: its settings come from this browser, its panel gets the common controls */\nfunction addView(id,def){\n  VIEWS[id]=def;\n  VS[id]=Object.assign(JSON.parse(JSON.stringify(def.defaults)),readJSON(viewKey(id))||{});\n  const p=def.panel;\n  if(!p.querySelector(`[data-wm=\"${VS[id].Wm}\"]`))VS[id].Wm=def.defaults.Wm;   // a walls' mode this view has no button for (a saved one renamed since) — its default\n  p.querySelectorAll('[data-wm]').forEach(b=>b.addEventListener('click',()=>{VS[id].Wm=b.dataset.wm;syncWallCtl(id);saveView(id);}));\n  const wh=p.querySelector('[data-wh]');if(wh)wh.addEventListener('input',e=>{VS[id].Wh=+e.target.value;syncWallCtl(id);saveView(id);});\n  p.querySelectorAll('[data-dm]').forEach(b=>b.addEventListener('click',()=>{\n    const dm=VS[id].dm=b.dataset.dm;if(dm!=='none')doors.forEach(d=>d.t=dm==='open'?d.max:0);\n    saveView(id);doorsChanged();}));\n}\n\n/* a door was clicked or held:\n   every view updates its door controls from the doors as they are and remembers */\nfunction doorsChanged(){Object.keys(VIEWS).forEach(id=>{const v=VIEWS[id],seg=!!v.panel.querySelector('[data-dm]');\n  if(seg)syncDoorCtl(id);if(v.onDoors)v.onDoors();if(seg||v.onDoors)saveView(id);});}\n\n/* the sun aims at the middle of the view and its shadows cover the view (tighter in a room: sharper shadows);\n   the camera mini view frames the view's frame, or the whole apartment */\nfunction aimView(){const vw=VIEWS[view],s=vw.sun();aimSun(s.x,s.y,s.z,s.half);frameInset(insetFrame(vw));}\n// the part of the apartment the mini view keeps in its shot: the view's frame or the whole apartment (mm: x0 x1 z0 z1)\nconst insetFrame=vw=>vw.frame?vw.frame():[BOX.x0,BOX.x1,BOX.z0,BOX.z1];\nconst insetNow=()=>[apt.min.x,apt.max.x,apt.min.z,apt.max.z].map(v=>v/MM);\nfunction frameInset(f){apt.min.set(f[0]*MM,0,f[2]*MM);apt.max.set(f[1]*MM,H*MM,f[3]*MM);}\nmodelHooks.push(()=>{if(tr){tr=null;camDrive=null;}if(view)aimView();});   // the walls were just built anew for the view: a flight is over\n\n/* ---------- a flight between views ----------\n   One progress p (eased: e) moves everything together: the camera from where it was to the new view's goal,\n   the walls (walls.js: morph), the sun and its shadows,\n   the part of the apartment the mini view shows.\n   A click on another tab in the middle starts a new flight from what is on screen. Orbiting, panning or zooming\n   takes the camera back from the flight; the rest finishes */\nconst FLY=.85;   // seconds\nlet tr=null;     // {p, e, cam0, sun0, sunT, box0, boxT, pres0: how much of each view was on screen at the start}\nconst inTransition=()=>!!tr;\n// how much of a view is on screen: 1 or 0, in between while flying (the room's names, the walk's wide angle)\nfunction presence(id){const t=view===id?1:0;return tr?tr.pres0[id]+(t-tr.pres0[id])*tr.e:t;}\nfunction driveCam(){const c=tr.cam0,e=tr.e;\n  cam.theta=c.theta+(goal.theta-c.theta)*e;cam.phi=c.phi+(goal.phi-c.phi)*e;cam.r=c.r+(goal.r-c.r)*e;cam.target.copy(c.t).lerp(goalT,e);}\nfunction endTransition(){\n  tr=null;\n  if(camDrive===driveCam){camDrive=null;cam.theta=goal.theta;cam.phi=goal.phi;cam.r=goal.r;cam.target.copy(goalT);}\n  buildWalls(VIEWS[view]);aimView();\n}\npreHooks.push(dt=>{\n  if(!tr)return;\n  tr.p=Math.min(1,tr.p+dt/FLY);const e=tr.e=tr.p*tr.p*(3-2*tr.p);\n  if(morph)morph.e=e;\n  const a=tr.sun0,b=tr.sunT,l=(u,v)=>u+(v-u)*e;\n  aimSun(l(a.x,b.x),l(a.y,b.y),l(a.z,b.z),l(a.half,b.half));\n  frameInset(tr.box0.map((v,i)=>l(v,tr.boxT[i])));\n  if(tr.p>=1)endTransition();\n});\n\n/* show a view: its panel, its walls, its camera — where it was left, or the view's home on the first visit.\n   animate=false puts everything there at once (first load); otherwise it is a flight, or without the animated flight\n   (the shared setting) the new view's walls at once and the camera gliding there (a jump with reduced motion) */\n// the camera of each view, its target kept from the view's anchor (a room's origin): when the plan moves the room, the camera goes with it\nconst camMem={};\nconst anchorOf=id=>{const a=VIEWS[id].anchor?VIEWS[id].anchor():[0,0];return new THREE.Vector3(a[0]*MM,0,a[1]*MM);};\nfunction showView(id,animate=true){\n  if(!VIEWS[id])id='plan';\n  if(id===view)return;\n  // what is on screen now: the flight starts from here\n  const fly=animate&&!reduce&&S.fly&&view!==null;\n  let start=null;\n  if(fly){const pres0={};Object.keys(VIEWS).forEach(k=>{pres0[k]=presence(k);});const s=sun.target.position;\n    start={walls:wallsNow(),pres0,cam0:{theta:cam.theta,phi:cam.phi,r:cam.r,t:cam.target.clone()},sun0:{x:s.x,y:s.y,z:s.z,half:sunHalf},box0:insetNow()};}\n  if(view)camMem[view]={theta:goal.theta,phi:goal.phi,r:goal.r,t:goalT.clone().sub(anchorOf(view))};\n  view=id;const vw=VIEWS[id];\n  Object.values(VIEWS).forEach(v=>{v.panel.hidden=v!==vw;});\n  // light and wall colour in its panel, if it has a place for them; the hint under «i» of the view\n  const slot=vw.panel.querySelector('[data-shared-slot]');if(slot)slot.appendChild(sharedEl);sharedEl.hidden=!slot;\n  document.querySelectorAll('#infoBtn [data-info]').forEach(t=>{t.hidden=t.dataset.info!==(vw.info||'orbit');});\n  const m=camMem[id];\n  if(m){goal.theta=m.theta;goal.phi=m.phi;goal.r=m.r;goalT.copy(m.t).add(anchorOf(id));shortWay();}else vw.home();\n  if(fly){\n    startWallMorph(start.walls,id,goalPosition());\n    tr={p:0,e:0,cam0:start.cam0,sun0:start.sun0,sunT:vw.sun(),box0:start.box0,boxT:insetFrame(vw),pres0:start.pres0};camDrive=driveCam;\n  }else{\n    tr=null;if(camDrive===driveCam)camDrive=null;buildWalls(vw);aimView();\n    if(!animate||reduce){cam.theta=goal.theta;cam.phi=goal.phi;cam.r=goal.r;cam.target.copy(goalT);}\n  }\n  syncWallCtl(id);syncDoorCtl(id);if(vw.sync)vw.sync();applyTheme();\n}\n\n<\/script>\n<script>\n/* ---------- «Комната» view: the whole room, plan dimensions, camera presets, the sizes, what the plan assumes ---------- */\n/* ---------- dimension lines ---------- */\nconst labels=[];\nconst LABEL_H=.15;   // m: a plan label's height in the scene (engine.js: dimLabel, fitLabels)\nfunction label(text){const s=dimLabel(text,LABEL_H);labels.push(s);return s;}\nconst dimMat=new THREE.LineBasicMaterial({color:0x2f5d50,depthTest:false,transparent:true});\nconst dimsGroup=new THREE.Group();scene.add(dimsGroup);\n// a dimension line from a to b (m) with ticks ±t at its ends and its label in the middle\nfunction dimLine(g,a,b,t,txt){\n  const pts=[a,b,a.clone().add(t),a.clone().sub(t),b.clone().add(t),b.clone().sub(t)];\n  const l=new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(pts),dimMat);l.renderOrder=19;g.add(l);\n  const s=label(txt);s.position.copy(a).add(b).multiplyScalar(.5);g.add(s);\n}\n// a plan dimension: on the cut walls, ticks across it\nfunction dim(x0,z0,x1,z1,txt){\n  const a=new THREE.Vector3(x0*MM,0,z0*MM),b=new THREE.Vector3(x1*MM,0,z1*MM);\n  const d=b.clone().sub(a).normalize();dimLine(dimsGroup,a,b,new THREE.Vector3(-d.z,0,d.x).multiplyScalar(.05),txt);\n}\n// the window's dimensions stand at the window itself, on the room face of its wall: width × height across its middle, the sill height from the floor beside it; they show with the window\nconst winDims=new THREE.Group();scene.add(winDims);\nfunction buildWinDims(){\n  const z=(A.L-10)*MM,x0=(winX-A.winW/2)*MM,x1=(winX+A.winW/2)*MM,y=(A.winS+A.winT)/2*MM,xs=(winX-A.winW/2-150)*MM;\n  dimLine(winDims,new THREE.Vector3(x0,y,z),new THREE.Vector3(x1,y,z),new THREE.Vector3(0,.05,0),`${A.winW} × ${A.winT-A.winS}`);\n  dimLine(winDims,new THREE.Vector3(xs,0,z),new THREE.Vector3(xs,A.winS*MM,z),new THREE.Vector3(.05,0,0),`${A.winS}`);\n  dimLine(winDims,new THREE.Vector3(xs,A.winT*MM,z),new THREE.Vector3(xs,H*MM,z),new THREE.Vector3(.05,0,0),`${H-A.winT}`);\n}\n// the doorway's height stands at the doorway too: from the floor up on the room face of its wall, 150 left of its left casing; it shows with the lintel over it, to a camera in the room (else it would show through the wall)\nconst doorDims=new THREE.Group();scene.add(doorDims);\nfunction buildDoorDims(){\n  const x=(dL-150)*MM,z=10*MM;\n  dimLine(doorDims,new THREE.Vector3(x,0,z),new THREE.Vector3(x,A.dH*MM,z),new THREE.Vector3(.05,0,0),`${A.dH}`);\n}\n// dimension lines are computed from A; when the sizes change they are rebuilt the next time they are on screen\nlet dimsDirty=true;\nfunction buildDims(){\n  [dimsGroup,winDims,doorDims].forEach(g=>g.children.slice().forEach(o=>{g.remove(o);if(o.isSprite){o.material.map.dispose();o.material.dispose();}else o.geometry.dispose();}));   // sprites share one geometry\n  labels.length=0;\n  const zd=-A.tD/2,zw=A.L+A.tW/2,xr=dL+2*CW+A.dW;   // on the door wall, on the window wall; the right casing's outer edge\n  dim(0,zd,dL,zd,`${dL}`);dim(dL,zd,xr,zd,`${xr-dL}`);dim(xr,zd,A.W,zd,`${A.dR}`);   // the door wall: left of the door, the door with its casings, right of it\n  dim(dL+CW,250,xr-CW,250,`дверь ${A.dW}`);\n  dim(0,A.L-400,A.W,A.L-400,`${A.W}`);\n  dim(250,0,250,A.L,`${A.L}`);dim(A.W-250,0,A.W-250,A.L,`${A.L}`);\n  const w0=winX-A.winW/2,w1=winX+A.winW/2;\n  dim(0,zw,w0,zw,`${w0}`);dim(w0,zw,w1,zw,`окно ${A.winW}`);dim(w1,zw,A.W,zw,`${A.W-w1}`);\n  buildWinDims();buildDoorDims();\n  dimsDirty=false;\n}\n\n\n// distance at which the whole room fits the frame from straight above\nfunction fitR(wmm=BOX.x1-BOX.x0,dmm=BOX.z1-BOX.z0){\n  const t=Math.tan(camera.fov*Math.PI/360),w=wmm*MM,d=dmm*MM;\n  return Math.max(d/2/t,w/2/(t*(camera.aspect||1)))*1.12+H*MM;   // + wall height: the wall tops are that much closer to the camera\n}\n// camera presets of the plan (buttons «Камера»)\nfunction setCam(v){\n  const f=fitR();\n  const views={\n    plan:[-.6,.62,f*1.05,CX,.3,CZ],                     // from the corner of the window and the left walls: the door wall and the right wall\n    top:[0,.0005,f,CX,0,CZ],\n    door:[-.25,1.0,f*.95,CX,.6,CZ],                     // over the window wall, looking at the door\n    window:[Math.PI-.35,.95,f*.95,CX,.6,CZ]             // over the door wall, looking at the window\n  };\n  const s=views[v];goal.theta=s[0];goal.phi=s[1];goal.r=s[2];goalT.set(s[3],s[4],s[5]);\n  shortWay();\n}\n\n/* ---------- panel ---------- */\nconst planPanel=document.querySelector('[data-panel=\"plan\"]');\nconst pq=s=>planPanel.querySelector(s);\npq('[data-cams]').querySelectorAll('[data-cam]').forEach(b=>b.addEventListener('click',()=>setCam(b.dataset.cam)));\nconst row=(k,v,q)=>`<dt>${k}<\\/dt><dd${q?' class=\"q\"':''}>${v}<\\/dd>`;\n// what the plan assumes, in numbers: redrawn when the sizes change\nconst area=()=>(A.W*A.L/1e6).toFixed(2).replace('.',',');\nfunction renderFacts(){\n  pq('#pFacts').innerHTML=\n    `<dl class=\"facts\">${\n      row('Стены',`${A.W} × ${A.L}, площадь ${area()} м²`)+row('Потолок',H)+\n      row('Дверь',`${A.dW} между наличниками ${CW}, проём ${dB-dA} × ${A.dH}`)+\n      row('Стена с дверью',`${dL} + ${CW} + ${A.dW} + ${CW} + ${A.dR}`)+\n      row('Окно',`${A.winW}, от пола ${A.winS} до ${A.winT}, по центру стены`)+\n      row('Стена с окном',`${winX-A.winW/2} + ${A.winW} + ${A.W-winX-A.winW/2}`)+\n      row('Стены',`обои «светлое какао», текстура ткани; лепнина ${A.cornH}, плинтус ${A.plH}`)+\n      row('Фотообои',A.muralWall?`${A.muralW} × ${A.muralH} от плинтуса, ${A.muralWall==='right'?'слева':'справа'} от входа; на стене ${Math.min(A.muralW,A.L)}`:'нет')+\n      row('Толщина стен',`с дверью ${A.tD}, боковые ${A.tS}, с окном ${A.tW}`,true)}<\\/dl>`;\n  pq('#pSub').textContent=`${A.W} × ${A.L} мм · ${area()} м² · потолок ${H}`;\n}\nrenderFacts();\n\n/* the plan's own settings: dimensions, the room's name, the floor colour */\nfunction syncPlan(){\n  const V=VS.plan;\n  pq('#pDims').checked=V.dims;pq('#pNames').checked=V.names;pq('#pFloors').checked=V.floors;\n}\npq('#pDims').addEventListener('change',e=>{VS.plan.dims=e.target.checked;saveView('plan');});\npq('#pNames').addEventListener('change',e=>{VS.plan.names=e.target.checked;saveView('plan');});\npq('#pFloors').addEventListener('change',e=>{VS.plan.floors=e.target.checked;applyTheme();saveView('plan');});\n\n/* ---------- wall sizes: edited only here, the walk takes them as they are ----------\n   A slider stops at the last value where everything still fits and says what is in the way */\nconst SIZES=[\n  ['Комната',[\n    {k:'H',n:'Высота потолка',min:2400,max:3600,step:10},\n    {k:'W',n:'Стена с дверью и стена с окном',min:2000,max:6000,step:10},\n    {k:'L',n:'Боковые стены',min:2000,max:6000,step:1},\n    {k:'tD',n:'Толщина стены с дверью',min:50,max:600,step:10},\n    {k:'tS',n:'Толщина боковых стен',min:50,max:600,step:10},\n    {k:'tW',n:'Толщина стены с окном',min:100,max:800,step:10}]],\n  ['Дверь',[\n    {k:'dR',n:'От правого угла до наличника',min:0,max:5000,step:10},\n    {k:'dW',n:'Ширина между наличниками',min:500,max:1200,step:10},\n    {k:'dH',n:'Высота проёма',min:1800,max:2600,step:10}]],\n  ['Отделка',[\n    {k:'cornH',n:'Лепнина под потолком: высота',min:0,max:300,step:5},\n    {k:'plH',n:'Плинтус: высота',min:0,max:200,step:5},\n    {k:'muralW',n:'Фотообои: ширина',min:1000,max:8000,step:10},\n    {k:'muralH',n:'Фотообои: высота',min:1000,max:3000,step:10}]],\n  ['Окно',[\n    {k:'winW',n:'Ширина',min:400,max:3000,step:10},\n    {k:'winS',n:'Низ от пола',min:0,max:1500,step:10},\n    {k:'winT',n:'Верх от пола',min:1200,max:3500,step:10}]]\n];\nconst sizeFields=SIZES.flatMap(([,fs])=>fs);\nsizeFields.forEach(f=>{f.get=f.get||(a=>a[f.k]);f.set=f.set||((a,v)=>({...a,[f.k]:v}));});\npq('#pSizes').innerHTML=SIZES.map(([g,fs])=>`<div><h3>${g}, мм<\\/h3>${fs.map(f=>\n  `<div class=\"field\"><label for=\"pS-${f.k}\">${f.n}<\\/label><output data-size-out=\"${f.k}\"><\\/output><input type=\"range\" id=\"pS-${f.k}\" data-size=\"${f.k}\" min=\"${f.min}\" max=\"${f.max}\" step=\"${f.step}\"><\\/div>`).join('')}<\\/div>`).join('');\nconst sizeMsg=pq('#pSizeMsg');\nfunction syncSizes(){sizeFields.forEach(f=>{const v=f.get(A);pq(`[data-size=\"${f.k}\"]`).value=v;pq(`[data-size-out=\"${f.k}\"]`).textContent=v;});\n  planPanel.querySelectorAll('[data-mural]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mural===A.muralWall));}\n// the photo wallpaper's wall: kept with the sizes (A.muralWall)\nplanPanel.querySelectorAll('[data-mural]').forEach(b=>b.addEventListener('click',()=>{\n  const a={...A,muralWall:b.dataset.mural},why=aptProblems(a)[0];if(why){sizeMsg.textContent=`Нельзя: ${why}`;return;}setModel(a);}));\n// the value v if everything fits with it; otherwise the last one toward v that fits (on the slider's step from the current value)\nfunction fitSize(f,v){\n  const cur=f.get(A),bad=aptProblems(f.set(A,v));\n  if(!bad.length||aptProblems(A).length)return {v,why:''};\n  let lo=cur,hi=v;\n  while(Math.abs(hi-lo)>1){const mid=Math.round((lo+hi)/2);if(aptProblems(f.set(A,mid)).length)hi=mid;else lo=mid;}\n  return {v:cur+Math.trunc((lo-cur)/f.step)*f.step,why:bad[0]};\n}\nsizeFields.forEach(f=>pq(`[data-size=\"${f.k}\"]`).addEventListener('input',e=>{\n  const {v,why}=fitSize(f,+e.target.value);\n  if(v!==f.get(A))setModel(f.set(A,v));\n  syncSizes();sizeMsg.textContent=why?`Дальше нельзя: ${why}`:'';\n}));\nsyncSizes();\nconst sizesBox=pq('#pSizesBox');\n{ const s=readJSON('eng-plan-sizes');sizesBox.open=s!==false; }\nsizesBox.addEventListener('toggle',()=>writeJSON('eng-plan-sizes',sizesBox.open));\n\n// sizes as the starting ones: in this browser, or as a code to send to the chat so they become the defaults for everyone\nconst aMsg=pq('#pAMsg');\npq('#pSaveA').addEventListener('click',()=>{try{localStorage.setItem(MKEY,JSON.stringify(modelDiff()));aMsg.textContent='Сохранено в этом браузере';}catch(e){aMsg.textContent='Браузер не дал сохранить. Скопируйте код и пришлите в чат';}});\npq('#pResetA').addEventListener('click',()=>{try{localStorage.removeItem(MKEY);}catch(e){}setModel({});aMsg.textContent='Исходные размеры возвращены';sizeMsg.textContent='';});\npq('#pCopyA').addEventListener('click',()=>{\n  const ta=pq('#pACode');ta.value=JSON.stringify(modelDiff());\n  (navigator.clipboard?navigator.clipboard.writeText(ta.value):Promise.reject()).then(()=>{aMsg.textContent='Код скопирован';}).catch(()=>{ta.hidden=false;ta.focus();ta.select();aMsg.textContent='Выделено — нажмите Ctrl+C';});\n});\n\n// the sizes changed: the plan's dimensions, numbers and sliders follow\nmodelHooks.push(()=>{dimsDirty=true;renderFacts();syncSizes();});\n\n/* every frame: dimensions and the room's name belong to the plan; dimension lines lie on the cut walls, the window's and the doorway height stand at them */\ninsetHide.push(dimsGroup,winDims,doorDims);\nframeHooks.push(()=>{\n  // dimensions come when the plan is reached; room floors and names change halfway (room views have the plain floor, as before)\n  const on=view==='plan'&&!inTransition(),half=presence('plan')>=.5;\n  dimsGroup.visible=on&&VS.plan.dims;namesGroup.visible=half&&VS.plan.names;roomGroup.visible=half;\n  if(dimsGroup.visible&&dimsDirty)buildDims();\n  dimsGroup.position.y=(wallFeetMode?0:wallCut)+.02;\n  winDims.visible=dimsGroup.visible&&wallParts.some(w=>w.glass&&w.m.visible);   // the window's glass is on screen\n  doorDims.visible=dimsGroup.visible&&camera.position.z>0&&wallParts.some(w=>w.id==='door'&&Math.abs(w.b-A.dH*MM)<1e-6&&w.m.visible);   // the lintel over the doorway is on screen, seen from the room\n  // dimension labels: readable near, shrinking with the plan far (engine.js: fitLabels)\n  if(dimsGroup.visible)fitLabels(labels);\n});\n\n/* the area of a room's name under the cursor: its floor is tinted and framed by a band along the walls, drawn over them */\nconst HOVER_BAND=40;   // mm, inward from the outline\nconst hoverFillMat=new THREE.MeshBasicMaterial({color:0x2f5d50,depthTest:false,transparent:true,opacity:.14,side:THREE.DoubleSide});\nconst hoverBandMat=new THREE.MeshBasicMaterial({color:0x2f5d50,depthTest:false,transparent:true,opacity:.9,side:THREE.DoubleSide});\nconst hoverFrame=new THREE.Group();hoverFrame.visible=false;scene.add(hoverFrame);\n// the outline moved inward by d: each corner along the bisector of its two edges (mitred), mm\nfunction insetPoly(q,d){\n  const n=q.length,ccw=polySigned(q)>0;\n  const nrm=(a,b)=>{const dx=b[0]-a[0],dz=b[1]-a[1],l=Math.hypot(dx,dz);return ccw?[-dz/l,dx/l]:[dz/l,-dx/l];};   // the edge's inward normal\n  return q.map((p,i)=>{const a=nrm(q[(i+n-1)%n],p),b=nrm(p,q[(i+1)%n]),k=d/(1+a[0]*b[0]+a[1]*b[1]);return [p[0]+(a[0]+b[0])*k,p[1]+(a[1]+b[1])*k];});\n}\nfunction bandGeometry(q,d){\n  const r=insetPoly(q,d),n=q.length,pos=[],idx=[];\n  q.forEach((p,i)=>{pos.push(p[0]*MM,0,p[1]*MM,r[i][0]*MM,0,r[i][1]*MM);const j=(i+1)%n;idx.push(2*i,2*j,2*j+1,2*i,2*j+1,2*i+1);});\n  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setIndex(idx);return g;\n}\nlet hoverRoom=-1;\nfunction setHoverRoom(i){\n  if(i===hoverRoom)return;hoverRoom=i;\n  emptyGroup(hoverFrame,false);\n  if(i<0){hoverFrame.visible=false;return;}\n  const q=roomPoly(ROOMS[i]);\n  const fill=new THREE.Mesh(polyFloorGeometry(q),hoverFillMat);fill.renderOrder=17;\n  const band=new THREE.Mesh(bandGeometry(q,HOVER_BAND),hoverBandMat);band.renderOrder=18;\n  hoverFrame.add(fill,band);hoverFrame.visible=true;\n}\n// which room's area is under the cursor (-1: none): labelHits — the ray through the names, sceneHits — through the whole scene.\n// Only over the area («13,00 м²»), not the whole inscription, and only where it is seen: anything in front of it (a wall, a door)\n// hides it. The names themselves and the frame don't count, nor a part of a surface clipped away\nconst inGroup=(o,g)=>{while(o){if(o===g)return true;o=o.parent;}return false;};\nconst clippedAt=h=>[].concat(h.object.material||[]).some(m=>m&&m.clippingPlanes&&m.clippingPlanes.some(p=>p.distanceToPoint(h.point)<0));\nfunction roomUnderCursor(labelHits,sceneHits){\n  const h=labelHits[0],i=h?nameTexts.findIndex(n=>n.m===h.object):-1;\n  if(i<0)return -1;\n  const [u0,u1]=areaSpan(nameTexts[i]);if(!h.uv||h.uv.x<u0||h.uv.x>u1)return -1;\n  const front=sceneHits.find(x=>hittable(x)&&!inGroup(x.object,namesGroup)&&!inGroup(x.object,hoverFrame)&&!clippedAt(x));\n  return front&&front.distance<h.distance-1e-4?-1:i;\n}\ncanvas.addEventListener('pointermove',e=>{\n  if(view!=='plan'||inTransition()||!namesGroup.visible||e.buttons){setHoverRoom(-1);return;}\n  aimRay(e);\n  const lh=ray.intersectObjects(nameTexts.map(n=>n.m));\n  setHoverRoom(lh.length?roomUnderCursor(lh,ray.intersectObjects(scene.children,true)):-1);\n});\ncanvas.addEventListener('pointerleave',()=>setHoverRoom(-1));\nmodelHooks.push(()=>setHoverRoom(-1));   // the sizes changed: the frame is gone until the cursor moves\nframeHooks.push(()=>{if(hoverRoom>=0){if(!namesGroup.visible)setHoverRoom(-1);else hoverFrame.position.y=(wallFeetMode?0:wallCut)+.02;}});\n\naddView('plan',{\n  rooms:'all',\n  // the cut mode hides a wall while the camera looks at it from outside the room\n  fade:Object.fromEntries(WALLS.filter(w=>w.ext).map(w=>[w.id,w.ext])),\n  defaults:{Wm:'auto',Wh:100,dm:'closed',dims:true,names:true,floors:true},\n  sun:()=>({x:CX,y:0,z:CZ,half:4.6}),   // shadows cover the whole room from any direction\n  panel:planPanel,\n  home:()=>setCam('plan'),\n  sync:syncPlan\n});\nif(VS.plan.dm!=='none')doors.forEach(d=>d.t=VS.plan.dm==='open'?d.max:0);\n\n<\/script>\n<script>\n/* ---------- «Обход»: the room from the eyes, walked through as in a game ----------\n   W A S D or the arrows — walk (two fingers on a trackpad too: up — forward, down — back, to the sides — sideways, any angle\n   between; the mouse's wheel — forward and back), the mouse — look (a click on the scene takes the mouse, Esc or the right button gives it back; where the browser\n   does not let the page take it, drag to look), Space — jump, Ctrl or C — crouch, Shift — a slow step, E or a click — the door or\n   cabinet front in the middle of the screen (under the cursor while dragging); the mouse taken, the button held HOLD_MS moves it\n   gradually, as a long press in the other views, a shorter press opens or closes it on release. On a touch screen a finger in the lower left corner of\n   the scene (a square of STICK_ZONE of its width) holds a stick (the circle comes under it): the farther from its centre, the\n   faster the walk; elsewhere a finger looks; a tap is the door under the finger. The panel sets the eye height, the walls' look, the doors, and has the common wall colour (with\n   the outlines) and light.\n   The camera is the orbit's, its centre a step (LOOK) in front of the eyes: a flight to the walk and from it, and the camera\n   remembered for the view, work as in any view. Walls (however they look) and the closed door stop the walker;\n   with «Без двери» the doorway is free */\nconst walkPanel=document.querySelector('[data-panel=\"walk\"]');\nconst LOOK=1;                       // m: the orbit's centre in front of the eyes\nconst BODY=.15;                     // m: the walker seen from above is a circle of this radius (a person turned sideways)\nconst STEP=.3;                      // m: what is lower than this above the feet is stepped over (plinths, a low sill)\nconst RUN=2.4,SLOW=1.2,LOW=.9;      // m/s: walking, with Shift, crouching\nconst JUMP=3.3,GRAV=12;             // m/s, m/s²: a jump of about 45 cm\nconst CROUCH_K=.32;                 // crouching lowers the eyes by this share\nconst OPEN_A=1;                     // rad: a door open this far lets the walker through\nconst SENS=.0025;                   // rad per pixel of the mouse\nconst SENS_TOUCH=2;                 // a finger turns the eyes this many times more: a phone's screen is small\nconst FOV0=camera.fov,FOV_WALK=62;  // the walk sees wider, like a game\n/* the trackpad: what two fingers moved (the wheel's delta) is a way to go in the eyes' frame, PAD m per pixel, gone at the gait's\n   speed and no more than PAD_LAG s of it behind (the rest of a fast swipe and of the system's glide is dropped) */\nconst PAD=.004,PAD_LAG=.15;\nconst pad={f:0,s:0};                // m still to go: forward, to the right\n\nconst keys=new Set();let jumpQ=false;\n/* the stick of a touch screen: the finger's offset from where it came down, a share of STICK_R; a little of it (STICK_DEAD) is\n   no step yet, so a tap does not walk */\nconst STICK_R=48,STICK_DEAD=.15;    // px (the circle's radius in the page), share\nconst STICK_ZONE=.33;               // the stick's corner: a square this share of the scene's width (no taller than the scene)\nlet stick=null;                     // {id, x0, y0: where the finger came down, x, y: where it is} (client px)\nlet touchUI=!!(window.matchMedia&&matchMedia('(hover: none) and (pointer: coarse)').matches),stickUsed=false;\nfunction stickOff(){   // the knob's offset, px, no farther than the circle\n  if(!stick)return [0,0];\n  const dx=stick.x-stick.x0,dy=stick.y-stick.y0,m=Math.hypot(dx,dy),k=m>STICK_R?STICK_R/m:1;\n  return [dx*k,dy*k];\n}\nfunction stickVec(){   // right, down: 0…1 together\n  const [dx,dy]=stickOff(),m=Math.hypot(dx,dy)/STICK_R;\n  if(m<STICK_DEAD)return [0,0];\n  const k=(m-STICK_DEAD)/(1-STICK_DEAD)/m/STICK_R;\n  return [dx*k,dy*k];\n}\nconst pl={on:false,feet:0,vy:0,c:0,vx:0,vz:0};   // the walker: feet above the floor (m), vertical speed, crouch 0…1, speed (m/s)\nconst walking=()=>view==='walk'&&!inTransition();\nconst locked=()=>!!document.pointerLockElement&&document.pointerLockElement===canvas;\n\n/* the eyes: where the orbit puts the camera (goal), and back */\nconst lookDir=()=>{const sp=Math.sin(goal.phi);return [sp*Math.sin(goal.theta),Math.cos(goal.phi),sp*Math.cos(goal.theta)];};\nfunction eyeNow(){const d=lookDir();return [goalT.x+goal.r*d[0],goalT.y+goal.r*d[1],goalT.z+goal.r*d[2]];}\nfunction setEye(x,y,z){const d=lookDir();goalT.set(x-goal.r*d[0],y-goal.r*d[1],z-goal.r*d[2]);}\n// the eye height standing (m): as set, low enough for a jump under the ceiling\nconst eyeH=()=>Math.min(VS.walk.eye*MM,H*MM-.6);\nfunction look(dx,dy,k=1){\n  const e=eyeNow();\n  goal.theta-=dx*SENS*k;goal.phi=Math.min(Math.PI-.08,Math.max(.08,goal.phi-dy*SENS*k));\n  setEye(...e);\n}\n/* the first visit: in the room a step from the door, in the middle of the doorway, looking toward the window */\nfunction walkHome(){goal.theta=Math.PI;goal.phi=Math.PI/2;goal.r=LOOK;setEye((dA+dB)/2*MM,eyeH(),.6);shortWay();}\n\n/* ---------- what is in the way, m: [x0,x1,z0,z1,y0,y1] ----------\n   The walls without their openings (rebuilt with the sizes); a window is not a way through; a door opening is while its door\n   is open */\nlet wallBoxes=[],doorways=[];\nfunction walkWalls(){\n  wallBoxes=[];doorways=[];\n  WALLS.forEach(w0=>{\n    const w=clipWall(w0,null),[x0,x1,z0,z1]=w.r;\n    const box=(a,b,y0,y1)=>(w.along?[a,b,z0,z1]:[x0,x1,a,b]).map(v=>v*MM).concat([y0*MM,y1*MM]);\n    let cur=w.along?x0:z0;const end=w.along?x1:z1;\n    w.holes.forEach(([a,b,h,sill=0],i)=>{\n      if(a>cur)wallBoxes.push(box(cur,a,0,H));\n      if(sill>0)wallBoxes.push(box(a,b,0,H));\n      else{wallBoxes.push(box(a,b,h,H));doorways.push({hole:w.id+':'+i,b:box(a,b,0,h)});}\n      cur=b;});\n    if(end>cur)wallBoxes.push(box(cur,end,0,w.h||H));   // a low wall (the shower step) is lower than STEP: stepped over\n  });\n}\nwalkWalls();modelHooks.push(walkWalls);\nfunction walkObstacles(){\n  const shut=new Set(VS.walk.dm==='none'?[]:doors.filter(d=>d.a<OPEN_A).map(d=>d.hole));\n  return wallBoxes.concat(doorways.filter(w=>shut.has(w.hole)).map(w=>w.b));\n}\n// how far the circle's centre at u is from the box b along axis i (0: x, 1: z); 0 inside its span\nconst gap=(b,i,u)=>Math.max(b[2*i]-u,0,u-b[2*i+1]);\nconst hits=(b,x,z,lo,hi)=>hi>b[4]&&lo<b[5]&&gap(b,0,x)**2+gap(b,1,z)**2<BODY*BODY;\n/* a move from x   const [sx,sy]=stickVec();\n  const f=Math.max(keyOn('KeyW'),keyOn('ArrowUp'))-Math.max(keyOn('KeyS'),keyOn('ArrowDown'))-sy,s=Math.max(keyOn('KeyD'),keyOn('ArrowRight'))-Math.max(keyOn('KeyA'),keyOn('ArrowLeft'))+sx;\n  const th=goal.theta;let wx=-Math.sin(th)*f+Math.cos(th)*s,wz=-Math.cos(th)*f-Math.sin(th)*s;\n  const n=Math.hypot(wx,wz),top=gait()*Math.min(1,n);\n  if(n){wx*=top/n;wz*=top/n;}\n  const a=Math.min(1,dt*(ground?20:2));pl.vx+=(wx-pl.vx)*a;pl.vz+=(wz-pl.vz)*a;\n  if(ground&&jumpQ){pl.vy=JUMP;jumpQ=false;}\n  pl.vy-=GRAV*dt;pl.feet=Math.max(0,pl.feet+pl.vy*dt);if(pl.feet===0&&pl.vy<0)pl.vy=0;\n  // the trackpad's way: a step of it at the gait's speed, on top of the keys'\n  let px=0,pz=0;const pm=Math.hypot(pad.f,pad.s);\n  if(pm>1e-9){\n    const g=gait(),lag=Math.min(pm,g*PAD_LAG),k=Math.min(lag,g*dt)/pm,f=pad.f*k,s=pad.s*k;\n    pad.f=pad.f*lag/pm-f;pad.s=pad.s*lag/pm-s;\n    px=-Math.sin(th)*f+Math.cos(th)*s;pz=-Math.cos(th)*f-Math.sin(th)*s;\n  }\n  const [x,z,fx,fz]=walkSlide(ex,ez,pl.vx*dt+px,pl.vz*dt+pz,pl.feet+STEP,pl.feet+eye+.1);\n  if(!fx)pl.vx=0;if(!fz)pl.vz=0;if(!fx||!fz)pad.f=pad.s=0;   // into something: what is left of the swipe does not push on\n  setEye(x,pl.feet+eye,z);\n}\npreHooks.push(dt=>{\n  if(!walking()){letGo();pl.on=false;pad.f=pad.s=0;if(view!=='walk'){keys.clear();jumpQ=false;stick=null;}if(camDrive===walkCam)camDrive=null;return;}\n  // the button held long enough takes the door in the aim (none there: nothing, till the button is up)\n  if(press&&!press.long&&(press.s+=dt)>=HOLD_MS/1000){\n    press.long=true;const rc=canvas.getBoundingClientRect();\n    press.d=pickDoor({clientX:rc.left+rc.width/2,clientY:rc.top+rc.height/2});if(press.d)holdDoor(press.d);\n  }\n  walkStep(dt);camDrive=walkCam;\n});\n\n/* ---------- the mouse and the keys ---------- */\n// the door or cabinet front at a point of the canvas (the middle of the screen while the mouse is taken), or an item with a click of its own\nfunction useDoor(cx,cy){\     // a fresh app reads its view from appView; a loaded one flies there
    try{const w=fr.contentWindow;if(w&&w.showView)w.showView(cur);}catch(e){}
    tabs.forEach(t=>document.querySelector(`[data-tab="${t}"]`).setAttribute('aria-current',t===cur?'page':'false'));
    tabs.forEach(t=>document.querySelector(`[data-pick="${t}"]`).setAttribute('aria-current',t===cur?'page':'false'));
    pickLabel.textContent=document.querySelector(`[data-tab="${cur}"]`).textContent;
    pickClose(false);
  }
  /* the tabs and the save button in one row: when the row of tabs does not fit, the open tab only, the others in its menu */
  const bar=document.querySelector('.bar'),nav=document.querySelector('.tabs'),
    pickBtn=document.getElementById('pickBtn'),pickMenu=document.getElementById('pickMenu'),pickLabel=document.getElementById('pickLabel');
  tabs.forEach(t=>{const src=document.querySelector(`[data-tab="${t}"]`),a=document.createElement('a');
    a.href='#'+t;a.dataset.pick=t;a.setAttribute('role','menuitem');a.textContent=src.textContent;pickMenu.appendChild(a);});
  function fitBar(){
    // the row as it would be: measured with the tabs shown, in the same frame, so nothing flickers
    bar.removeAttribute('data-compact');
    const cs=getComputedStyle(bar),have=bar.clientWidth-(parseFloat(cs.paddingLeft)||0)-(parseFloat(cs.paddingRight)||0);
    const need=nav.scrollWidth+(parseFloat(cs.columnGap)||16)+save.offsetWidth;
    if(need>have)bar.setAttribute('data-compact','');else pickClose(false);
  }
  const items=()=>[...pickMenu.querySelectorAll('[data-pick]')];
  function pickOpen(){
    pickMenu.hidden=false;pickBtn.setAttribute('aria-expanded','true');
    (items().find(a=>a.getAttribute('aria-current')==='page')||items()[0]).focus();
  }
  function pickClose(focus){
    if(pickMenu.hidden)return;
    pickMenu.hidden=true;pickBtn.setAttribute('aria-expanded','false');if(focus)pickBtn.focus();
  }
  pickBtn.addEventListener('click',()=>pickMenu.hidden?pickOpen():pickClose(false));
  pickBtn.addEventListener('keydown',e=>{if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();pickOpen();}});
  pickMenu.addEventListener('keydown',e=>{
    const l=items(),i=l.indexOf(document.activeElement);
    if(e.key==='Escape'||e.key==='Tab'){if(e.key==='Escape')e.preventDefault();pickClose(e.key==='Escape');}
    else if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();l[(i+(e.key==='ArrowDown'?1:l.length-1))%l.length].focus();}
    else if(e.key==='Home'||e.key==='End'){e.preventDefault();l[e.key==='Home'?0:l.length-1].focus();}
  });
  // the chosen tab goes through the hash (show closes the menu); the same tab again only closes it
  pickMenu.addEventListener('click',()=>pickClose(true));
  // a click elsewhere, also into the app's frame (this window loses the focus then)
  document.addEventListener('click',e=>{if(!pickMenu.hidden&&!pickBtn.parentElement.contains(e.target))pickClose(false);});
  addEventListener('blur',()=>pickClose(false));
  addEventListener('resize',fitBar);
  if(document.fonts)document.fonts.ready.then(fitBar);
  // the model as it is on screen → komnata.glb: the app makes the bytes (js/export.js), this page saves them
  const save=document.getElementById('saveGlb'),saveTitle=save.title;
  save.addEventListener('click',()=>{
    const w=fr.contentWindow;if(save.getAttribute('aria-busy')==='true'||!w||!w.exportGLB)return;
    save.setAttribute('aria-busy','true');save.classList.remove('err');save.title='Готовлю файл…';
    w.exportGLB().then(buf=>{
      const url=URL.createObjectURL(new Blob([buf],{type:'model/gltf-binary'})),a=document.createElement('a');
      a.href=url;a.download='komnata.glb';document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),10000);save.title=saveTitle;
    },e=>{console.error(e);save.classList.add('err');save.title='Не удалось сохранить модель (нужен интернет для загрузки экспортёра). Нажмите, чтобы повторить.';})
      .finally(()=>save.removeAttribute('aria-busy'));
  });
  new MutationObserver(syncTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
  addEventListener('hashchange',show);show();fitBar();
})();
</script>

</body></html>
