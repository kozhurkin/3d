<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>Комната на Энгельса</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Tenor+Sans&display=swap">
<style>
/* Layout: a slim tab bar over a full-height frame that holds the selected cabinet model */
:root{
  --bg:#ECEDE9; --panel:#F7F7F4; --fg:#1E2321; --muted:#626B66; --line:#D3D6D0; --accent:#2F5D50; --accent-soft:#DCE7E2; --warn:#A5561C;
  --f-display:"Tenor Sans", Georgia, serif; --f-body:"Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151917; --panel:#1C211F; --fg:#E6E9E6; --muted:#9AA39E; --line:#2E3532; --accent:#86BBA8; --accent-soft:#243530; --warn:#E3A06A; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#151917; --panel:#1C211F; --fg:#E6E9E6; --muted:#9AA39E; --line:#2E3532; --accent:#86BBA8; --accent-soft:#243530; --warn:#E3A06A; color-scheme:dark;}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);display:flex;flex-direction:column}
.bar{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:nowrap;padding-top:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabs{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.tabs a{font:500 14px/1 var(--f-body);color:var(--fg);text-decoration:none;padding:9px 16px;background:var(--panel)}
.tabs a+a{border-left:1px solid var(--line)}
.tabs a[aria-current="page"]{background:var(--accent);color:var(--panel)}
.tabs a:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
/* too narrow for the row of tabs: the open one with a menu of all of them (data-compact, set by fitBar) */
.pick{position:relative;display:none;min-width:0}
.bar[data-compact] .tabs{display:none}
.bar[data-compact] .pick{display:block}
.pick-btn{display:flex;align-items:center;gap:8px;height:34px;box-sizing:border-box;max-width:100%;padding:0 10px 0 16px;background:var(--accent);color:var(--panel);border:1px solid var(--accent);border-radius:4px;font:500 14px/1 var(--f-body);cursor:pointer}
.pick-btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick-btn svg{flex:none;transition:transform .15s}
.pick-btn[aria-expanded="true"] svg{transform:rotate(180deg)}
.pick-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pick-menu{position:absolute;z-index:10;left:0;top:calc(100% + 4px);min-width:100%;box-sizing:border-box;display:flex;flex-direction:column;padding:4px;background:var(--panel);border:1px solid var(--line);border-radius:4px;box-shadow:0 6px 18px rgba(0,0,0,.14)}
.pick-menu a{font:500 14px/1 var(--f-body);color:var(--fg);text-decoration:none;padding:10px 12px;border-radius:3px;white-space:nowrap}
.pick-menu a:hover,.pick-menu a:focus-visible{background:var(--accent-soft);outline:none}
.pick-menu a[aria-current="page"]{color:var(--accent)}
.save{flex:none;width:34px;height:34px;display:grid;place-items:center;padding:0;background:var(--panel);border:1px solid var(--line);border-radius:4px;color:var(--fg);cursor:pointer}
.save:hover{border-color:var(--accent);color:var(--accent)}
.save:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.save[aria-busy="true"]{cursor:progress;color:var(--muted)}
.save[aria-busy="true"] svg{animation:savePulse 1s ease-in-out infinite alternate}
.save.err{border-color:var(--warn);color:var(--warn)}
@keyframes savePulse{to{opacity:.35}}
@media (prefers-reduced-motion: reduce){.save[aria-busy="true"] svg{animation:none}}
.frames{flex:1;min-height:0;position:relative}
.frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
</style>

</head><body>
<header class="bar">
  <nav class="tabs" aria-label="Вкладки">
    <a href="#plan" data-tab="plan">Комната</a>
    <a href="#walk" data-tab="walk">Обход</a>
  </nav>
  <div class="pick">
    <button class="pick-btn" id="pickBtn" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="pickMenu"><span id="pickLabel"></span><svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div class="pick-menu" id="pickMenu" role="menu" aria-label="Вкладки" hidden></div>
  </div>
  <button class="save" id="saveGlb" type="button" aria-label="Скачать 3D-модель (GLB)" title="Скачать 3D-модель (.glb): то, что видно сейчас"><svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M10 3v9m-4-4 4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 13v2.5h12V13" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
</header>
<main class="frames">
  <iframe id="f-app" title="Комната" hidden></iframe>
</main>

<script>

dow:0 1px 4px rgba(0,0,0,.25)}\n.item-dot:focus-visible{outline:2px solid var(--accent);outline-offset:2px}\n.item-card{position:absolute;z-index:5;width:min(280px,calc(100% - 16px));box-sizing:border-box;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:6px;font:400 12px/1.45 var(--f-body);color:var(--fg);box-shadow:0 4px 16px rgba(0,0,0,.2)}\n.item-card h3{margin:0 22px 4px 0;font:600 13px/1.3 var(--f-body)}\n.item-card p{margin:2px 0 0;color:var(--muted)}\n.item-card .x{position:absolute;right:4px;top:3px;width:22px;height:22px;padding:0;border:0;background:none;color:var(--muted);font:400 18px/1 var(--f-body);cursor:pointer}\n.item-card .x:hover{color:var(--accent)}\n.item-card p.next{display:flex;gap:6px;align-items:baseline;margin-top:4px}\n.item-card p.next .lnk{font-size:12px;padding:0}\n.item-card .buys{display:grid;grid-template-columns:1fr auto auto;column-gap:8px;margin-top:6px;padding-top:6px;border-top:1px solid var(--line)}\n.item-card .buy{grid-column:1/-1;display:grid;grid-template-columns:subgrid;align-items:baseline}\n.item-card .buy.more{margin-top:4px}\n.item-card .buy .nm{grid-column:1;color:var(--muted)}\n.item-card .buy b{grid-column:2;font-weight:600;color:var(--fg)}\n.item-card .buy b:first-child{grid-column:1}\n.item-card .buy a{grid-column:3;color:var(--accent)}\n.item-card .buy.total{margin-top:6px;padding-top:6px;border-top:1px solid var(--line)}\n.item-card .buy.total .nm{color:var(--fg)}\n.dbg-on .info{max-width:calc(100% - min(260px,42%) - 36px)}\n.dbg-on .info[aria-expanded=\"true\"] .it{white-space:normal}\n.btn{font:500 13px/1 var(--f-body);color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:8px 4px;cursor:pointer}\n.btn:hover{border-color:var(--accent)}\n.btn:focus-visible,.seg button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}\n.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:18px;display:flex;flex-direction:column;gap:20px;min-width:0;overflow:auto;max-height:calc(100vh - 32px);box-sizing:border-box}\nh1{font:400 26px/1.15 var(--f-display);margin:0;text-wrap:balance}\n.sub{color:var(--muted);margin-top:4px;font-family:var(--f-mono);font-size:12px}\nh2{font:600 11px/1 var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}\nh3{font:600 12px/1 var(--f-body);margin:14px 0 10px;color:var(--fg)}\nh2+h3{margin-top:0}   /* a block's first switch titled right under the block's title */\n.field{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 10px}\n.field label{font-size:13px}\n.field output{font:500 13px var(--f-mono);font-variant-numeric:tabular-nums}\n.field input{grid-column:1/-1;width:100%;accent-color:var(--accent);margin:0}\n.seg{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}\n.seg button{flex:1;font:500 13px var(--f-body);background:transparent;color:var(--fg);border:0;padding:8px 4px;cursor:pointer}\n.seg button+button{border-left:1px solid var(--line)}\n.seg button[aria-pressed=\"true\"]{background:var(--accent);color:var(--panel)}\n.views{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}\n.views.v4{grid-template-columns:repeat(4,minmax(0,1fr))}\n.toggles{display:flex;flex-direction:column;gap:8px;margin-top:12px}\n.toggles label{display:flex;gap:8px;align-items:center;font-size:13px;cursor:pointer}\n.toggles input{accent-color:var(--accent);margin:0}\ndl.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;margin:0;font-size:12px}\ndl.facts dt{color:var(--muted)}\ndl.facts dd{margin:0;font-family:var(--f-mono);font-variant-numeric:tabular-nums}\ndl.facts .q{color:var(--warn)}\n.room{font:600 12px var(--f-body);margin:14px 0 8px}\n.room:first-of-type{margin-top:0}\n.note{font-size:12px;color:var(--muted)}\n.wcs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}\n.wc{display:flex;flex-direction:column;gap:6px;padding:6px;font:500 12px/1.2 var(--f-body);color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:4px;cursor:pointer;text-align:center}\n.wc i{display:block;height:30px;border-radius:3px;border:1px solid rgba(0,0,0,.14)}\n.wc:hover{border-color:var(--accent)}\n.wc[aria-pressed=\"true\"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}\n.wc:focus-visible{outline:2px solid var(--accent);outline-offset:2px}\n.row{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px}\n.btn[aria-pressed=\"true\"]{border-color:var(--accent);color:var(--accent)}\nol.qs{margin:0;padding-left:18px;font-size:12px;display:flex;flex-direction:column;gap:6px}\ndetails.sizes{border:1px solid var(--line);border-radius:4px;padding:10px 12px}\ndetails.sizes summary{cursor:pointer;font:600 11px/1 var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);list-style:none;display:flex;justify-content:space-between;align-items:center}\ndetails.sizes summary::-webkit-details-marker{display:none}\ndetails.sizes summary::after{content:\"\";width:7px;height:7px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg);margin-top:-4px;transition:transform .15s}\ndetails.sizes[open] summary::after{transform:rotate(-135deg);margin-top:4px}\ndetails.sizes summary:focus-visible{outline:2px solid var(--accent);outline-offset:4px}\n.sizes-body{display:flex;flex-direction:column;gap:16px;margin-top:14px}\n.sizes-body h3{margin:0 0 10px}\n.sizes-body .field{margin-bottom:10px}\n.sizes-body p:empty{display:none}\n/* finishes of a room: decor and plain-colour swatches, what each group has, own colour, the swatch menu */\n.decors{display:flex;flex-direction:column;gap:6px}\n.decors button{position:relative;display:flex;gap:10px;align-items:center;text-align:left;font:500 13px/1.25 var(--f-body);color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:4px;padding:7px 9px;cursor:pointer}\n.decors button small{font:400 11px var(--f-mono);color:var(--muted)}\n.decors button[aria-pressed=\"true\"]{border-color:var(--accent);background:var(--accent-soft)}\n.decors button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}\n.tags{position:absolute;top:4px;right:4px;display:flex;gap:2px;pointer-events:none}\n.tags b{font:600 9px/1 var(--f-mono);background:var(--accent);color:var(--panel);padding:3px 4px;border-radius:3px}\n.lnk{font:inherit;font-size:11px;color:var(--accent);background:none;border:0;padding:0 0 0 4px;cursor:pointer;text-decoration:underline}\n.finnow{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;margin-top:10px;font-size:12px}\n.finnow span:nth-child(odd){color:var(--muted)}\n.ctx{position:fixed;z-index:50;display:flex;flex-direction:column;min-width:170px;padding:4px;background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.18)}\n.ctx button{font:500 13px var(--f-body);color:var(--fg);background:none;border:0;border-radius:4px;padding:8px 10px;text-align:left;cursor:pointer}\n.ctx button:hover,.ctx button:focus-visible{background:var(--accent-soft);outline:none}\n.ctx .ctx-h{font:600 11px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 10px 4px}\n.decors.unis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}\n.decors .cc{position:relative;display:flex;flex-direction:column;gap:6px;padding:6px;border:1px solid var(--line);border-radius:4px;font:500 12px/1.25 var(--f-body);cursor:pointer}\n.chips{display:flex;gap:6px;flex-wrap:wrap}\n.chip{font:500 12px/1 var(--f-mono);padding:6px 8px;border-radius:999px;background:var(--accent-soft);color:var(--ok)}\n.chip.warn{background:var(--warn-soft);color:var(--warn)}\n.decors .cc.on{border-color:var(--accent);background:var(--accent-soft)}\n.decors .cc input{width:100%;height:36px;padding:0;border:1px solid rgba(0,0,0,.15);border-radius:3px;background:none;cursor:pointer}\n.decors .cc small{font:400 10px var(--f-mono);color:var(--muted)}\n.decors.unis button{flex-direction:column;align-items:stretch;gap:6px;padding:6px;font-size:12px}\n.decors.unis .sw{width:100%;height:36px}\n.decors.unis small{font-size:10px}\n.sw{width:28px;height:28px;border-radius:3px;flex:none;border:1px solid rgba(0,0,0,.15)}\n/* cut list */\n.tablewrap{overflow-x:auto}\ntable{width:100%;border-collapse:collapse;font-size:12px}\nth{font-weight:600;text-align:left;color:var(--muted);padding:6px 4px;border-bottom:1px solid var(--line)}\ntd{padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:top}\ntd.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}\nth.n{text-align:right}\nth.mh{color:var(--fg);padding-top:12px;font-size:12px}\n.tot{display:flex;flex-direction:column;gap:4px;font:500 12px var(--f-mono);margin-top:8px;flex-wrap:wrap}\ntextarea.code{width:100%;height:80px;font:11px var(--f-mono);margin-top:8px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:4px;box-sizing:border-box}\n@media (max-width:900px){\n  .app{grid-template-columns:minmax(0,1fr)}\n  /* the scene edge to edge: out over the page's side padding, square corners; its buttons kept out of a notch */\n  .viewer{min-height:340px;height:72vh;border-radius:0;\n    margin-left:calc(-1*max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1*max(16px,env(safe-area-inset-right,0px)))}\n  .info{left:calc(12px + env(safe-area-inset-left,0px))}\n  .camb{right:calc(12px + env(safe-area-inset-right,0px))}\n  .panel{max-height:none}\n}\n<\/style>\n\n<div class=\"app\">\n  <div class=\"viewer\" id=\"viewer\">\n    <canvas id=\"c\" aria-label=\"3D-модель комнаты\"><\/canvas>\n    <button class=\"camb\" id=\"camBtn\" aria-expanded=\"false\" aria-label=\"Мини-вид камеры\" title=\"Камера: точка вращения и мини-вид\"><svg viewBox=\"0 0 20 20\" width=\"16\" height=\"16\" aria-hidden=\"true\"><rect x=\"2\" y=\"6\" width=\"11\" height=\"9\" rx=\"1.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"/><path d=\"M13 9l5-3v9l-5-3z\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linejoin=\"round\"/><\/svg><\/button>\n    <button class=\"info\" id=\"infoBtn\" aria-expanded=\"false\" aria-label=\"Как управлять\"><span class=\"ii\">i<\/span><span class=\"it\" data-info=\"orbit\">Тяните — вращение <b class=\"sep\">•<\/b> Shift + тяните, средняя кнопка или два пальца — сдвиг <b class=\"sep\">•<\/b> колесо — масштаб к курсору <b class=\"sep\">•<\/b> клик по двери — открыть или закрыть, удержание — открывать постепенно<\/span><span class=\"it\" data-info=\"walk\" hidden>W A S D — идти <b class=\"sep\">•<\/b> два пальца на трекпаде — идти: вверх — вперёд, вниз — назад, вбок — в сторону <b class=\"sep\">•<\/b> мышь — смотреть (клик по сцене, Esc или правая кнопка — отпустить) <b class=\"sep\">•<\/b> пробел — прыжок <b class=\"sep\">•<\/b> Ctrl или C — присесть <b class=\"sep\">•<\/b> Shift — тихий шаг <b class=\"sep\">•<\/b> E или клик — дверь в прицеле, удержание кнопки — открывать постепенно <b class=\"sep\">•<\/b> на сенсорном экране: палец в левом нижнем углу — идти (чем дальше от центра круга, тем быстрее), в остальной части — смотреть, тап — дверь<\/span><\/button>\n    <button class=\"item-dot\" id=\"itemDot\" hidden aria-label=\"Что это\"><span aria-hidden=\"true\">i<\/span><\/button>\n    <div class=\"item-card\" id=\"itemCard\" hidden role=\"dialog\"><\/div>\n    <i class=\"aim\" id=\"walkAim\" hidden><\/i>\n    <div class=\"stick\" id=\"walkStick\" hidden><i><\/i><\/div>\n    <div class=\"walk-hint\" id=\"walkHint\" hidden data-touch=\"Палец в левом нижнем углу — идти, в остальной части — смотреть · тап по двери — открыть\">Кликните по сцене, чтобы смотреть мышью · Esc или правая кнопка — отпустить<\/div>\n  <\/div>\n\n  <aside class=\"panel\" data-panel=\"plan\" hidden>\n    <div>\n      <h1>Комната<\/h1>\n      <div class=\"sub\" id=\"pSub\"><\/div>\n    <\/div>\n\n    <div>\n      <h2>Вид<\/h2>\n      <h3>Стены<\/h3>\n      <div class=\"seg\" role=\"group\" aria-label=\"Стены\">\n        <button data-wm=\"show\" aria-pressed=\"false\">Монолит<\/button>\n        <button data-wm=\"row\" aria-pressed=\"false\" title=\"Монолитные стены высотой 10%\">Ряд<\/button>\n        <button data-wm=\"auto\" aria-pressed=\"true\" title=\"Стена убирается, когда камера за ней\">Разрез<\/button>\n        <button data-wm=\"edges\" aria-pressed=\"false\">Контуры<\/button>\n        <button data-wm=\"feet\" aria-pressed=\"false\">Следы<\/button>\n      <\/div>\n      <div class=\"field\" style=\"margin-top:10px\"><label for=\"pWh\">Высота стен<\/label><output data-wh-out><\/output><input type=\"range\" id=\"pWh\" data-wh min=\"5\" max=\"100\" step=\"5\"><\/div>\n      <h3>Дверь<\/h3>\n      <div class=\"seg\" role=\"group\" aria-label=\"Дверь\">\n        <button data-dm=\"closed\" aria-pressed=\"true\">Закрыта<\/button>\n        <button data-dm=\"open\" aria-pressed=\"false\">Открыта<\/button>\n        <button data-dm=\"none\" aria-pressed=\"false\">Без двери<\/button>\n      <\/div>\n      <div class=\"toggles\">\n        <label><input type=\"checkbox\" id=\"pDims\" checked> Размеры<\/label>\n        <label><input type=\"checkbox\" id=\"pNames\" checked> Название и площадь<\/label>\n        <label><input type=\"checkbox\" id=\"pFloors\" checked> Цвет пола<\/label>\n      <\/div>\n      <h3>Фотообои<\/h3>\n      <div class=\"seg\" role=\"group\" aria-label=\"Фотообои\">\n        <button data-mural=\"right\" aria-pressed=\"true\" title=\"Если войти в комнату — стена по левую руку\">Слева от входа<\/button>\n        <button data-mural=\"left\" aria-pressed=\"false\" title=\"Если войти в комнату — стена по правую руку\">Справа<\/button>\n        <button data-mural=\"\" aria-pressed=\"false\">Нет<\/button>\n      <\/div>\n      <h3>Камера<\/h3>\n      <div class=\"views v4\" data-cams>\n        <button class=\"btn\" data-cam=\"plan\" title=\"Комната под углом\">План<\/button>\n        <button class=\"btn\" data-cam=\"top\">Сверху<\/button>\n        <button class=\"btn\" data-cam=\"door\" title=\"На стену с дверью\">На дверь<\/button>\n        <button class=\"btn\" data-cam=\"window\" title=\"На стену с окном\">На окно<\/button>\n      <\/div>\n    <\/div>\n\n    <details class=\"sizes\" id=\"pSizesBox\">\n      <summary>Размеры стен<\/summary>\n      <div class=\"sizes-body\">\n        <p class=\"note\" style=\"margin:0\">Размеры меняются только здесь; «Обход» берёт их отсюда.<\/p>\n        <div id=\"pSizes\" style=\"display:contents\"><\/div>\n        <p class=\"note\" id=\"pSizeMsg\" aria-live=\"polite\" style=\"margin:0;color:var(--warn)\"><\/p>\n      <\/div>\n    <\/details>\n\n    <div data-shared-slot style=\"display:contents\"><\/div>\n\n    <div>\n      <h2>Размеры по умолчанию<\/h2>\n      <div class=\"row\" style=\"margin-top:0\">\n        <button class=\"btn\" id=\"pSaveA\">Запомнить текущие<\/button>\n        <button class=\"btn\" id=\"pResetA\">Вернуть исходные<\/button>\n      <\/div>\n      <div class=\"row\">\n        <button class=\"btn\" id=\"pCopyA\">Скопировать код размеров<\/button>\n        <span class=\"note\" id=\"pAMsg\" aria-live=\"polite\"><\/span>\n      <\/div>\n      <textarea id=\"pACode\" hidden readonly aria-label=\"Код размеров\" style=\"width:100%;height:70px;font:11px var(--f-mono);margin-top:8px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:4px;box-sizing:border-box\"><\/textarea>\n      <p class=\"note\" style=\"margin:8px 0 0\">«Запомнить» сохраняет размеры в этом браузере. Чтобы они стали исходными для всех, скопируйте код и пришлите его в чат.<\/p>\n    <\/div>\n\n    <div>\n      <h2>Что заложено, мм<\/h2>\n      <div id=\"pFacts\"><\/div>\n    <\/div>\n\n    <div>\n      <h2>Нужно уточнить<\/h2>\n      <ol class=\"qs\">\n        <li>Боковые стены 4797 — из площади 13 м² при короткой стене 2710. Точная длина?<\/li>\n        <li>Ширина двери 800 — между наличниками (видимый проём); проём в стене на 20 больше (коробка по 10 под наличниками). Высота проёма не задана — взято 2000.<\/li>\n        <li>Петли и сторона открывания не заданы: дверь на петлях справа (если смотреть из комнаты), открывается в комнату.<\/li>\n        <li>Толщина стен не задана: со стороны двери и боковые — 120, с окном — 400.<\/li>\n      <\/ol>\n    <\/div>\n\n  <\/aside>\n  <aside class=\"panel\" data-panel=\"walk\" hidden>\n    <div>\n      <h1>Обход<\/h1>\n      <div class=\"sub\">вид от первого лица<\/div>\n    <\/div>\n\n    <div>\n      <h2>Камера<\/h2>\n      <div class=\"field\"><label for=\"walkEye\">Высота камеры<\/label><output id=\"walkEyeOut\"><\/output><input type=\"range\" id=\"walkEye\" min=\"1000\" max=\"2000\" step=\"10\"><\/div>\n      <p class=\"note\" style=\"margin:8px 0 0\">Высота глаз над полом стоя. Присед опускает её на треть.<\/p>\n    <\/div>\n\n    <div>\n      <h2>Вид<\/h2>\n      <h3>Стены<\/h3>\n      <div class=\"seg\" role=\"group\" aria-label=\"Стены\">\n        <button data-wm=\"show\" aria-pressed=\"false\">Монолит<\/button>\n        <button data-wm=\"row\" aria-pressed=\"false\" title=\"Монолитные стены высотой 10%\">Ряд<\/button>\n        <button data-wm=\"auto\" aria-pressed=\"true\" title=\"Стена убирается, когда камера за ней\">Разрез<\/button>\n        <button data-wm=\"edges\" aria-pressed=\"false\">Контуры<\/button>\n        <button data-wm=\"feet\" aria-pressed=\"false\">Следы<\/button>\n      <\/div>\n      <div class=\"field\" style=\"margin-top:10px\"><label for=\"walkWh\">Высота стен<\/label><output data-wh-out><\/output><input type=\"range\" id=\"walkWh\" data-wh min=\"5\" max=\"100\" step=\"5\"><\/div>\n      <h3>Дверь<\/h3>\n      <div class=\"seg\" role=\"group\" aria-label=\"Дверь\">\n        <button data-dm=\"closed\" aria-pressed=\"true\">Закрыта<\/button>\n        <button data-dm=\"open\" aria-pressed=\"false\">Открыта<\/button>\n        <button data-dm=\"none\" aria-pressed=\"false\">Без двери<\/button>\n      <\/div>\n      <p class=\"note\" style=\"margin:8px 0 0\">Стены не пускают при любом виде; потолок — только при монолитных стенах в полную высоту (в «Разрезе» — пока камера в комнате). Без двери проём свободен.<\/p>\n    <\/div>\n\n    <div data-shared-slot style=\"display:contents\"><\/div>\n\n    <div>\n      <h2>Управление<\/h2>\n      <dl class=\"facts\">\n        <dt>Идти<\/dt><dd>W A S D или стрелки<\/dd>\n        <dt>Смотреть<\/dt><dd>мышь: клик по сцене, Esc или правая кнопка — отпустить<\/dd>\n        <dt>Прыжок<\/dt><dd>пробел<\/dd>\n        <dt>Присесть<\/dt><dd>Ctrl или C<\/dd>\n        <dt>Тихий шаг<\/dt><dd>Shift<\/dd>\n        <dt>Дверь<\/dt><dd>E или клик в прицел<\/dd>\n      <\/dl>\n      <p class=\"note\" style=\"margin:8px 0 0\">Стены и закрытая дверь не пускают. Если браузер не отдаёт мышь, смотрите, ведя мышью с нажатой кнопкой.<\/p>\n    <\/div>\n\n  <\/aside>\n<\/div>\n<!-- light and wall colour: shared by all views, moved into the panel of the view on screen -->\n<div id=\"shared\" style=\"display:contents\" hidden>\n    <div>\n      <h2>Цвет стен<\/h2>\n      <div class=\"wcs\" id=\"wcs\" role=\"group\" aria-label=\"Цвет стен\"><\/div>\n      <div class=\"toggles\"><label title=\"Тёмные линии по рёбрам стен и двери; в «Контурах» они есть всегда\"><input type=\"checkbox\" id=\"wEdge\" checked> Контур стен<\/label><\/div>\n    <\/div>\n\n    <div>\n      <h2>Свет<\/h2>\n      <div class=\"field\"><label for=\"Laz\">Направление<\/label><output id=\"oLaz\"><\/output><input type=\"range\" id=\"Laz\" min=\"-180\" max=\"180\" step=\"1\"><\/div>\n      <div class=\"field\" style=\"margin-top:10px\"><label for=\"Lel\">Высота над горизонтом<\/label><output id=\"oLel\"><\/output><input type=\"range\" id=\"Lel\" min=\"5\" max=\"89\" step=\"1\"><\/div>\n      <div class=\"field\" style=\"margin-top:10px\"><label for=\"Li\">Яркость солнца<\/label><output id=\"oLi\"><\/output><input type=\"range\" id=\"Li\" min=\"0\" max=\"200\" step=\"5\"><\/div>\n      <div class=\"field\" style=\"margin-top:10px\"><label for=\"La\">Рассеянный свет<\/label><output id=\"oLa\"><\/output><input type=\"range\" id=\"La\" min=\"0\" max=\"200\" step=\"5\"><\/div>\n      <div class=\"row\"><button class=\"btn\" id=\"lightSpin\" aria-pressed=\"false\">Вращать свет<\/button><button class=\"btn\" id=\"lightReset\">Сбросить<\/button><\/div>\n    <\/div>\n\n    <div>\n      <h2>Переход между вкладками<\/h2>\n      <div class=\"toggles\"><label><input type=\"checkbox\" id=\"wFly\" checked> Анимированный перелёт<\/label><\/div>\n      <p class=\"note\" style=\"margin:8px 0 0\">Стены опускаются и поднимаются, камера и тени переходят вместе. Без галочки стены меняются сразу, а камера плавно доезжает.<\/p>\n    <\/div>\n\n<\/div>\n\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js\"><\/script>\n<script>\n/* ---------- the room, mm: one for every tab ----------\n   Plain data and arithmetic only (no THREE, no DOM), so it also runs in Node for checks.\n   x → right, z → from the door wall toward the window (top view: the door wall at the top, the window at the bottom).\n   origin: the inner corner of the room between the door wall and the left wall, as seen from the room facing the door.\n   Set here: what the building has (walls, ceiling) and where an opening stands in it, measured as in the room;\n   what is left between them (the wall left of the door, the piers by the window) follows in apartment() */\nconst APT_A={\n  H:3060,                           // ceiling height\n  W:2710,                           // the short wall with the door, inner face to inner face (and the window wall opposite)\n  L:4797,                           // the side walls, from the door wall to the window wall: 13 m² / 2710\n  dR:1570,                          // the door: its right casing's outer edge from the right corner (seen from the room)\n  dW:800,                           // the door: between the casings' inner edges\n  dH:2000,                          // the doorway's height (the lining's head underside)\n  winW:1200, winS:900, winT:2950,   // the window, centred in the wall opposite the door: width, sill and top from the floor\n  tD:120, tS:120, tW:400,           // walls: the door wall, the side walls, the window wall (outer)\n  cornH:110, plH:70,                // the cornice under the ceiling: its drop down the wall; the skirting board: its height\n  muralWall:'right', muralW:5000, muralH:2700   // the photo wallpaper: on which wall ('' none; 'right' is left of the way in), its width and height,\n                                                // from the skirting board's top up, glued from the left corner as one faces the wall (the rest cut off)\n};\nconst CW=70,CT=10,LT=10;   // door casings: width, thickness; the lining through the wall between them: thickness\n\n/* Builds the whole model from the sizes; a: the sizes to change, the rest come from APT_A.\n   Walls: rect r=[x0,x1,z0,z1]; ext: outer side of the wall (each wall of one room is an outer one of the model);\n   holes along the long side: [from, to, top, sill]; face: where its room face is and which way it looks into the room ([+-][xz]);\n   run: [from, to] along the room face; plinth: the runs of the skirting board (it stops at the door's casings). Room: floor rect r */\nfunction apartment(a){\n  const A=Object.assign({},APT_A,a);\n  const dB=A.W-A.dR-CW+LT;             // the doorway's right edge: its lining is under the casing's inner edge\n  const dA=dB-A.dW-2*LT;               // … its left edge\n  const dL=dA+LT-CW;                   // the left casing's outer edge from the left corner (what is left of the wall)\n  const winX=A.W/2;                    // window centre\n  const xR=dB-LT+CW;                   // the right casing's outer edge\n  const WALLS=[\n    {id:'door',name:'Стена с дверью',r:[-A.tS,A.W+A.tS,-A.tD,0],ext:'-z',rooms:['room'],holes:[[dA,dB,A.dH]],\n      face:[0,'+z'],run:[0,A.W],plinth:[[0,dL],[xR,A.W]]},\n    {id:'right',name:'Правая стена',r:[A.W,A.W+A.tS,0,A.L],ext:'+x',rooms:['room'],face:[A.W,'-x'],run:[0,A.L],plinth:[[0,A.L]]},\n    {id:'left',name:'Левая стена',r:[-A.tS,0,0,A.L],ext:'-x',rooms:['room'],face:[0,'+x'],run:[0,A.L],plinth:[[0,A.L]]},\n    {id:'window',name:'Стена с окном',r:[-A.tS,A.W+A.tS,A.L,A.L+A.tW],ext:'+z',rooms:['room'],holes:[[winX-A.winW/2,winX+A.winW/2,A.winT,A.winS]],\n      face:[A.L,'-z'],run:[0,A.W],plinth:[[0,A.W]]}\n  ];\n  const ROOMS=[{id:'room',name:'Комната',r:[0,A.W,0,A.L],origin:[0,0],col:'--fl-kit',at:[A.W/2,A.L/2]}];\n  const BOX={x0:-A.tS,x1:A.W+A.tS,z0:-A.tD,z1:A.L+A.tW};\n  return {A,H:A.H,dA,dB,dL,winX,WALLS,ROOMS,BOX};\n}\n\n/* What does not fit with these sizes: [] when everything does. The plan's size sliders stop at the last value that fits */\nfunction aptProblems(a){\n  const m=apartment(a),A=m.A,out=[];\n  m.WALLS.forEach(w=>{if(w.r[1]<w.r[0]||w.r[3]<w.r[2])out.push(`«${w.name}» не помещается`);});\n  if(m.dL<0)out.push('Левый наличник двери заходит за левый угол');\n  if(A.dR<0)out.push('Правый наличник двери заходит за правый угол');\n  if(A.winW>A.W-200)out.push('Окно шире стены (нужно хотя бы по 100 мм до боковых стен)');\n  if(A.winT-A.winS<300)out.push('Окно ниже 300 мм');\n  if(A.dH+CW>A.H-A.cornH)out.push('Наличник над дверью заходит под лепнину');\n  if(A.winT>A.H-A.cornH)out.push('Окно заходит под лепнину');\n  if(A.plH>A.winS&&A.winS>0)out.push('Плинтус выше подоконника');\n  if(A.muralWall&&A.plH+A.muralH>A.H-A.cornH)out.push('Фотообои заходят под лепнину');\n  return out;\n}\n\n<\/script>\n<script>\n/* ---------- engine: renderer, scene, light, orbit camera, camera debug, render loop ----------\n   One scene for every tab. Other modules hook into the loop through frameHooks (called after the camera moves). */\nconst MM=.001;\nconst reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;\n\n/* ---------- the room as built now (js/apartment.js) ----------\n   Its sizes are edited on the plan: setModel() swaps the model, then modelHooks rebuild what depends on it\n   (walls, doors, floors, dimensions…). The sizes remembered in this browser (eng-model-v1) are the ones to start with. */\nlet A,H,dA,dB,dL,winX,WALLS,ROOMS,BOX,CX,CZ;\nconst MKEY='eng-model-v1';\nconst modelHooks=[];\nfunction useModel(a){\n  ({A,H,dA,dB,dL,winX,WALLS,ROOMS,BOX}=apartment(a));\n  CX=(BOX.x0+BOX.x1)/2*MM;CZ=(BOX.z0+BOX.z1)/2*MM;\n}\nfunction setModel(a){useModel(a);modelHooks.forEach(f=>f());}\n// only the sizes that differ from the defaults, so a later change of a default still reaches the sizes nobody touched\nconst modelDiff=()=>Object.fromEntries(Object.entries(A).filter(([k,v])=>k in APT_A&&APT_A[k]!==v));   // a size the model no longer has (an old save's) is dropped\nuseModel((()=>{try{const a=JSON.parse(localStorage.getItem(MKEY)||'null');if(a&&!aptProblems(a).length)return a;}catch(e){}return {};})());\n\n/* ---------- three setup ---------- */\nconst canvas=document.getElementById('c'), viewer=document.getElementById('viewer');\nconst renderer=new THREE.WebGLRenderer({canvas,antialias:true});\nrenderer.setPixelRatio(Math.min(devicePixelRatio,2));\nrenderer.outputEncoding=THREE.sRGBEncoding;\nrenderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;\nrenderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;\nrenderer.localClippingEnabled=true;   // furniture is clipped at the floor and on the plan at the walls' height (furniture.js: furnClip)\nconst scene=new THREE.Scene();\nconst camera=new THREE.PerspectiveCamera(35,1,0.01,200);\nconst hemi=new THREE.HemisphereLight(0xffffff,0x8a7f70,0.75);scene.add(hemi);\nconst sun=new THREE.DirectionalLight(0xffffff,1);\nsun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.bias=-0.0005;\nObject.assign(sun.shadow.camera,{left:-4.6,right:4.6,top:4.6,bottom:-4.6,near:.5,far:30});   // covers the whole apartment from any direction\nsun.target.position.set(CX,0,CZ);   // the view sets where the sun aims; the light settings are shared by all views\nscene.add(sun);scene.add(sun.target);\n// sun around its target: az — from +z (window side) toward +x, el — above the horizon.\n// Defaults and 100 % match the room tabs, so the walls have the same tone there and here\nconst LIGHT0={az:-35,el:45,i:100,a:100};\nfunction placeSun(){\n  const L=S.light,a=L.az*Math.PI/180,e=L.el*Math.PI/180,R=10,c=sun.target.position;\n  sun.position.set(c.x+R*Math.cos(e)*Math.sin(a),R*Math.sin(e),c.z+R*Math.cos(e)*Math.cos(a));\n  sun.intensity=L.i/100;hemi.intensity=.75*L.a/100;\n}\n\n/* theme colors for the scene (applyTheme lives in walls.js, loaded later) */\nfunction css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}\nmatchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>applyTheme());\nnew MutationObserver(()=>applyTheme()).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});\n\n/* ---------- orbit ---------- */\nconst cam={theta:-.5,phi:.9,r:8,target:new THREE.Vector3(CX,0,CZ)};\nconst goal={theta:-.5,phi:.9,r:8};\nconst goalT=new THREE.Vector3(CX,0,CZ);\n// turn toward the goal angle the short way round\n// where the camera stands once it reaches its goal (m)\nfunction goalPosition(){const sp=Math.sin(goal.phi);return new THREE.Vector3(goalT.x+goal.r*sp*Math.sin(goal.theta),goalT.y+goal.r*Math.cos(goal.phi),goalT.z+goal.r*sp*Math.cos(goal.theta));}\nfunction shortWay(){\n  while(goal.theta-cam.theta>Math.PI)goal.theta-=2*Math.PI;\n  while(cam.theta-goal.theta>Math.PI)goal.theta+=2*Math.PI;\n}\nconst ptrs=new Map();let pinch0=0;\nconst _r=new THREE.Vector3(),_u=new THREE.Vector3();\nfunction pan(dx,dy){\n  const k=2*cam.r*Math.tan(camera.fov*Math.PI/360)/viewer.clientHeight;\n  _r.setFromMatrixColumn(camera.matrixWorld,0);_u.setFromMatrixColumn(camera.matrixWorld,1);\n  cam.target.addScaledVector(_r,-dx*k).addScaledVector(_u,dy*k);goalT.copy(cam.target);\n}\nlet downAt=null;\n// a view that takes the mouse itself (the walk, walk.js): no orbit, pan, zoom or door clicks of its own here\nconst ownMouse=()=>!!(VIEWS[view]&&VIEWS[view].mouse);\n// long press on a door moves it gradually: closed → opens, fully open → closes, part-open → reverses the last direction\n// (at 60°/s, or at the door's own holdRate per second if it has one)\nconst HOLD_MS=500,HOLD_RATE=60*Math.PI/180;let held=null,holdTimer=null;\nfunction holdDoor(d){const dir=d.a<=.01?1:d.a>=d.max-.01?-1:-(d.last||-1);d.last=dir;held={d,dir};d.t=d.a;}\ncanvas.addEventListener('pointerdown',e=>{\n  if(ownMouse())return;\n  if(e.pointerType==='mouse'&&e.button!==0&&e.button!==1&&e.button!==2)return;\n  downAt=e.button===0&&!e.shiftKey&&ptrs.size===0?{x:e.clientX,y:e.clientY}:null;\n  clearTimeout(holdTimer);\n  if(downAt){const d0=downAt;holdTimer=setTimeout(()=>{\n    if(downAt!==d0||ptrs.size>1)return;\n    const d=pickDoor({clientX:d0.x,clientY:d0.y});if(!d)return;\n    holdDoor(d);canvas.style.cursor='grabbing';\n  },HOLD_MS);}\n  if(e.button===1)e.preventDefault();\n  canvas.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY,pan:e.button===1||e.button===2});\n  if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch0=Math.hypot(a.x-b.x,a.y-b.y);}\n});\ncanvas.addEventListener('pointermove',e=>{\n  if(!ptrs.has(e.pointerId)||ownMouse())return;const pr=ptrs.get(e.pointerId),dx=e.clientX-pr.x,dy=e.clientY-pr.y;\n  if(!held&&downAt&&Math.hypot(e.clientX-downAt.x,e.clientY-downAt.y)>=6)clearTimeout(holdTimer);\n  if(held){ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY,pan:pr.pan});return;}\n  if(ptrs.size>=1)camDrive=null;   // the user takes the camera back from a flight between views\n  if(ptrs.size===1){\n    if(e.shiftKey||pr.pan)pan(dx,dy);\n    else{goal.theta-=dx*.006;goal.phi=Math.min(1.62,Math.max(.0005,goal.phi-dy*.006));}\n    ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY,pan:pr.pan});\n  }else if(ptrs.size===2){\n    ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});\n    pan(dx/2,dy/2);\n    const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);if(pinch0){goal.r=Math.min(30,Math.max(0.3,goal.r*pinch0/d));}pinch0=d;\n  }\n});\nconst lost=e=>{ptrs.delete(e.pointerId);pinch0=0;};\n// a click (no drag) on a door leaf opens or closes that door; on an item with a click of its own, it does that\n// what is under the cursor: the nearest visible surface, or null (also while flying between views: nothing to point at)\nfunction hitAt(e){\n  if(inTransition())return null;\n  aimRay(e);\n  return ray.intersectObjects(scene.children,true).find(hittable)||null;\n}\nfunction pickDoor(e,hit){\n  const h=hit===undefined?hitAt(e):hit;\n  if(!h)return null;\n  // a door of the apartment (the leaf, its handles or the entrance frame) or a cabinet front of any room in the scene\n  // (the plan shows them all; a hidden room is never hit); a door's frame (d.frame: what it is set in) works it too\n  const fd=Object.values(VIEWS).flatMap(v=>v.furniture?v.furniture().doors:[]);\n  for(let o=h.object;o;o=o.parent){const d=doors.find(d=>d.g===o||d.frame===o)||fd.find(d=>d.g===o||d.frame===o);if(d)return d;}\n  return null;\n}\n// an item that does something of its own on a click, not a door (userData.click: the kitchen's pendant lamp changes its model), under a hit\nfunction clickOf(h){for(let o=h&&h.object;o;o=o.parent){const c=o.userData&&o.userData.click;if(typeof c==='function')return c;}return null;}\n// a click at a point of the canvas: the door there opens or closes, or the item there does what it does\nfunction clickAt(e){const h=hitAt(e),d=pickDoor(e,h);if(d){d.t=d.t!==0?0:d.max;doorsChanged();return;}const c=clickOf(h);if(c)c();}\ncanvas.addEventListener('pointerup',e=>{\n  if(ownMouse()&&!ptrs.has(e.pointerId))return;   // the walk's own press (a door it holds is its to let go)\n  clearTimeout(holdTimer);\n  if(held){held=null;canvas.style.cursor='';doorsChanged();downAt=null;lost(e);return;}\n  if(downAt&&ptrs.size===1&&Math.hypot(e.clientX-downAt.x,e.clientY-downAt.y)<6){\n    clickAt(e);\n  }\n  downAt=null;lost(e);\n});\ncanvas.addEventListener('pointermove',e=>{if(ptrs.size===0&&!ownMouse()){const h=hitAt(e);canvas.style.cursor=pickDoor(e,h)||clickOf(h)?'pointer':'';itemHover(h&&infoOf(h.object),e);}});\ncanvas.addEventListener('pointerleave',()=>itemHover(null));canvas.addEventListener('pointercancel',lost);canvas.addEventListener('lostpointercapture',lost);\ncanvas.addEventListener('mousedown',e=>{if(e.button===1)e.preventDefault();});\ncanvas.addEventListener('contextmenu',e=>e.preventDefault());\n// wheel zooms toward the point under the cursor (surface hit, or the plane through the pivot)\nconst ray=new THREE.Raycaster(),ndc=new THREE.Vector2();\nfunction aimRay(e){const rc=canvas.getBoundingClientRect();ndc.set((e.clientX-rc.left)/rc.width*2-1,-(e.clientY-rc.top)/rc.height*2+1);ray.setFromCamera(ndc,camera);}   // the ray through the cursor\nconst _zp=new THREE.Vector3(),_pl=new THREE.Plane(),_n=new THREE.Vector3();\nconst shown=o=>{while(o){if(!o.visible)return false;o=o.parent;}return true;};\n// what the cursor can hit: a visible surface (not a line, a label, or a wall turned see-through in «Контуры»)\nconst seeThrough=m=>Array.isArray(m)?m.every(seeThrough):!!m&&m.opacity===0;\nconst hittable=h=>!(h.object.isLine||h.object.isSprite)&&shown(h.object)&&!seeThrough(h.object.material);\ncanvas.addEventListener('wheel',e=>{\n  e.preventDefault();if(ownMouse())return;camDrive=null;\n  const r0=cam.r,r1=Math.min(30,Math.max(.3,r0*(1+Math.max(-.5,Math.min(.5,e.deltaY*.0012)))));\n  aimRay(e);\n  const hit=ray.intersectObjects(scene.children,true).find(hittable);\n  if(hit)_zp.copy(hit.point);\n  else{camera.getWorldDirection(_n);_pl.setFromNormalAndCoplanarPoint(_n,cam.target);if(!ray.ray.intersectPlane(_pl,_zp))_zp.copy(cam.target);}\n  cam.target.lerp(_zp,1-r1/r0);goalT.copy(cam.tar pthTest:false}));frusFill.renderOrder=39;\n[camBody,viewLine,frus,frusFill].forEach(o=>{o.layers.set(1);o.frustumCulled=false;dbg.add(noRay(o));});\nconst ovCam=new THREE.PerspectiveCamera(36,1.4,.05,200);ovCam.layers.enableAll();\n// the overview looks at the apartment from above, from the window side (like the «Весь план» view)\nconst _oc=new THREE.Vector3(),_od=new THREE.Vector3(.25,1.5,1).normalize(),_ov=new THREE.Vector3(),_oup=new THREE.Vector3(0,1,0),_oq=new THREE.Quaternion();\nconst apt=new THREE.Box3(new THREE.Vector3(BOX.x0*MM,0,BOX.z0*MM),new THREE.Vector3(BOX.x1*MM,H*MM,BOX.z1*MM)),_osz=new THREE.Vector3();\nfunction updateDebug(){\n  pivot.position.copy(cam.target);\n  const ps=Math.max(.4,cam.r*.25);pivot.children.forEach(c=>c.scale.setScalar(ps));\n  // mini view frames the apartment itself, not the camera\n  apt.getCenter(_oc);apt.getSize(_osz);\n  let rad=Math.max(.6,_osz.length()/2);\n  // include the main camera when it is reasonably close; if it is far, keep the plan large and show an arrow instead\n  _ov.subVectors(camera.position,_oc);const cd=_ov.length(),reach=Math.min(cd,rad*2.2);\n  if(reach>rad){_oc.addScaledVector(_ov.normalize(),(reach-rad)/2);rad=(reach+rad)/2+.15;}\n  const dist=rad/Math.sin(ovCam.fov*Math.PI/360)*1.02;\n  ovCam.position.copy(_oc).addScaledVector(_od,dist);ovCam.lookAt(_oc);\n  // camera body sized to the plan, so it is always readable\n  const k=rad*.32;\n  camBody.position.copy(camera.position);camBody.lookAt(cam.target);camBody.scale.setScalar(k);\n  // thick view vector: a thin cylinder from the camera to the pivot\n  _ov.subVectors(cam.target,camera.position);const len=_ov.length();\n  viewLine.position.copy(camera.position).addScaledVector(_ov,.5);\n  _oq.setFromUnitVectors(_oup,_ov.clone().normalize());viewLine.quaternion.copy(_oq);\n  viewLine.scale.set(rad*.012,len,rad*.012);\n  // view frustum: what the main camera sees, drawn out to the pivot distance\n  const fd=Math.min(len,rad*.5),hh=Math.tan(camera.fov* t.querySelector('.dist');let distTxt='';\n// the sun and the mini view follow the view on screen (views.js: aimView)\nlet sunHalf=4.6;   // half the side of the square the shadows cover, m\nfunction aimSun(x,y,z,half){\n  sun.target.position.set(x,y,z);sunHalf=half;\n  Object.assign(sun.shadow.camera,{left:-half,right:half,top:half,bottom:-half});sun.shadow.camera.updateProjectionMatrix();\n  placeSun();\n}\nconst camBtn=document.getElementById('camBtn');\ncamBtn.addEventListener('click',()=>{showDebug=!showDebug;camBtn.setAttribute('aria-expanded',showDebug);dbg.visible=showDebug;inset.hidden=!showDebug;viewer.classList.toggle('dbg-on',showDebug);});\n\nconst infoBtn=document.getElementById('infoBtn');\ninfoBtn.addEventListener('click',()=>infoBtn.setAttribute('aria-expanded',infoBtn.getAttribute('aria-expanded')!=='true'));\ndocument.addEventListener('keydown',e=>{if(e.key==='Escape')infoBtn.setAttribute('aria-expanded','false');});\n\n/* ---------- what a thing is: the cursor resting on something that knows it (userData.info on it or up its parents, or on its\n   part: {title, lines, and price (₽), url, shop if it is sold (or buy: a row for each product it is made of), next and variant if it has variants} or a function giving them) brings up an «i» by the cursor; a click on it opens a short card.\n   With the mouse in the views that orbit (the walk keeps the mouse to itself); the camera moving takes the «i» away ---------- */\nconst ITEM_REST=700,ITEM_GRACE=600;\nconst itemDot=document.getElementById('itemDot'),itemCard=document.getElementById('itemCard');\nlet itemTimer=null,itemHide=null,itemInfo=null,itemCam=null;\nfunction infoOf(o){\n  for(let n=0;o&&n<40;o=o.parent,n++){const u=o.userData;if(!u)continue;\n    for(const v of [u.info,u.part&&u.part.info]){const i=typeof v==='function'?v():v;if(i&&typeof i.title==='string')return i;}}\n  return null;\n}\nfunction hideItemDot(){clearTimeout(itemHide);itemHide=null;itemDot.hidden=true;itemInfo=null;}\nfunction closeItemCard(){itemCard.hidden=true;}\n// the «i» for info at x, y (px in the scene), a little up and right of the cursor, inside the scene\nfunction showItemDot(info,x,y){\n  clearTimeout(itemHide);itemHide=null;itemInfo=info;itemCam=camera.position.clone();\n  itemDot.style.left=Math.max(4,Math.min(viewer.clientWidth-28,x+10))+'px';itemDot.style.top=Math.max(4,Math.min(viewer.clientHeight-28,y-30))+'px';\n  itemDot.title=info.title;itemDot.hidden=false;\n}\nfunction itemHover(info,e){\n  clearTimeout(itemTimer);\n  if(info&&itemInfo&&info.title===itemInfo.title){clearTimeout(itemHide);itemHide=null;return;}   // still on it: the «i» stays where it came up\n  if(itemInfo&&!itemHide)itemHide=setTimeout(hideItemDot,ITEM_GRACE);   // time to reach the «i»\n  if(!info||!e)return;\n  const rc=viewer.getBoundingClientRect(),x=e.clientX-rc.left,y=e.clientY-rc.top;\n  itemTimer=setTimeout(()=>showItemDot(info,x,y),ITEM_REST);   // every move starts the wait again: it comes when the cursor rests\n}\nitemDot.addEventListener('pointerenter',()=>{clearTimeout(itemHide);itemHide=null;});\nitemDot.addEventListener('pointerleave',()=>{if(!itemDot.hidden)itemHide=setTimeout(hideItemDot,ITEM_GRACE);});\n// the card: the title and a few lines, next to the «i», inside the scene\nfunction openItemCard(info){\n  itemCard.innerHTML='';\n  const x=document.createElement('button');x.className='x';x.setAttribute('aria-label','Закрыть');x.textContent='×';x.addEventListener('click',closeItemCard);\n  const h=document.createElement('h3');h.textContent=info.title;itemCard.appendChild(x);itemCard.appendChild(h);\n  (info.lines||[]).forEach(t=>{const p=document.createElement('p');p.textContent=t;itemCard.appendChild(p);});\n  // a thing with variants (info.next: hangs the next one, gives its card; info.variant: [which, how many]): a line under the others,\n  // which of how many and a link to the next one; the card turns to it\n  if(typeof info.next==='function'){const p=document.createElement('p');p.className='next';\n    if(info.variant){const c=document.createElement('span');c.textContent=info.variant.join('/');p.appendChild(c);}\n    const b=document.createElement('button');b.className='lnk';b.textContent='Следующий вариант →';b.addEventListener('click',()=>openItemCard(info.next()));\n    p.appendChild(b);itemCard.appendChild(p);}\n  // its price (₽) and where to buy it (url), if it has them: a row under the lines, the link in a new tab; a thing made of several\n  // products has a row each (info.buy: [{name, price, url, shop, n — how many of it}]); more than one thing (rows, or n of one): the total under\n  // them. All in one block (buys), its columns one grid — names, prices, links — so the prices stand under each other\n  const rows=info.buy||(info.price||info.url?[info]:[]);\n  if(rows.length){const buys=document.createElement('div');buys.className='buys';\n    const row=(it,cls)=>{const r=document.createElement('div');r.className=cls;\n      if(it.name){const n=document.createElement('span');n.className='nm';n.textContent=it.name;r.appendChild(n);}\n      if(it.price){const b=document.createElement('b');b.textContent=(it.n>1?it.n+' × ':'')+it.price.toLocaleString('ru-RU')+' ₽';r.appendChild(b);}\n      if(it.url){const l=document.createElement('a');l.href=it.url;l.target='_blank';l.rel='noopener';l.textContent=it.shop||info.shop||'Купить';r.appendChild(l);}\n      buys.appendChild(r);};\n    rows.forEach((it,i)=>row(it,'buy'+(i?' more':'')));\n    if(rows.length>1||rows.some(it=>it.n>1))row({name:'Итого',price:rows.reduce((t,it)=>t+(it.n||1)*(it.price||0),0)},'buy total');\n    itemCard.appendChild(buys);}\n  itemCard.hidden=false;\n  const dx=parseFloat(itemDot.style.left)||0,dy=parseFloat(itemDot.style.top)||0,w=itemCard.offsetWidth||280,hh=itemCard.offsetHeight||120;\n  itemCard.style.left=Math.max(8,Math.min(viewer.clientWidth-w-8,dx))+'px';\n  itemCard.style.top=(dy+32+hh<viewer.clientHeight-8?dy+32:Math.max(8,dy-hh-8))+'px';\n  hideItemDot  and darker (seen from the room), and a faint mottle. It tiles:\n   the threads run the whole tile, the slubs and the mottle wrap round its edges. Drawn once, with a fixed seed */\nconst WALL_TILE=.25;   // m\nfunction fabricTexture(){\n  const N=512,c=document.createElement('canvas');c.width=c.height=N;const g=c.getContext('2d');\n  let seed=20261123;const rnd=()=>{seed=(seed+0x6D2B79F5)|0;let t=Math.imul(seed^(seed>>>15),1|seed);t=(t+Math.imul(t^(t>>>7),61|t))^t;return ((t^(t>>>14))>>>0)/4294967296;};\n  const shade=(v,a)=>`rgba(${v},${v},${v},${a})`;\n  g.fillStyle='rgb(238,238,238)';g.fillRect(0,0,N,N);\n  // the mottle: big soft spots, a shade lighter or darker\n  for(let i=0;i<70;i++){const x=rnd()*N,y=rnd()*N,r=30+rnd()*90,v=rnd()<.5?255:150,a=.05+rnd()*.05;\n    for(const dx of [-N,0,N])for(const dy of [-N,0,N]){const gr=g.createRadialGradient(x+dx,y+dy,0,x+dx,y+dy,r);\n      gr.addColorStop(0,shade(v,a));gr.addColorStop(1,shade(v,0));g.fillStyle=gr;g.fillRect(x+dx-r,y+dy-r,2*r,2*r);}}\n  // the threads: the weft along the rows, the warp along the columns, each its own shade; every other crossing the other on top\n  for(let y=0;y<N;y+=2){g.fillStyle=shade(rnd()<.5?255:120,.06+rnd()*.08);g.fillRect(0,y,N,1);}\n  for(let x=0;x<N;x+=2){g.fillStyle=shade(rnd()<.5?255:120,.05+rnd()*.06);g.fillRect(x,0,1,N);}\n  g.fillStyle=shade(90,.08);for(let y=0;y<N;y+=2)for(let x=(y/2)%2*2;x<N;x+=4)g.fillRect(x,y,1,1);\n  // the slubs: mostly along the weft, a few along the warp\n  for(let i=0;i<420;i++){const along=rnd()<.8,x=rnd()*N,y=Math.floor(rnd()*N/2)*2,l=12+rnd()*110,w=1+Math.floor(rnd()*2),v=rnd()<.55?255:110,a=.08+rnd()*.12;\n    g.fillStyle=shade(v,a);for(const d of [-N,0])along?g.fillRect(x+d,y,l,w):g.fillRect(y,x+d,w,l);}\n  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=8;\n  return t;\n}\n/* the wallpaper on the walls by their place in the room, not by the pieces' own UVs: a wall is built of boxes of all sizes and cut\n   in height by scale (a flight, «Высота стен»), so a texture on them would stretch. Each face takes the two axes along it */\nconst wallTexU={wallTex:{value:fabricTexture()},wallTexOn:{value:1}};\nfunction wallShader(m){\n  m.onBeforeCompile=sh=>{\n    Object.assign(sh.uniforms,wallTexU);\n    sh.vertexShader='varying vec3 vWallPos;\\nvarying vec3 vWallN;\\n'+sh.vertexShader.replace('#include <begin_vertex>',\n      '#include <begin_vertex>\\nvWallPos=(modelMatrix*vec4(transformed,1.0)).xyz;vWallN=normalize(mat3(modelMatrix)*objectNormal);');\n    sh.fragmentShader='uniform sampler2D wallTex;\\nuniform float wallTexOn;\\nvarying vec3 vWallPos;\\nvarying vec3 vWallN;\\n'+sh.fragmentShader.replace('#include <map_fragment>',\n      `#include <map_fragment>\n      if(wallTexOn>.5){vec3 n=abs(vWallN);vec2 uv=n.y>max(n.x,n.z)?vWallPos.xz:n.x>n.z?vWallPos.zy:vWallPos.xy;\n        diffuseColor.rgb*=texture2D(wallTex,uv/${WALL_TILE.toFixed(3)}).rgb;}`);\n  };\n  m.customProgramCacheKey=()=>'wallpaper';\n  return m;\n}\nwallShader(wallMat);\n/* the photo wallpaper (js/mural-photo.js: 5 strips 100 × 270 cm as one picture): one sheet on its wall's room face, 1 mm off it.\n   The part of the picture on the wall: from its left edge (the left corner as one faces the wall) as long as the wall is; when the walls\n   are cut lower, its top is cut off with them (the texture's share up shrinks with the sheet), not squashed */\nconst muralTex=new THREE.TextureLoader().load(MURAL_JPG);muralTex.encoding=THREE.sRGBEncoding;muralTex.anisotropy=8;\nconst muralMat=new THREE.MeshStandardMaterial({map:muralTex,roughness:.85,polygonOffset:true,polygonOffsetFactor:-1});\nfunction muralMesh(w,y0){\n  const [at,dir]=w.face,sg=dir[0]==='+'?1:-1,[r0,r1]=w.run,len=Math.min(A.muralW,r1-r0);\n  if(dir[1]!=='x')return null;   // the side walls only: the long ones, no openings in them\n  const m=new THREE.Mesh(new THREE.PlaneGeometry(len*MM,A.muralH*MM),muralMat);\n  m.rotation.y=sg*Math.PI/2;m.receiveShadow=true;\n  muralTex.repeat.x=len/A.muralW;muralTex.repeat.y=1;muralTex.offset.x=muralTex.offset.y=0;\n  // facing +x (the left wall) its left is at the window end, facing -x at the door end\n  const z0=sg>0?r1-len:r0,x=at+sg,box=[Math.min(at,x),Math.max(at,x),z0,z0+len];\n  m.position.set(x*MM,(y0+A.muralH/2)*MM,(z0+len/2)*MM);\n  return {m,box};\n}\n/* the cornice under the ceiling and the skirting board: white, profiled, along the room face of every wall */\nconst trimMat=new THREE.MeshStandardMaterial({color:0xf3f1ec,roughness:.55});\nconst CORN_D=80,PL_T=16;   // mm: the cornice out on the ceiling, the skirting board's thickness\n/* a profile (s: out from the wall into the room, v: up from its bottom; mm) run along a wall face, l mm long. The cornice: a bead at\n   its bottom, a cove (concave, its centre in the room) up to a small step and a flat band along the ceiling. The skirting board:\n   upright, its top rounded toward the wall */\nfunction trimProfile(kind,h){\n  const S=new THREE.Shape(),k=MM;\n  if(kind==='cornice'){\n    const f=h/110,d=CORN_D;   // drawn for 110 high, scaled to h\n    S.moveTo(0,0);S.lineTo(12*k,0);S.lineTo(12*k,8*f*k);S.lineTo(8*k,14*f*k);\n    for(let i=1;i<=12;i++){const t=i/12*Math.PI/2;S.lineTo((66-58*Math.cos(t))*k*d/80,(14+82*Math.sin(t))*f*k);}\n    S.lineTo(74*k*d/80,96*f*k);S.lineTo(74*k*d/80,102*f*k);S.lineTo(d*k,102*f*k);S.lineTo(d*k,h*k);S.lineTo(0,h*k);\n  }else{\n    S.moveTo(0,0);S.lineTo(PL_T*k,0);S.lineTo(PL_T*k,(h-14)*k);S.quadraticCurveTo(PL_T*k,h*k,4*k,h*k);S.lineTo(0,h*k);\n  }\n  return S;\n}\n// … made a mesh of the room face of wall w (face: [where, the way into the room]) from a to b along it, y0 up from the floor;\n// its geometry centred on its box, as the wall pieces are (the wall-height cut and a flight scale it about its middle)\nfunction trimMesh(kind,w,a,b,y0,h){\n  const g=new THREE.ExtrudeGeometry(trimProfile(kind,h),{depth:(b-a)*MM,bevelEnabled:false,curveSegments:8});\n  const [at,dir]=w.face,alongX=dir[1]==='z',sg=dir[0]==='+'?1:-1,depth=kind==='cornice'?CORN_D:PL_T;\n  // the profile's s goes into the room: +x as built; turned so it goes the face's way, the run along the wall\n  g.rotateY(alongX?-sg*Math.PI/2:(sg>0?0:Math.PI));\n  if(g.center)g.center();\n  const m=new THREE.Mesh(g,trimMat);m.castShadow=m.receiveShadow=true;\n  const e=new THREE.LineSegments(new THREE.EdgesGeometry(g,30),edgeMat);e.raycast=()=>{};m.add(e);\n  const box=alongX?[a,b,...[at,at+sg*depth].sort((p,q)=>p-q)]:[...[at,at+sg*depth].sort((p,q)=>p-q),a,b];\n  m.position.set((box[0]+box[1])/2*MM,(y0+h/2)*MM,(box[2]+box[3])/2*MM);\n  return {m,box};\n}\n// the ceiling's colour (the walk's ceiling): white whatever the walls' paint is — the palette's «Белый», as the theme has it\nconst ceilColor=new THREE.Color();\nconst edgeMat=new THREE.LineBasicMaterial({color:0x4a4d50,transparent:true,opacity:.35});\n// how dark the walls' and doors' outlines are in a view: in «Контуры» (only the outlines of the walls) dark, else as «Контур стен» (one setting for every view)\nconst edgeOp=V=>V.Wm==='edges'?.9:S.edge?.5:0;\nconst winMat=new THREE.MeshStandardMaterial({color:0xf4f4f1,roughness:.5});\nconst glassMat=new THREE.MeshStandardMaterial({color:0x9fc3d4,roughness:.1,metalness:.1,transparent:true,opacity:.35,depthWrite:false});\nconst footMat=new THREE.MeshBasicMaterial({color:0x3b3d3f,polygonOffset:true,polygonOffsetFactor:-2});\nconst lowFootMat=new THREE.MeshBasicMaterial({color:0x5a5d60,polygonOffset:true,polygonOffsetFactor:-2});   // a low wall's footprint: a shade lighter, not quite a wall\nconst floor=new THREE.Mesh(new THREE.PlaneGeometry(30,30),floorMat);\nfloor.rotation.x=-Math.PI/2;floor.position.set(CX,-.002,CZ);floor.receiveShadow=true;scene.add(floor);   // the walls cast their shadows outside the room\n\n\n// take everything out of a group; its own materials and textures go too, shared ones stay (own=false)\nfunction emptyGroup(g,own=true){\n  g.children.slice().forEach(c=>{g.remove(c);c.traverse(o=>{if(o.geometry)o.geometry.dispose();\n    if(own&&o.material)[].concat(o.material).forEach(m=>{if(m.map)m.map.dispose();m.dispose();});});});\n}\n\n/* room floors and the names on them: rebuilt when the sizes change */\nconst roomGroup=new THREE.Group();scene.add(roomGroup);\nlet roomMats=[];\nconst roomPoly=r=>r.poly||[[r.r[0],r.r[2]],[r.r[1],r.r[2]],[r.r[1],r.r[3]],[r.r[0],r.r[3]]];   // the floor's outline [x,z]…\nconst polySigned=q=>q.reduce((s,a,i)=>{const b=q[(i+1)%q.length];return s+a[0]*b[1]-b[0]*a[1];},0)/2;   // mm², > 0 counter-clockwise in x,z\nconst polyArea=q=>Math.abs(polySigned(q));\n// a flat floor on an outline, lying at y 0\nconst polyFloorGeometry=q=>new THREE.ShapeGeometry(new THREE.Shape(q.map(p=>new THREE.Vector2(p[0]*MM,-p[1]*MM)))).rotateX(-Math.PI/2);\nconst roomArea=r=>`${(polyArea(roomPoly(r))/1e6).toFixed(2).replace('.',',')} м²`;\nconst roomCaption=r=>`${r.name} · ${roomArea(r)}`;\nfunction buildRooms(){\n  emptyGroup(roomGroup);emptyGroup(namesGroup);nameTexts.length=0;\n  roomMats=ROOMS.map(r=>{\n    const m=new THREE.MeshStandardMaterial({roughness:.9,...BEHIND});\n    const p=new THREE.Mesh(polyFloorGeometry(roomPoly(r)),m);p.receiveShadow=true;roomGroup.add(p);return m;});\n  ROOMS.forEach(r=>{const t=roomCaption(r);floorText(t,r.at[0],r.at[1],.153,t.length-roomArea(r).length);});   // the name and the floor area of the room (153 mm a line)\n}\n\n/* room names lying on the floor */\nconst namesGroup=new THREE.Group();scene.add(namesGroup);\nconst nameTexts=[];\nconst nameFont=f=>`400 ${f}px \"Tenor Sans\", Georgia, serif`;\n// the canvas is as wide as the text in the font as it is now: built before the web font has come, a name is measured in\n// the fallback, narrower one, and paintNames widens it (canvas and plane) once the font is there\nconst nameW=n=>{n.g.font=nameFont(n.f);return Math.ceil(n.g.measureText(n.text).width)+24;};\n// where the area part of a name lies across the texture (0..1), in the font as it is now\nconst areaSpan=n=>{n.g.font=nameFont(n.f);const w=n.c.width;return [(12+n.g.measureText(n.text.slice(0,n.cut)).width)/w,(12+n.g.measureText(n.text).width)/w];};\nfunction floorText(text,x,z,h,cut=0){   // cut: where the area starts in the text\n  const c=document.createElement('canvas'),g=c.getContext('2d'),f=96;\n  c.height=f+30;\n  const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=8;\n  const m=new THREE.Mesh(new THREE.PlaneGeometry(1,h),new THREE.MeshBasicMaterial({map:t,transparent:true,depthWrite:false}));\n  m.rotation.x=-Math.PI/2;m.position.set(x*MM,.004,z*MM);m.renderOrder=2;namesGroup.add(m);\n  nameTexts.push({c,g,t,m,h,text,f,cut});\n}\nfunction paintNames(){\n  const col=css('--fg');\n  nameTexts.forEach(n=>{\n    const w=nameW(n);\n    if(w!==n.c.width){n.c.width=w;n.t.dispose();n.m.scale.x=n.h*w/n.c.height;}   // a new size: the texture is made anew\n    n.g.clearRect(0,0,n.c.width,n.c.height);n.g.font=nameFont(n.f);\n    n.g.fillStyle=col;n.g.globalAlpha=.55;n.g.textBaseline='middle';n.g.fillText(n.text,12,n.c.height/2+4);n.t.needsUpdate=true;});\n}\nbuildRooms();\n\n\n/* ---------- walls ---------- */\nlet wallGroup=null, wallParts=[];   // {m: wall mesh, f: () => visible in \"cut\" mode}\nlet wallLines=[], linesTop=-1;      // {e: edge lines of a whole wall, w, f}; linesTop: cut height (mm) they are drawn for\nconst doors=[];                     // {g: hinge pivot, h: leaf height, t: target angle, a: angle, max, s: the way it turns (±1)}\nlet arcs=null;\n/* edges of a whole wall cut at height top (mm): outer corners, opening reveals and the cut top only.\n   The wall is built from boxes (pieces between openings, lintels, sills), but the joints between them are not drawn,\n   so a wall with a door or a window reads as one piece */\nfunction wallOutline(w,top){\n  const [x0,x1,z0,z1]=w.r,alongX=w.along;top=Math.min(top,w.h||H);   // a low wall ends at its own height\n  const [u0,u1,v0,v1]=alongX?[x0,x1,z0,z1]:[z0,z1,x0,x1];   // u along the wall, v across it\n  const s=[],P=(u,y,v)=>alongX?s.push(u*MM,y*MM,v*MM):s.push(v*MM,y*MM,u*MM);\n  const seg=(ua,ya,va,ub,yb,vb)=>{P(ua,ya,va);P(ub,yb,vb);};\n  const holes=w.holes||[];\n  // section of the wall at height y: its length minus the openings cut through at that height\n  const ring=(y,open)=>{let cur=u0;const iv=[];\n    holes.filter(open).sort((p,q)=>p[0]-q[0]).forEach(([a,b])=>{iv.push([cur,a]);cur=b;});iv.push([cur,u1]);\n    iv.forEach(([a,b])=>{if(b-a<1)return;seg(a,y,v0,b,y,v0);seg(a,y,v1,b,y,v1);seg(a,y,v0,a,y,v1);seg(b,y,v0,b,y,v1);});};\n  ring(0,([,,,sill=0])=>sill===0);\n  ring(top,([,,h,sill=0])=>sill<top&&top<=h);\n  [u0,u1].forEach(u=>[v0,v1].forEach(v=>seg(u,0,v,u,top,v)));\n  holes.forEach(([a,b,h,sill=0])=>{if(sill>=top)return;\n    const y1=Math.min(h,top),across=y=>{[v0,v1].forEach(v=>seg(a,y,v,b,y,v));seg(a,y,v0,a,y,v1);seg(b,y,v0,b,y,v1);};\n    [v0,v1].forEach(v=>{seg(a,sill,v,a,y1,v);seg(b,sill,v,b,y1,v);});   // jambs\n    if(h<top)across(h);if(sill>0)across(sill);});                        // head and sill of the opening\n  return s;\n}\n// the walls a view shows: its flagged walls, or all of them\nconst showsWall=(vw,w)=>vw.rooms==='all'||w.rooms.some(r=>vw.rooms.includes(r));\n/* the part of a wall inside the view's frame (walls and frames are rectangles along the axes); null when nothing is left.\n   along: the wall's direction, taken from the whole wall (a short cut piece must not turn across);\n   holes are cut with it, kept: the holes that are still whole (their doors and windows can show) */\nfunction clipWall(w,fr){\n  const along=(w.r[1]-w.r[0])>=(w.r[3]-w.r[2]),holes0=w.holes||[];\n  if(!fr)return {...w,along,holes:holes0,kept:holes0.map((h,i)=>i)};\n  const r=[Math.max(w.r[0],fr[0]),Math.min(w.r[1],fr[1]),Math.max(w.r[2],fr[2]),Math.min(w.r[3],fr[3])];\n  if(r[1]-r[0]<1||r[3]-r[2]<1)return null;\n  const [u0,u1]=along?[r[0],r[1]]:[r[2],r[3]],holes=[],kept=[];\n  holes0.forEach(([a,b,...rest],i)=>{const a1=Math.max(a,u0),b1=Math.min(b,u1);if(b1-a1<1)return;\n    holes.push([a1,b1,...rest]);if(a1===a&&b1===b)kept.push(i);});\n  return {...w,r,along,holes,kept};\n}\nlet holesShown=new Set();   // 'wallId:holeIndex' of the openings on screen whole: their doors show\nlet wallFeet=[];            // {m, id, box}: dark footprints of the wall pieces on the floor\n// the walls a view shows, cut by its frame: wall id → clipped wall\nfunction viewWalls(vw){\n  const fr=vw.frame?vw.frame():null,m=new Map();\n  WALLS.filter(w=>showsWall(vw,w)).forEach(w=>{const c=clipWall(w,fr);if(c)m.set(w.id,c);});\n  return m;\n}\n/* builds the given (clipped) walls: full-height pieces between openings, a lintel over each opening, a sill under a window,\n   their footprints, and the window when its opening is whole. Every piece keeps its wall id and its box on the plan (mm),\n   so a flight between views can cut it shorter and lower without new geometry. ruleOf: the cut-mode rule of a wall;\n   lines: the outline of every whole wall */\nfunction buildWallSet(list,ruleOf,lines){\n  if(wallGroup){scene.remove(wallGroup);wallGroup.traverse(o=>{if(o.geometry)o.geometry.dispose();});}\n  wallGroup=new THREE.Group();wallParts=[];wallLines=[];wallFeet=[];linesTop=-1;holesShown=new Set();\n  const solid=(id,x0,x1,y0,y1,z0,z1,f)=>{\n    const g=new THREE.BoxGeometry((x1-x0)*MM,(y1-y0)*MM,(z1-z0)*MM);\n    const m=new THREE.Mesh(g,wallMat);\n    m.position.set((x0+x1)/2*MM,(y0+y1)/2*MM,(z0+z1)/2*MM);m.castShadow=m.receiveShadow=true;\n    wallGroup.add(m);wallParts.push({m,f,id,box:[x0,x1,z0,z1],b:y0*MM,t:y1*MM,h:(y1-y0)*MM});\n  };\n  const foot=(id,x0,x1,z0,z1,mat)=>{const m=new THREE.Mesh(new THREE.PlaneGeometry((x1-x0)*MM,(z1-z0)*MM),mat);m.rotation.x=-Math.PI/2;m.position.set((x0+x1)/2*MM,.002,(z0+z1)/2*MM);m.renderOrder=1;wallGroup.add(m);wallFeet.push({m,id,box:[x0,x1,z0,z1]});};\n  list.forEach(w=>{\n    w.kept.forEach(i=>holesShown.add(w.id+':'+i));\n    const [x0,x1,z0,z1]=w.r,alongX=w.along,f=ruleOf(w),id=w.id,fm=w.h?lowFootMat:footMat;   // a low wall's footprint lighter\n    if(lines){const e=new THREE.LineSegments(new THREE.BufferGeometry(),edgeMat);e.raycast=()=>{};wallGroup.add(e);wallLines.push({e,w,f});}\n    // split the wall along its long side: full-height pieces between openings, a lintel over each opening\n    let cur=alongX?x0:z0;const end=alongX?x1:z1;\n    const piece=(a,b,y0,y1=w.h||H)=>{if(b-a<1)return;\n      if(alongX)solid(id,a,b,y0,y1,z0,z1,f);else solid(id,x0,x1,y0,y1,a,b,f);\n      if(y0===0){if(alongX)foot(id,a,b,z0,z1,fm);else foot(id,x0,x1,a,b,fm);}};\n    (w.holes||[]).forEach(([a,b,h,sill=0])=>{piece(cur,a,0);piece(a,b,h);if(sill>0)piece(a,b,0,sill);cur=b;});\n    piece(cur,end,0);\n    // the cornice under the ceiling and the skirting board along its room face, the part of them in the wall's clipped rect\n    if(w.face){const [r0,r1]=alongX?[x0,x1]:[z0,z1],add=(kind,a,b,y0,h)=>{a=Math.max(a,r0);b=Math.min(b,r1);if(b-a<1||h<1)return;\n        const t=trimMesh(kind,w,a,b,y0,h);wallGroup.add(t.m);wallParts.push({m:t.m,f,id,box:t.box,b:y0*MM,t:(y0+h)*MM,h:h*MM,trim:true});};\n      add('cornice',w.run[0],w.run[1],H-A.cornH,A.cornH);w.plinth.forEach(([a,b])=>add('plinth',a,b,0,A.plH));\n      const mu=A.muralWall===id&&muralMesh(w,A.plH);\n      if(mu){wallGroup.add(mu.m);wallParts.push({m:mu.m,f,id,box:mu.box,b:A.plH*MM,t:(A.plH+A.muralH)*MM,h:A.muralH*MM,photo:true,fit:k=>{muralTex.repeat.y=k;}});}}\n  });\n  // the window: white frame in the middle of the wall's thickness, a mullion when it is wide, glass and an inner sill board; hides with its wall\n  if(holesShown.has('window:0')){ const w=WALLS.find(v=>v.id==='window'),f=ruleOf(w),FW=60,FD=70,zc=A.L+A.tW/2;\n    const x0=winX-A.winW/2,x1=winX+A.winW/2,y0=A.winS,y1=A.winT;\n    const part=(a,b,c,d,e,g,mat,shadow=true)=>{const m=new THREE.Mesh(new THREE.BoxGeometry((b-a)*MM,(d-c)*MM,(g-e)*MM),mat);\n      m.position.set((a+b)/2*MM,(c+d)/2*MM,(e+g)/2*MM);m.castShadow=shadow;m.receiveShadow=true;wallGroup.add(m);\n      wallParts.push({m,f,id:'window',box:[a,b,e,g],b:c*MM,t:d*MM,h:(d-c)*MM,glass:!shadow});};\n    const bar=(a,b,c,d)=>part(a,b,c,d,zc-FD/2,zc+FD/2,winMat);\n    bar(x0,x1,y0,y0+FW);bar(x0,x1,y1-FW,y1);bar(x0,x0+FW,y0+FW,y1-FW);bar(x1-FW,x1,y0+FW,y1-FW);\n    if(A.winW>=1200)bar(winX-FW/2,winX+FW/2,y0+FW,y1-FW);\n    part(x0+FW,x1-FW,y0+FW,y1-FW,zc-4,zc+4,glassMat,false);\n    part(x0-50,x1+50,y0-10,y0+20,A.L-50,zc-FD/2-1,winMat); }   // sill board top sits above the wall opening, so the two faces never coincide (no z-fighting)\n  scene.add(wallGroup);\n  // doors and their swings show with their whole openings\n  doors.forEach(d=>{const on=holesShown.has(d.hole);d.g.visible=on;if(d.frame)d.frame.visible=on;});\n  if(arcs)arcs.children.forEach(l=>{l.visible=holesShown.has(l.userData.hole);});\n}\n// the walls of a view at rest: exact pieces, outlines, its cut-mode rules\nfunction buildWalls(vw){dropMorph();buildWallSet([...viewWalls(vw).values()],w=>fadeRule(w,vw),true);}\n\n/* ---------- a flight between views ----------\n   The walls of both views at once. How each wall looks is taken twice: at the start, as it is on screen (the old view's\n   wall mode and cut-mode rules, the camera where it is), and at the end, as the new view will show it (the camera where\n   the flight ends). In between nothing is decided per frame: a wall only goes from its rect and height to the new ones —\n   up from the floor, down into it, shorter or longer — so nothing pops or blinks on the way. A wall hidden at both ends\n   stays hidden. Pieces are built for the span of both rects and cut to the current one by scale, like the cut height;\n   at the end the new view's walls are built exactly */\nlet morph=null;   // {w: id → {rF,rT,cF,cT,hF,hT,exT,kept}, e, opF,opT, lnF,lnT, doors, mats: id → own materials}\n// is a wall seen by the camera at c (m) under its cut-mode rule: the camera must be on the room's side of its face\nconst sideVisible=(side,r,c)=>!side||({'-x':c.x>r[1],'+x':c.x<r[0],'-z':c.z>r[3],'+z':c.z<r[2]})[side];\n// a view's walls at rest with the camera at pos: id → {r, cut: the height it shows (0: hidden), h: its height for the doors, kept}.\n// A door whose opening is whole stands at the view's height even when its wall is hidden by the cut mode; one that is not\n// there goes with its wall (up from the floor or down into it)\nfunction wallsAtRest(id,pos){\n  const vw=VIEWS[id],V=VS[id],m=new Map();\n  const h=V.Wm==='feet'?0:V.Wm==='row'?H*.1:H*V.Wh/100;\n  viewWalls(vw).forEach((c,k)=>{\n    const seen=V.Wm!=='auto'||sideVisible(fadeSide(c,vw),fadeWall(c,vw).r.map(v=>v*MM),pos),cut=seen?h:0;\n    m.set(k,{r:c.r,cut,h:c.kept.length?h:cut,kept:c.kept});});\n  return m;\n}\n// a wall of the flight at progress e: its rect (mm), the height it shows and the height its doors are cut at (mm)\nfunction morphWall(s,e){return {r:s.rF&&s.rT?s.rF.map((v,i)=>v+(s.rT[i]-v)*e):(s.rF||s.rT),cut:s.cF+(s.cT-s.cF)*e,h:s.hF+(s.hT-s.hF)*e};}\n// the walls on screen now: a new flight starts from here, even in the middle of another one\nfunction wallsNow(){\n  if(!morph)return wallsAtRest(view,camera.position);\n  const m=new Map();\n  morph.w.forEach((s,id)=>{const n=morphWall(s,morph.e);m.set(id,{r:n.r,cut:n.cut,h:n.h,kept:s.kept});});\n  return m;\n}\n// the walls of a flight have their own materials (they fade by themselves); they go with the flight\nfunction dropMorph(){\n  if(!morph)return;\n  morph.mats.forEach(m=>Object.values(m).forEach(x=>x.dispose()));\n  morph=null;\n}\n/* a door in a flight shows as at rest: while its opening is whole in its wall's rect on the way (and whole at one end\n   of the flight at least); its height goes with the wall (wallsAtRest: h) */\nfunction doorInFlight(d,at){\n  const [id,i]=d.hole.split(':'),s=morph.w.get(id);\n  if(!s||!s.kept.includes(+i))return false;\n  const c=clipWall(WALLS.find(v=>v.id===id),at(id).r);\n  return !!c&&c.kept.includes(+i);\n}\n// pos: where the camera ends the flight (m)\nfunction startWallMorph(from,toId,pos){\n  const to=wallsAtRest(toId,pos),w=new Map(),list=[],V=VS[toId];\n  new Set([...from.keys(),...to.keys()]).forEach(id=>{\n    const F=from.get(id),T=to.get(id),a=(F||T).r,b=(T||F).r;\n    const c=clipWall(WALLS.find(v=>v.id===id),[Math.min(a[0],b[0]),Math.max(a[1],b[1]),Math.min(a[2],b[2]),Math.max(a[3],b[3])]);\n    if(!c)return;\n    // an opening whole in either view keeps its door or window while its wall is there\n    const kept=new Set([...(F?F.kept:[]),...(T?T.kept:[])]);c.kept=c.kept.filter(i=>kept.has(i));\n    list.push(c);\n    w.set(id,{rF:F?F.r:null,rT:T?T.r:null,cF:F?F.cut:0,cT:T?T.cut:0,hF:F?F.h:0,hT:T?T.h:0,exT:!!T,kept:c.kept});\n  });\n  const doorsF=doorGroup.visible;   // as on screen now\n  dropMorph();buildWallSet(list,()=>()=>true,true);\n  // every wall of the flight gets its own materials: near the floor it fades away instead of leaving a dark slab,\n  // its footprint fades out or in, its outline fades with its height\n  const mats=new Map();\n  list.forEach(c=>mats.set(c.id,{body:wallShader(wallMat.clone()),line:edgeMat.clone(),foot:(c.h?lowFootMat:footMat).clone()}));\n  wallParts.forEach(p=>{const m=mats.get(p.id);if(m&&p.m.material===wallMat)p.m.material=m.body;});\n  wallLines.forEach(l=>{l.e.material=mats.get(l.w.id).line;});\n  wallFeet.forEach(p=>{p.m.material=mats.get(p.id).foot;});\n  // the walls' see-through and their outlines go from how they look now to the new view's mode (in «Контуры» they are see-through)\n  const edgesOnly=V.Wm==='edges';\n  morph={w,e:0,opF:wallMat.opacity,opT:edgesOnly?0:1,lnF:edgeMat.opacity,lnT:edgeOp(V),\n    doors:doorsF&&V.dm!=='none'&&V.Wm!=='feet',mats};   // doors show only if both ends show them\n}\n// a piece cut to the rect r (mm) along x and z by scale; false when nothing of it is left. flat: a footprint (its z is its local y)\n// Works while walls are plain colour: a textured wall (tiles) would stretch, its pieces would have to be rebuilt instead.\nfunction fitBox(m,box,r,flat){\n  const x0=Math.max(box[0],r[0]),x1=Math.min(box[1],r[1]),z0=Math.max(box[2],r[2]),z1=Math.min(box[3],r[3]);\n  if(x1-x0<.5||z1-z0<.5)return false;\n  m.scale.x=(x1-x0)/(box[1]-box[0]);m.scale[flat?'y':'z']=(z1-z0)/(box[3]-box[2]);\n  m.position.x=(x0+x1)/2*MM;m.position.z=(z0+z1)/2*MM;return true;\n}\n/* \"cut\" mode: a wall hides while the camera is on its side named by the view's fade ('-x': past its -x face, …).\n   A room view hides, besides, every wall while the camera is on its side away from the room's floor;\n   the plan hides only the walls it names. A wall named with another wall's id has no rule of its own: it hides with that one */\nconst fadeWall=(w,vw)=>{const n=(vw.fade||{})[w.id];return n&&!/^[+-][xz]$/.test(n)?WALLS.find(v=>v.id===n):w;};\nfunction fadeSide(w,vw){\n  const o=fadeWall(w,vw);if(o!==w)return fadeSide(o,vw);\n  const named=(vw.fade||{})[w.id];\n  if(named||!Array.isArray(vw.rooms))return named;\n  const rm=ROOMS.find(r=>r.id===vw.rooms[0]).r,r=w.r;\n  return r[3]<=rm[2]?'-z':r[2]>=rm[3]?'+z':r[1]<=rm[0]?'-x':r[0]>=rm[1]?'+x':null;\n}\nfunction fadeRule(w,vw){const r=fadeWall(w,vw).r.map(v=>v*MM),side=fadeSide(w,vw);return side?()=>sideVisible(side,r,camera.position):()=>true;}\n\n\n/* the door: a 10 mm lining through the wall round the opening (two jambs, the head between them), the leaf in it, its room face\n   flush with the wall's; hinged at the right jamb (seen from the room), it opens into the room. Casings CW on both faces of the wall\n   over the lining's ends (flush with its inner faces), jambs to the head, the head over them (white, as the leaf);\n   a white square lever handle on each face. CW, CT, LT: apartment.js */\nconst leafMat=new THREE.MeshStandardMaterial({color:0xf1efea,roughness:.6});\nconst doorHandleMat=new THREE.MeshStandardMaterial({color:0xf7f7f5,roughness:.3});   // the door's handles: white\nconst doorGroup=new THREE.Group();scene.add
