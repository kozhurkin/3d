<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>Комната на Энгельса</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Tenor+Sans&display=swap">
<style>
/* Layout: a slim tab bar over a full-height frame that holds the selected cabinet model */
:root{
  --bg:#ECEDE9; --panel:#F7F7F4; --fg:#1E2321; --muted:#626B66; --line:#D3D6D0; --accent:#2F5D50; --accent-soft:#DCE7E2; --warn:#A5561C;
  --f-display:"Tenor Sans", Georgia, serif; --f-body:"Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151917; --panel:#1C211F; --fg:#E6E9E6; --muted:#9AA39E; --line:#2E3532; --accent:#86BBA8; --accent-soft:#243530; --warn:#E3A06A; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#151917; --panel:#1C211F; --fg:#E6E9E6; --muted:#9AA39E; --line:#2E3532; --accent:#86BBA8; --accent-soft:#243530; --warn:#E3A06A; color-scheme:dark;}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);display:flex;flex-direction:column}
.bar{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:nowrap;padding-top:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabs{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.tabs a{font:500 14px/1 var(--f-body);color:var(--fg);text-decoration:none;padding:9px 16px;background:var(--panel)}
.tabs a+a{border-left:1px solid var(--line)}
.tabs a[aria-current="page"]{background:var(--accent);color:var(--panel)}
.tabs a:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
/* too narrow for the row of tabs: the open one with a menu of all of them (data-compact, set by fitBar) */
.pick{position:relative;display:none;min-width:0}
.bar[data-compact] .tabs{display:none}
.bar[data-compact] .pick{display:block}
.pick-btn{display:flex;align-items:center;gap:8px;height:34px;box-sizing:border-box;max-width:100%;padding:0 10px 0 16px;background:var(--accent);color:var(--panel);border:1px solid var(--accent);border-radius:4px;font:500 14px/1 var(--f-body);cursor:pointer}
.pick-btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick-btn svg{flex:none;transition:transform .15s}
.pick-btn[aria-expanded="true"] svg{transform:rotate(180deg)}
.pick-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pick-menu{position:absolute;z-index:10;left:0;top:calc(100% + 4px);min-width:100%;box-sizing:border-box;display:flex;flex-direction:column;padding:4px;background:var(--panel);border:1px solid var(--line);border-radius:4px;box-shadow:0 6px 18px rgba(0,0,0,.14)}
.pick-menu a{font:500 14px/1 var(--f-body);color:var(--fg);text-decoration:none;padding:10px 12px;border-radius:3px;white-space:nowrap}
.pick-menu a:hover,.pick-menu a:focus-visible{background:var(--accent-soft);outline:none}
.pick-menu a[aria-current="page"]{color:var(--accent)}
.save{flex:none;width:34px;height:34px;display:grid;place-items:center;padding:0;background:var(--panel);border:1px solid var(--line);border-radius:4px;color:var(--fg);cursor:pointer}
.save:hover{border-color:var(--accent);color:var(--accent)}
.save:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.save[aria-busy="true"]{cursor:progress;color:var(--muted)}
.save[aria-busy="true"] svg{animation:savePulse 1s ease-in-out infinite alternate}
.save.err{border-color:var(--warn);color:var(--warn)}
@keyframes savePulse{to{opacity:.35}}
@media (prefers-reduced-motion: reduce){.save[aria-busy="true"] svg{animation:none}}
.frames{flex:1;min-height:0;position:relative}
.frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
</style>

</head><body>
<header class="bar">
  <nav class="tabs" aria-label="Вкладки">
    <a href="#plan" data-tab="plan">Комната</a>
    <a href="#walk" data-tab="walk">Обход</a>
  </nav>
  <div class="pick">
    <button class="pick-btn" id="pickBtn" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="pickMenu"><span id="pickLabel"></span><svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div class="pick-menu" id="pickMenu" role="menu" aria-label="Вкладки" hidden></div>
  </div>
  <button class="save" id="saveGlb" type="button" aria-label="Скачать 3D-модель (GLB)" title="Скачать 3D-модель (.glb): то, что видно сейчас"><svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M10 3v9m-4-4 4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 13v2.5h12V13" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
</header>
<main class="frames">
  <iframe id="f-app" title="Комната" hidden></iframe>
</main>

<script>

dow:0 1px 4px rgba(0,0,0,.25)}\n.item-dot:focus-visible{outline:2px solid var(--accent);outline-offset:2px}\n.item-card{position:absolute;z-index:5;width:min(280px,calc(100% - 16px));box-sizing:border-box;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:6px;font:400 12px/1.45 var(--f-body);color:var(--fg);box-shadow:0 4px 16px rgba(0,0,0,.2)}\n.item-card h3{margin:0 22px 4px 0;font:600 13px/1.3 var(--f-body)}\n.item-card p{margin:2px 0 0;color:var(--muted)}\n.item-card .x{position:absolute;right:4px;top:3px;width:22px;height:22px;padding:0;border:0;background:none;color:var(--muted);font:400 18px/1 var(--f-body);cursor:pointer}\n.item-card .x:hover{color:var(--accent)}\n.item-card p.next{display:flex;gap:6px;align-items:baseline;margin-top:4px}\n.item-card p.next .lnk{font-size:12px;padding:0}\n.item-card .buys{display:grid;grid-template-columns:1fr auto auto;column-gap:8px;margin-top:6px;padding-top:6px;border-top:1px solid var(--line)}\n.item-card .buy{grid-column:1/-1;display:grid;grid-template-columns:subgrid;align-items:baseline}\n.item-card .buy.more{margin-top:4px}\n.item-card .buy .nm{grid-column:1;color:var(--muted)}\n.item-card .buy b{grid-column:2;font-weight:600;color:var(--fg)}\n.item-card .buy b:first-child{grid-column:1}\n.item-card .buy a{grid-column:3;color:var(--accent)}\n.item-card .buy.total{margin-top:6px;padding-top:6px;border-top:1px solid var(--line)}\n.item-card .buy.total .nm{color:var(--fg)}\n.dbg-on .info{max-width:calc(100% - min(260px,42%) - 36px)}\n.dbg-on .info[aria-expanded=\"true\"] .it{white-space:normal}\n.btn{font:500 13px/1 var(--f-body);color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:8px 4px;cursor:pointer}\n.btn:hover{border-color:var(--accent)}\n.btn:focus-visible,.seg button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}\n.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:18px;display:flex;flex-direction:column;gap:20px;min-width:0;overflow:auto;max-height:calc(100vh - 32px);box-sizing:border-box}\nh1{font:400 26px/1.15 var(--f-display);margin:0;text-wrap:balance}\n.sub{color:var(--muted);margin-top:4px;font-family:var(--f-mono);font-size:12px}\nh2{font:600 11px/1 var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}\nh3{font:600 12px/1 var(--f-body);margin:14px 0 10px;color:var(--fg)}\nh2+h3{margin-top:0}   /* a block's first switch titled right under the block's title */\n.field{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 10px}\n.field label{font-size:13px}\n.field output{font:500 13px var(--f-mono);font-variant-numeric:tabular-nums}\n.field input{grid-column:1/-1;width:100%;accent-color:var(--accent);margin:0}\n.seg{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}\n.seg button{flex:1;font:500 13px var(--f-body);background:transparent;color:var(--fg);border:0;padding:8px 4px;cursor:pointer}\n.seg button+button{border-left:1px solid var(--line)}\n.seg button[aria-pressed=\"true\"]{background:var(--accent);color:var(--panel)}\n.views{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}\n.views.v4{grid-template-columns:repeat(4,minmax(0,1fr))}\n.toggles{display:flex;flex-direction:column;gap:8px;margin-top:12px}\n.toggles label{display:flex;gap:8px;align-items:center;font-size:13px;cursor:pointer}\n.toggles input{accent-color:var(--accent);margin:0}\ndl.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;margin:0;font-size:12px}\ndl.facts dt{color:var(--muted)}\ndl.facts dd{margin:0;font-family:var(--f-mono);font-variant-numeric:tabular-nums}\ndl.facts .q{color:var(--warn)}\n.room{font:600 12px var(--f-body);margin:14px 0 8px}\n.room:first-of-type{margin-top:0}\n.note{font-size:12px;color:var(--muted)}\n.wcs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}\n.wc{display:flex;flex-direction:column;gap:6px;padding:6px;font:500 12px/1.2 var(--f-body);color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:4px;cursor:pointer;text-align:center}\n.wc i{display:block;height:30px;border-radius:3px;border:1px solid rgba(0,0,0,.14)}\n.wc:hover{border-color:var(--accent)}\n.wc[aria-pressed=\"true\"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}\n.wc:focus-visible{outline:2px solid var(--accent);outline-offset:2px}\n.row{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px}\n.btn[aria-pressed=\"true\"]{border-color:var(--accent);color:var(--accent)}\nol.qs{margin:0;padding-left:18px;font-size:12px;display:flex;flex-direction:column;gap:6px}\ndetails.sizes{border:1px solid var(--line);border-radius:4px;padding:10px 12px}\ndetails.sizes summary{cursor:pointer;font:600 11px/1 var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);list-style:none;display:flex;justify-content:space-between;align-items:center}\ndetails.sizes summary::-webkit-details-marker{display:none}\ndetails.sizes summary::after{content:\"\";width:7px;height:7px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg);margin-top:-4px;transition:transform .15s}\ndetails.sizes[open] summary::after{transform:rotate(-135deg);margin-top:4px}\ndetails.sizes summary:focus-visible{outline:2px solid var(--accent);outline-offset:4px}\n.sizes-body{display:flex;flex-direction:column;gap:16px;margin-top:14px}\n.sizes-body h3{margin:0 0 10px}\n.sizes-body .field{margin-bottom:10px}\n.sizes-body p:empty{display:none}\n/* finishes of a room: decor and plain-colour swatches, what each group has, own colour, the swatch menu */\n.decors{display:flex;flex-direction:column;gap:6px}\n.decors button{position:relative;display:flex;gap:10px;align-items:center;text-align:left;font:500 13px/1.25 var(--f-body);color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:4px;padding:7px 9px;cursor:pointer}\n.decors button small{font:400 11px var(--f-mono);color:var(--muted)}\n.decors button[aria-pressed=\"true\"]{border-color:var(--accent);background:var(--accent-soft)}\n.decors button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}\n.tags{position:absolute;top:4px;right:4px;display:flex;gap:2px;pointer-events:none}\n.tags b{font:600 9px/1 var(--f-mono);background:var(--accent);color:var(--panel);padding:3px 4px;border-radius:3px}\n.lnk{font:inherit;font-size:11px;color:var(--accent);background:none;border:0;padding:0 0 0 4px;cursor:pointer;text-decoration:underline}\n.finnow{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;margin-top:10px;font-size:12px}\n.finnow span:nth-child(odd){color:var(--muted)}\n.ctx{position:fixed;z-index:50;display:flex;flex-direction:column;min-width:170px;padding:4px;background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.18)}\n.ctx button{font:500 13px var(--f-body);color:var(--fg);background:none;border:0;border-radius:4px;padding:8px 10px;text-align:left;cursor:pointer}\n.ctx button:hover,.ctx button:focus-visible{background:var(--accent-soft);outline:none}\n.ctx .ctx-h{font:600 11px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 10px 4px}\n.decors.unis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}\n.decors .cc{position:relative;display:flex;flex-direction:column;gap:6px;padding:6px;border:1px solid var(--line);border-radius:4px;font:500 12px/1.25 var(--f-body);cursor:pointer}\n.chips{display:flex;gap:6px;flex-wrap:wrap}\n.chip{font:500 12px/1 var(--f-mono);padding:6px 8px;border-radius:999px;background:var(--accent-soft);color:var(--ok)}\n.chip.warn{background:var(--warn-soft);color:var(--warn)}\n.decors .cc.on{border-color:var(--accent);background:var(--accent-soft)}\n.decors .cc input{width:100%;height:36px;padding:0;border:1px solid rgba(0,0,0,.15);border-radius:3px;background:none;cursor:pointer}\n.decors .cc small{font:400 10px var(--f-mono);color:var(--muted)}\n.decors.unis button{flex-direction:column;align-items:stretch;gap:6px;padding:6px;font-size:12px}\n.decors.unis .sw{width:100%;height:36px}\n.decors.unis small{font-size:10px}\n.sw{width:28px;height:28px;border-radius:3px;flex:none;border:1px solid rgba(0,0,0,.15)}\n/* cut list */\n.tablewrap{overflow-x:auto}\ntable{width:100%;border-collapse:collapse;font-size:12px}\nth{font-weight:600;text-align:left;color:var(--muted);padding:6px 4px;border-bottom:1px solid var(--line)}\ntd{padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:top}\ntd.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}\nth.n{text-align:right}\nth.mh{color:var(--fg);padding-top:12px;font-size:12px}\n.tot{display:flex;flex-direction:column;gap:4px;font:500 12px var(--f-mono);margin-top:8px;flex-wrap:wrap}\ntextarea.code{width:100%;height:80px;font:11px var(--f-mono);margin-top:8px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:4px;box-sizing:border-box}\n@media (max-width:900px){\n  .app{grid-template-columns:minmax(0,1fr)}\n  /* the scene edge to edge: out over the page's side padding, square corners; its buttons kept out of a notch */\n  .viewer{min-height:340px;height:72vh;border-radius:0;\n    margin-left:calc(-1*max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1*max(16px,env(safe-area-inset-right,0px)))}\n  .info{left:calc(12px + env(safe-area-inset-left,0px))}\n  .camb{right:calc(12px + env(safe-area-inset-right,0px))}\n  .panel{max-height:none}\n}\n<\/style>\n\n<div class=\"app\">\n  <div class=\"viewer\" id=\"viewer\">\n    <canvas id=\"c\" aria-label=\"3D-модель комнаты\"><\/canvas>\n    <button class=\"camb\" id=\"camBtn\" aria-expanded=\"false\" aria-label=\"Мини-вид камеры\" title=\"Камера: точка вращения и мини-вид\"><svg viewBox=\"0 0 20 20\" width=\"16\" height=\"16\" aria-hidden=\"true\"><rect x=\"2\" y=\"6\" width=\"11\" height=\"9\" rx=\"1.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"/><path d=\"M13 9l5-3v9l-5-3z\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linejoin=\"round\"/><\/svg><\/button>\n    <button class=\"info\" id=\"infoBtn\" aria-expanded=\"false\" aria-label=\"Как управлять\"><span class=\"ii\">i<\/span><span class=\"it\" data-info=\"orbit\">Тяните — вращение <b class=\"sep\">•<\/b> Shift + тяните, средняя кнопка или два пальца — сдвиг <b class=\"sep\">•<\/b> колесо — масштаб к курсору <b class=\"sep\">•<\/b> клик по двери — открыть или закрыть, удержание — открывать постепенно<\/span><span class=\"it\" data-info=\"walk\" hidden>W A S D — идти <b class=\"sep\">•<\/b> два пальца на трекпаде — идти: вверх — вперёд, вниз — назад, вбок — в сторону <b class=\"sep\">•<\/b> мышь — смотреть (клик по сцене, Esc или правая кнопка — отпустить) <b class=\"sep\">•<\/b> пробел — прыжок <b class=\"sep\">•<\/b> Ctrl или C — присесть <b class=\"sep\">•<\/b> Shift — тихий шаг <b class=\"sep\">•<\/b> E или клик — дверь в прицеле, удержание кнопки — открывать постепенно <b class=\"sep\">•<\/b> на сенсорном экране: палец в левом нижнем углу — идти (чем дальше от центра круга, тем быстрее), в остальной части — смотреть, тап — дверь<\/span><\/button>\n    <button class=\"item-dot\" id=\"itemDot\" hidden aria-label=\"Что это\"><span aria-hidden=\"true\">i<\/span><\/button>\n    <div class=\"item-card\" id=\"itemCard\" hidden role=\"dialog\"><\/div>\n    <i class=\"aim\" id=\"walkAim\" hidden><\/i>\n    <div class=\"stick\" id=\"walkStick\" hidden><i><\/i><\/div>\n    <div class=\"walk-hint\" id=\"walkHint\" hidden data-touch=\"Палец в левом нижнем углу — идти, в остальной части — смотреть · тап по двери — открыть\">Кликните по сцене, чтобы смотреть мышью · Esc или правая кнопка — отпустить<\/div>\n  <\/div>\n\n  <aside class=\"panel\" data-panel=\"plan\" hidden>\n    <div>\n      <h1>Комната<\/h1>\n      <div class=\"sub\" id=\"pSub\"><\/div>\n    <\/div>\n\n    <div>\n      <h2>Вид<\/h2>\n      <h3>Стены<\/h3>\n      <div class=\"seg\" role=\"group\" aria-label=\"Стены\">\n        <button data-wm=\"show\" aria-pressed=\"false\">Монолит<\/button>\n        <button data-wm=\"row\" aria-pressed=\"false\" title=\"Монолитные стены высотой 10%\">Ряд<\/button>\n        <button data-wm=\"auto\" aria-pressed=\"true\" title=\"Стена убирается, когда камера за ней\">Разрез<\/button>\n        <button data-wm=\"edges\" aria-pressed=\"false\">Контуры<\/button>\n        <button data-wm=\"feet\" aria-pressed=\"false\">Следы<\/button>\n      <\/div>\n      <div class=\"field\" style=\"margin-top:10px\"><label for=\"pWh\">Высота стен<\/label><output data-wh-out><\/output><input type=\"range\" id=\"pWh\" data-wh min=\"5\" max=\"100\" step=\"5\"><\/div>\n      <h3>Дверь<\/h3>\n      <div class=\"seg\" role=\"group\" aria-label=\"Дверь\">\n        <button data-dm=\"closed\" aria-pressed=\"true\">Закрыта<\/button>\n        <button data-dm=\"open\" aria-pressed=\"false\">Открыта<\/button>\n        <button data-dm=\"none\" aria-pressed=\"false\">Без двери<\/button>\n      <\/div>\n      <div class=\"toggles\">\n        <label><input type=\"checkbox\" id=\"pDims\" checked> Размеры<\/label>\n        <label><input type=\"checkbox\" id=\"pNames\" checked> Название и площадь<\/label>\n        <label><input type=\"checkbox\" id=\"pFloors\" checked> Цвет пола<\/label>\n      <\/div>\n      <h3>Камера<\/h3>\n      <div class=\"views v4\" data-cams>\n        <button class=\"btn\" data-cam=\"plan\" title=\"Комната под углом\">План<\/button>\n        <button class=\"btn\" data-cam=\"top\">Сверху<\/button>\n        <button class=\"btn\" data-cam=\"door\" title=\"На стену с дверью\">На дверь<\/button>\n        <button class=\"btn\" data-cam=\"window\" title=\"На стену с окном\">На окно<\/button>\n      <\/div>\n    <\/div>\n\n    <details class=\"sizes\" id=\"pSizesBox\">\n      <summary>Размеры стен<\/summary>\n      <div class=\"sizes-body\">\n        <p class=\"note\" style=\"margin:0\">Размеры меняются только здесь; «Обход» берёт их отсюда.<\/p>\n        <div id=\"pSizes\" style=\"display:contents\"><\/div>\n        <p class=\"note\" id=\"pSizeMsg\" aria-live=\"polite\" style=\"margin:0;color:var(--warn)\"><\/p>\n      <\/div>\n    <\/details>\n\n    <div data-shared-slot style=\"display:contents\"><\/div>\n\n    <div>\n      <h2>Размеры по умолчанию<\/h2>\n      <div class=\"row\" style=\"margin-top:0\">\n        <button class=\"btn\" id=\"pSaveA\">Запомнить текущие<\/button>\n        <button class=\"btn\" id=\"pResetA\">Вернуть исходные<\/button>\n      <\/div>\n      <div class=\"row\">\n        <button class=\"btn\" id=\"pCopyA\">Скопировать код размеров<\/button>\n        <span class=\"note\" id=\"pAMsg\" aria-live=\"polite\"><\/span>\n      <\/div>\n      <textarea id=\"pACode\" hidden readonly aria-label=\"Код размеров\" style=\"width:100%;height:70px;font:11px var(--f-mono);margin-top:8px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:4px;box-sizing:border-box\"><\/textarea>\n      <p class=\"note\" style=\"margin:8px 0 0\">«Запомнить» сохраняет размеры в этом браузере. Чтобы они стали исходными для всех, скопируйте код и пришлите его в чат.<\/p>\n    <\/div>\n\n    <div>\n      <h2>Что заложено, мм<\/h2>\n      <div id=\"pFacts\"><\/div>\n    <\/div>\n\n    <div>\n      <h2>Нужно уточнить<\/h2>\n      <ol class=\"qs\">\n        <li>Боковые стены 4797 — из площади 13 м² при короткой стене 2710. Точная длина?<\/li>\n        <li>Ширина двери 800 — между наличниками (видимый проём); проём в стене на 20 больше (коробка по 10 под наличниками). Высота проёма не задана — взято 2000.<\/li>\n        <li>Петли и сторона открывания не заданы: дверь на петлях справа (если смотреть из комнаты), открывается в комнату.<\/li>\n        <li>Толщина стен не задана: со стороны двери и боковые — 120, с окном — 400.<\/li>\n      <\/ol>\n    <\/div>\n\n  <\/aside>\n  <aside class=\"panel\" data-panel=\"walk\" hidden>\n    <div>\n      <h1>Обход<\/h1>\n      <div class=\"sub\">вид от первого лица<\/div>\n    <\/div>\n\n    <div>\n      <h2>Камера<\/h2>\n      <div class=\"field\"><label for=\"walkEye\">Высота камеры<\/label><output id=\"walkEyeOut\"><\/output><input type=\"range\" id=\"walkEye\" min=\"1000\" max=\"2000\" step=\"10\"><\/div>\n      <p class=\"note\" style=\"margin:8px 0 0\">Высота глаз над полом стоя. Присед опускает её на треть.<\/p>\n    <\/div>\n\n    <div>\n      <h2>Вид<\/h2>\n      <h3>Стены<\/h3>\n      <div class=\"seg\" role=\"group\" aria-label=\"Стены\">\n        <button data-wm=\"show\" aria-pressed=\"false\">Монолит<\/button>\n        <button data-wm=\"row\" aria-pressed=\"false\" title=\"Монолитные стены высотой 10%\">Ряд<\/button>\n        <button data-wm=\"auto\" aria-pressed=\"true\" title=\"Стена убирается, когда камера за ней\">Разрез<\/button>\n        <button data-wm=\"edges\" aria-pressed=\"false\">Контуры<\/button>\n        <button data-wm=\"feet\" aria-pressed=\"false\">Следы<\/button>\n      <\/div>\n      <div class=\"field\" style=\"margin-top:10px\"><label for=\"walkWh\">Высота стен<\/label><output data-wh-out><\/output><input type=\"range\" id=\"walkWh\" data-wh min=\"5\" max=\"100\" step=\"5\"><\/div>\n      <h3>Дверь<\/h3>\n      <div class=\"seg\" role=\"group\" aria-label=\"Дверь\">\n        <button data-dm=\"closed\" aria-pressed=\"true\">Закрыта<\/button>\n        <button data-dm=\"open\" aria-pressed=\"false\">Открыта<\/button>\n        <button data-dm=\"none\" aria-pressed=\"false\">Без двери<\/button>\n      <\/div>\n      <p class=\"note\" style=\"margin:8px 0 0\">Стены не пускают при любом виде; потолок — только при монолитных стенах в полную высоту (в «Разрезе» — пока камера в комнате). Без двери проём свободен.<\/p>\n    <\/div>\n\n    <div data-shared-slot style=\"display:contents\"><\/div>\n\n    <div>\n      <h2>Управление<\/h2>\n      <dl class=\"facts\">\n        <dt>Идти<\/dt><dd>W A S D или стрелки<\/dd>\n        <dt>Смотреть<\/dt><dd>мышь: клик по сцене, Esc или правая кнопка — отпустить<\/dd>\n        <dt>Прыжок<\/dt><dd>пробел<\/dd>\n        <dt>Присесть<\/dt><dd>Ctrl или C<\/dd>\n        <dt>Тихий шаг<\/dt><dd>Shift<\/dd>\n        <dt>Дверь<\/dt><dd>E или клик в прицел<\/dd>\n      <\/dl>\n      <p class=\"note\" style=\"margin:8px 0 0\">Стены и закрытая дверь не пускают. Если браузер не отдаёт мышь, смотрите, ведя мышью с нажатой кнопкой.<\/p>\n    <\/div>\n\n  <\/aside>\n<\/div>\n<!-- light and wall colour: shared by all views, moved into the panel of the view on screen -->\n<div id=\"shared\" style=\"display:contents\" hidden>\n    <div>\n      <h2>Цвет стен<\/h2>\n      <div class=\"wcs\" id=\"wcs\" role=\"group\" aria-label=\"Цвет стен\"><\/div>\n      <div class=\"toggles\"><label title=\"Тёмные линии по рёбрам стен и двери; в «Контурах» они есть всегда\"><input type=\"checkbox\" id=\"wEdge\" checked> Контур стен<\/label><\/div>\n    <\/div>\n\n    <div>\n      <h2>Свет<\/h2>\n      <div class=\"field\"><label for=\"Laz\">Направление<\/label><output id=\"oLaz\"><\/output><input type=\"range\" id=\"Laz\" min=\"-180\" max=\"180\" step=\"1\"><\/div>\n      <div class=\"field\" style=\"margin-top:10px\"><label for=\"Lel\">Высота над горизонтом<\/label><output id=\"oLel\"><\/output><input type=\"range\" id=\"Lel\" min=\"5\" max=\"89\" step=\"1\"><\/div>\n      <div class=\"field\" style=\"margin-top:10px\"><label for=\"Li\">Яркость солнца<\/label><output id=\"oLi\"><\/output><input type=\"range\" id=\"Li\" min=\"0\" max=\"200\" step=\"5\"><\/div>\n      <div class=\"field\" style=\"margin-top:10px\"><label for=\"La\">Рассеянный свет<\/label><output id=\"oLa\"><\/output><input type=\"range\" id=\"La\" min=\"0\" max=\"200\" step=\"5\"><\/div>\n      <div class=\"row\"><button class=\"btn\" id=\"lightSpin\" aria-pressed=\"false\">Вращать свет<\/button><button class=\"btn\" id=\"lightReset\">Сбросить<\/button><\/div>\n    <\/div>\n\n    <div>\n      <h2>Переход между вкладками<\/h2>\n      <div class=\"toggles\"><label><input type=\"checkbox\" id=\"wFly\" checked> Анимированный перелёт<\/label><\/div>\n      <p class=\"note\" style=\"margin:8px 0 0\">Стены опускаются и поднимаются, камера и тени переходят вместе. Без галочки стены меняются сразу, а камера плавно доезжает.<\/p>\n    <\/div>\n\n<\/div>\n\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js\"><\/script>\n<script>\n/* ---------- the room, mm: one for every tab ----------\n   Plain data and arithmetic only (no THREE, no DOM), so it also runs in Node for checks.\n   x → right, z → from the door wall toward the window (top view: the door wall at the top, the window at the bottom).\n   origin: the inner corner of the room between the door wall and the left wall, as seen from the room facing the door.\n   Set here: what the building has (walls, ceiling) and where an opening stands in it, measured as in the room;\n   what is left between them (the wall left of the door, the piers by the window) follows in apartment() */\nconst APT_A={\n  H:3060,                           // ceiling height\n  W:2710,                           // the short wall with the door, inner face to inner face (and the window wall opposite)\n  L:4797,                           // the side walls, from the door wall to the window wall: 13 m² / 2710\n  dR:1570,                          // the door: its right casing's outer edge from the right corner (seen from the room)\n  dW:800,                           // the door: between the casings' inner edges\n  dH:2000,                          // the doorway's height (the lining's head underside)\n  winW:1200, winS:900, winT:2950,   // the window, centred in the wall opposite the door: width, sill and top from the floor\n  tD:120, tS:120, tW:400            // walls: the door wall, the side walls, the window wall (outer)\n};\nconst CW=70,CT=10,LT=10;   // door casings: width, thickness; the lining through the wall between them: thickness\n\n/* Builds the whole model from the sizes; a: the sizes to change, the rest come from APT_A.\n   Walls: rect r=[x0,x1,z0,z1]; ext: outer side of the wall (each wall of one room is an outer one of the model);\n   holes along the long side: [from, to, top, sill]. Room: floor rect r */\nfunction apartment(a){\n  const A=Object.assign({},APT_A,a);\n  const dB=A.W-A.dR-CW+LT;             // the doorway's right edge: its lining is under the casing's inner edge\n  const dA=dB-A.dW-2*LT;               // … its left edge\n  const dL=dA+LT-CW;                   // the left casing's outer edge from the left corner (what is left of the wall)\n  const winX=A.W/2;                    // window centre\n  const WALLS=[\n    {id:'door',name:'Стена с дверью',r:[-A.tS,A.W+A.tS,-A.tD,0],ext:'-z',rooms:['room'],holes:[[dA,dB,A.dH]]},\n    {id:'right',name:'Правая стена',r:[A.W,A.W+A.tS,0,A.L],ext:'+x',rooms:['room']},\n    {id:'left',name:'Левая стена',r:[-A.tS,0,0,A.L],ext:'-x',rooms:['room']},\n    {id:'window',name:'Стена с окном',r:[-A.tS,A.W+A.tS,A.L,A.L+A.tW],ext:'+z',rooms:['room'],holes:[[winX-A.winW/2,winX+A.winW/2,A.winT,A.winS]]}\n  ];\n  const ROOMS=[{id:'room',name:'Комната',r:[0,A.W,0,A.L],origin:[0,0],col:'--fl-kit',at:[A.W/2,A.L/2]}];\n  const BOX={x0:-A.tS,x1:A.W+A.tS,z0:-A.tD,z1:A.L+A.tW};\n  return {A,H:A.H,dA,dB,dL,winX,WALLS,ROOMS,BOX};\n}\n\n/* What does not fit with these sizes: [] when everything does. The plan's size sliders stop at the last value that fits */\nfunction aptProblems(a){\n  const m=apartment(a),A=m.A,out=[];\n  m.WALLS.forEach(w=>{if(w.r[1]<w.r[0]||w.r[3]<w.r[2])out.push(`«${w.name}» не помещается`);});\n  if(m.dL<0)out.push('Левый наличник двери заходит за левый угол');\n  if(A.dR<0)out.push('Правый наличник двери заходит за правый угол');\n  if(A.winW>A.W-200)out.push('Окно шире стены (нужно хотя бы по 100 мм до боковых стен)');\n  if(A.winT-A.winS<300)out.push('Окно ниже 300 мм');\n  if(A.dH+CW>A.H-20)out.push('Наличник над дверью упирается в потолок');\n  if(A.winT>A.H-50)out.push('Окно выше потолка (нужно хотя бы 50 мм)');\n  return out;\n}\n\n<\/script>\n<script>\n/* ---------- engine: renderer, scene, light, orbit camera, camera debug, render loop ----------\n   One scene for every tab. Other modules hook into the loop through frameHooks (called after the camera moves). */\nconst MM=.001;\nconst reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;\n\n/* ---------- the room as built now (js/apartment.js) ----------\n   Its sizes are edited on the plan: setModel() swaps the model, then modelHooks rebuild what depends on it\n   (walls, doors, floors, dimensions…). The sizes remembered in this browser (eng-model-v1) are the ones to start with. */\nlet A,H,dA,dB,dL,winX,WALLS,ROOMS,BOX,CX,CZ;\nconst MKEY='eng-model-v1';\nconst modelHooks=[];\nfunction useModel(a){\n  ({A,H,dA,dB,dL,winX,WALLS,ROOMS,BOX}=apartment(a));\n  CX=(BOX.x0+BOX.x1)/2*MM;CZ=(BOX.z0+BOX.z1)/2*MM;\n}\nfunction setModel(a){useModel(a);modelHooks.forEach(f=>f());}\n// only the sizes that differ from the defaults, so a later change of a default still reaches the sizes nobody touched\nconst modelDiff=()=>Object.fromEntries(Object.entries(A).filter(([k,v])=>k in APT_A&&APT_A[k]!==v));   // a size the model no longer has (an old save's) is dropped\nuseModel((()=>{try{const a=JSON.parse(localStorage.getItem(MKEY)||'null');if(a&&!aptProblems(a).length)return a;}catch(e){}return {};})());\n\n/* ---------- three setup ---------- */\nconst canvas=document.getElementById('c'), viewer=document.getElementById('viewer');\nconst renderer=new THREE.WebGLRenderer({canvas,antialias:true});\nrenderer.setPixelRatio(Math.min(devicePixelRatio,2));\nrenderer.outputEncoding=THREE.sRGBEncoding;\nrenderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;\nrenderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;\nrenderer.localClippingEnabled=tru h.cos(goal.phi),goalT.z+goal.r*sp*Math.cos(goal.theta));}\nfunction shortWay(){\n  while(goal.theta-cam.theta>Math.PI)goal.theta-=2*Math.PI;\n  while(cam.theta-goal.theta>Math.PI)goal.theta+=2*Math.PI;\n}\nconst ptrs=new Map();let pinch0=0;\nconst _r=new THREE.Vector3(),_u=new THREE.Vector3();\nfunction pan(dx,dy){\n  const k=2*cam.r*Math.tan(camera.fov*Math.PI/360)/viewer.clientHeight;\n  _r.setFromMatrixColumn(camera.matrixWorld,0);_u.setFromMatrixColumn(camera.matrixWorld,1);\n  cam.target.addScaledVector(_r,-dx*k).addScaledVector(_u,dy*k);goalT.copy(cam.target);\n}\nlet downAt=null;\n// a view that takes the mouse itself (the walk, walk.js): no orbit, pan, zoom or door clicks of its own here\nconst ownMouse=()=>!!(VIEWS[view]&&VIEWS[view].mouse);\n// long press on a door moves it gradually: closed → opens, fully open → closes, part-open → reverses the last direction\n// (at 60°/s, or at the door's own holdRate per second if it has one)\nconst HOLD_MS=500,HOLD_RATE=60*Math.PI/180;let held=null,holdTimer=null;\nfunction holdDoor(d){const dir=d.a<=.01?1:d.a>=d.max-.01?-1:-(d.last||-1);d.last=dir;held={d,dir};d.t=d.a;}\ncanvas.addEventListener('pointerdown',e=>{\n  if(ownMouse())return;\n  if(e.pointerType==='mouse'&&e.button!==0&&e.button!==1&&e.button!==2)return;\n  downAt=e.button===0&&!e.shiftKey&&ptrs.size===0?{x:e.clientX,y:e.clientY}:null;\n  clearTimeout(holdTimer);\n  if(downAt){const d0=downAt;holdTimer=setTimeout(()=>{\n    if(downAt!==d0||ptrs.size>1)return;\n    const d=pickDoor({clientX:d0.x,clientY:d0.y});if(!d)return;\n    holdDoor(d);canvas.style.cursor='grabbing';\n  },HOLD_MS);}\n  if(e.button===1)e.preventDefault();\n  canvas.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY,pan:e.button===1||e.button===2});\n  if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch0=Math.hypot(a.x-b.x,a.y-b.y);}\n});\ncanvas.addEventListener('pointermove',e=>{\n  if(!ptrs.has(e.pointerId)||ownMouse())return;const pr=ptrs.get(e.pointerId
