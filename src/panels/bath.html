    <div>
      <h1>Санузел</h1>
      <div class="sub" id="bSub"></div>
    </div>

    <div>
      <h2>Вид</h2>
      <h3>Стены</h3>
      <div class="seg" role="group" aria-label="Стены">
        <button data-wm="show" aria-pressed="false">Монолит</button>
        <button data-wm="row" aria-pressed="false" title="Монолитные стены высотой 10%">Ряд</button>
        <button data-wm="auto" aria-pressed="true" title="Стены, загораживающие обзор, убираются">Разрез</button>
        <button data-wm="skeleton" aria-pressed="false">Скелет</button>
        <button data-wm="outline" aria-pressed="false">Контуры</button>
      </div>
      <div class="field" style="margin-top:10px"><label for="bWh">Высота стен</label><output data-wh-out></output><input type="range" id="bWh" data-wh min="5" max="100" step="5"></div>
      <div class="field" style="margin-top:10px"><label for="bFrameL">Левая стена видна на</label><output id="bFrameLOut"></output><input type="range" id="bFrameL" min="600" max="1900" step="10"></div>
      <h3>Камера</h3>
      <div class="views" data-cams>
        <button class="btn" data-cam="persp">3/4</button>
        <button class="btn" data-cam="front" title="Вид на унитаз">Спереди</button>
        <button class="btn" data-cam="top">Сверху</button>
        <button class="btn" data-cam="tall">Пенал</button>
        <button class="btn" data-cam="upper" title="Шкаф над инсталляцией">Верхний</button>
        <button class="btn" data-cam="riser" title="Канализационный короб">Короб</button>
      </div>
      <p class="note" style="margin:8px 0 0">Ниша, потолок и короб меняются на «Планировке».</p>
    </div>

    <div data-shared-slot style="display:contents"></div>
