    <div>
      <h1>Прихожая</h1>
      <div class="sub" id="hSub"></div>
    </div>

    <div>
      <h2>Вид</h2>
      <h3>Стены</h3>
      <div class="seg" role="group" aria-label="Стены">
        <button data-wm="show" aria-pressed="false">Монолит</button>
        <button data-wm="row" aria-pressed="false" title="Монолитные стены высотой 10%">Ряд</button>
        <button data-wm="auto" aria-pressed="true" title="Стены, загораживающие обзор, убираются">Разрез</button>
        <button data-wm="skeleton" aria-pressed="false">Скелет</button>
        <button data-wm="outline" aria-pressed="false">Контуры</button>
      </div>
      <div class="field" style="margin-top:10px"><label for="hWh">Высота стен</label><output data-wh-out></output><input type="range" id="hWh" data-wh min="5" max="100" step="5"></div>
      <div class="field" style="margin-top:10px"><label for="hFrameSd">Боковые стены видны на</label><output id="hFrameSdOut"></output><input type="range" id="hFrameSd" min="0" max="1900" step="10"></div>
      <h3>Камера</h3>
      <div class="views v4" data-cams>
        <button class="btn" data-cam="persp">3/4</button>
        <button class="btn" data-cam="front">Спереди</button>
        <button class="btn" data-cam="side">Сбоку</button>
        <button class="btn" data-cam="low" title="Низ шкафа и примыкание к полу">Низ</button>
        <button class="btn" data-cam="shelves">Полки</button>
        <button class="btn" data-cam="back" title="Со стороны лестничной площадки">Сзади</button>
        <button class="btn" data-cam="fake" title="Вид на левую фальш-панель">Фальш</button>
        <button class="btn" data-cam="mezz">Антресоль</button>
      </div>
      <p class="note" style="margin:8px 0 0">Ширина прихожей, входной проём, глубина откоса и потолок меняются на «Планировке».</p>
    </div>

    <div data-shared-slot style="display:contents"></div>
