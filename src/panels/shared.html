    <div>
      <h2>Цвет стен</h2>
      <div class="wcs" id="wcs" role="group" aria-label="Цвет стен"></div>
      <div class="toggles"><label title="Тёмные линии по рёбрам стен и дверей; в «Скелете» они есть всегда"><input type="checkbox" id="wEdge" checked> Контур стен</label></div>
    </div>

    <div>
      <h2>Свет</h2>
      <div class="field"><label for="Laz">Направление</label><output id="oLaz"></output><input type="range" id="Laz" min="-180" max="180" step="1"></div>
      <div class="field" style="margin-top:10px"><label for="Lel">Высота над горизонтом</label><output id="oLel"></output><input type="range" id="Lel" min="5" max="89" step="1"></div>
      <div class="field" style="margin-top:10px"><label for="Li">Яркость солнца</label><output id="oLi"></output><input type="range" id="Li" min="0" max="200" step="5"></div>
      <div class="field" style="margin-top:10px"><label for="La">Рассеянный свет</label><output id="oLa"></output><input type="range" id="La" min="0" max="200" step="5"></div>
      <div class="row"><button class="btn" id="lightSpin" aria-pressed="false">Вращать свет</button><button class="btn" id="lightReset">Сбросить</button></div>
    </div>

    <div>
      <h2>Переход между вкладками</h2>
      <div class="toggles"><label><input type="checkbox" id="wFly" checked> Анимированный перелёт</label></div>
      <p class="note" style="margin:8px 0 0">Стены опускаются и поднимаются, шкафы выходят из пола, камера и тени переходят вместе. Без галочки стены меняются сразу, а камера плавно доезжает.</p>
    </div>
