<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}[hidden]{display:none!important}</style>
<title>Планировка</title>
</head><body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Tenor+Sans&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: 3D plan fills the left, view settings on the right; stacks on phones */
:root{
  --bg:#ECEDE9; --panel:#F7F7F4; --fg:#1E2321; --muted:#626B66; --line:#D3D6D0;
  --accent:#2F5D50; --accent-soft:#DCE7E2; --warn:#A5561C; --warn-soft:#F4E4D6; --ok:#2F6B45;
  --scene-bg:#DCDDD8; --scene-floor:#C9C6BF; --scene-wall:#E7E5E0;
  --fl-hall:#D9CDB8; --fl-bath:#C5CDD0; --fl-kit:#D3CDBF;
  --f-display:"Tenor Sans", "Georgia", serif;
  --f-body:"Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151917; --panel:#1C211F; --fg:#E6E9E6; --muted:#9AA39E; --line:#2E3532;
  --accent:#86BBA8; --accent-soft:#243530; --warn:#E3A06A; --warn-soft:#3A2B1F; --ok:#8BC79F;
  --scene-bg:#202523; --scene-floor:#2A2C2A; --scene-wall:#3A3C39;
  --fl-hall:#3B362E; --fl-bath:#30363A; --fl-kit:#38342E; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#151917; --panel:#1C211F; --fg:#E6E9E6; --muted:#9AA39E; --line:#2E3532;
  --accent:#86BBA8; --accent-soft:#243530; --warn:#E3A06A; --warn-soft:#3A2B1F; --ok:#8BC79F;
  --scene-bg:#202523; --scene-floor:#2A2C2A; --scene-wall:#3A3C39;
  --fl-hall:#3B362E; --fl-bath:#30363A; --fl-kit:#38342E; color-scheme:dark;}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45}
.app{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;min-height:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;box-sizing:border-box}
.viewer{position:relative;min-width:0;border-radius:6px;overflow:hidden;background:var(--scene-bg);min-height:560px}
#c{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#c:active{cursor:grabbing}
.info{position:absolute;left:12px;bottom:12px;display:flex;align-items:center;min-height:28px;box-sizing:border-box;max-width:calc(100% - 24px);padding:4px 9px;background:var(--panel);border:1px solid var(--line);border-radius:4px;font:400 12px/1.35 var(--f-body);color:var(--muted);text-align:left;cursor:pointer;opacity:.95}
.info:hover,.info[aria-expanded="true"]{border-color:var(--accent)}
.info:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.info .ii{font:600 italic 14px/1 Georgia,serif;color:var(--accent);flex:none}
.info .sep{color:var(--accent);font-weight:700;margin:0 3px}
.info .it{display:none}
.info[aria-expanded="true"] .it{display:block;margin-left:9px}
.btn{font:500 13px/1 var(--f-body);color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:8px 4px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible,.seg button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:18px;display:flex;flex-direction:column;gap:20px;min-width:0;overflow:auto;max-height:calc(100vh - 32px);box-sizing:border-box}
h1{font:400 26px/1.15 var(--f-display);margin:0;text-wrap:balance}
.sub{color:var(--muted);margin-top:4px;font-family:var(--f-mono);font-size:12px}
h2{font:600 11px/1 var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
h3{font:600 12px/1 var(--f-body);margin:14px 0 10px;color:var(--fg)}
.field{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 10px}
.field label{font-size:13px}
.field output{font:500 13px var(--f-mono);font-variant-numeric:tabular-nums}
.field input{grid-column:1/-1;width:100%;accent-color:var(--accent);margin:0}
.seg{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{flex:1;font:500 13px var(--f-body);background:transparent;color:var(--fg);border:0;padding:8px 4px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--panel)}
.views{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.toggles{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.toggles label{display:flex;gap:8px;align-items:center;font-size:13px;cursor:pointer}
.toggles input{accent-color:var(--accent);margin:0}
dl.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;margin:0;font-size:12px}
dl.facts dt{color:var(--muted)}
dl.facts dd{margin:0;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
dl.facts .q{color:var(--warn)}
.room{font:600 12px var(--f-body);margin:14px 0 8px}
.room:first-of-type{margin-top:0}
.note{font-size:12px;color:var(--muted)}
ol.qs{margin:0;padding-left:18px;font-size:12px;display:flex;flex-direction:column;gap:6px}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .viewer{min-height:340px;height:72vh}
  .panel{max-height:none}
}
</style>

<div class="app">
  <div class="viewer" id="viewer">
    <canvas id="c" aria-label="3D-план квартиры: прихожая, санузел и кухня"></canvas>
    <button class="info" id="infoBtn" aria-expanded="false" aria-label="Как управлять"><span class="ii">i</span><span class="it">Тяните — вращение <b class="sep">•</b> Shift + тяните, средняя кнопка или два пальца — сдвиг <b class="sep">•</b> колесо — масштаб к курсору <b class="sep">•</b> клик по двери — открыть или закрыть, удержание — открывать постепенно</span></button>
  </div>

  <aside class="panel">
    <div>
      <h1>Планировка</h1>
      <div class="sub" id="sub"></div>
    </div>

    <div>
      <h2>Вид</h2>
      <div class="seg" role="group" aria-label="Стены">
        <button data-wm="show" aria-pressed="false">Монолит</button>
        <button data-wm="row" aria-pressed="false" title="Монолитные стены высотой 10%">Ряд</button>
        <button data-wm="auto" aria-pressed="true" title="Внешние стены квартиры убираются, когда камера снаружи">Разрез</button>
        <button data-wm="skeleton" aria-pressed="false">Скелет</button>
        <button data-wm="outline" aria-pressed="false">Контуры</button>
      </div>
      <div class="field" style="margin-top:10px"><label for="Wh">Высота стен</label><output id="oWh"></output><input type="range" id="Wh" min="5" max="100" step="5"></div>
      <h3>Двери</h3>
      <div class="seg" role="group" aria-label="Двери">
        <button data-dm="none" aria-pressed="false">Без дверей</button>
        <button data-dm="closed" aria-pressed="true">Закрыты</button>
        <button data-dm="open" aria-pressed="false">Открыты</button>
      </div>
      <div class="toggles">
        <label><input type="checkbox" id="tDims" checked> Размеры</label>
        <label><input type="checkbox" id="tNames" checked> Названия комнат</label>
        <label><input type="checkbox" id="tFloors" checked> Цвет пола по комнатам</label>
      </div>
      <h3>Камера</h3>
      <div class="views">
        <button class="btn" data-view="plan" title="Весь план сверху со стороны кухни">План</button>
        <button class="btn" data-view="top">Сверху</button>
        <button class="btn" data-view="entry" title="Со стороны входной двери">От входа</button>
        <button class="btn" data-view="hall">Прихожая</button>
        <button class="btn" data-view="bath">Санузел</button>
        <button class="btn" data-view="kitchen">Кухня</button>
      </div>
    </div>

    <div>
      <h2>Что заложено, мм</h2>
      <div id="facts"></div>
    </div>

    <div>
      <h2>Нужно уточнить</h2>
      <ol class="qs">
        <li>Кухонная стена выступает на 200 мм — считаю от лицевой стороны стены прихожей (со стороны прихожей). Верно?</li>
        <li>Правая стена прихожей продолжается прямо вдоль прохода у кухни; кухня справа открыта в проход, низ плана открыт.</li>
      </ol>
    </div>
  </aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const MM=.001, H=2600;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- plan, mm ----------
   x → right, z → from the entrance door toward the kitchen (top view: entrance at the top, kitchen at the bottom).
   origin: inner corner of the hall between the bearing wall with the entrance door and the hall's left wall */
const A={
  hallW:1200,                       // hall between its side walls
  hL1:650, bDoor:600, bDoorH:2000, hL2:650,   // hall left wall: wall, bathroom doorway, wall up to the kitchen wall
  kOver:200,                        // kitchen wall runs this far past the hall side of the hall's left wall
  kW:2200, kL:1350,                 // kitchen back wall and kitchen left wall (as in the kitchen tab)
  bNiche:1200, bRight:600,          // bathroom along its back wall: toilet niche, 100 mm partition, then 600
  bL:1100, bWs:500, bStub:600,      // bath tab: niche depth, wall at the niche end, partition stub next to the tall cabinet
  vOff:150,                         // vent shaft wall: this far from the kitchen-side edge of the bathroom doorway
  bear:200, wt:100,                 // outer bearing walls of the apartment (entrance + bathroom back, bathroom/kitchen left), inner walls
  eD0:84, eD1:976, eDH:2016         // entrance door opening (as in the hall tab)
};
const hLen=A.hL1+A.bDoor+A.hL2;      // hall left wall up to the kitchen wall
const kZ0=hLen, kZ1=hLen+A.wt;       // kitchen wall (bathroom side, kitchen side)
const xL=A.kOver-A.kW;               // inner face of the common left wall
const xB1=-A.wt;                     // bathroom side of the hall's left wall
const zB0=0;                         // the bathroom back wall continues the hall bearing wall
const zEnd=kZ1+A.kL;
const zV0=A.hL1+A.bDoor+A.vOff;       // vent shaft wall (bathroom side); the shaft runs from it to the kitchen wall
                 // the plan stops where the kitchen's left wall ends
const bx=v=>xL+v, bz=v=>zB0+v;       // bath tab coordinates → plan

// walls: rect [x0,x1,z0,z1]; ext: outer side of an outside wall; holes along the long side: [from, to, height]
const WALLS=[
  {name:'Несущая стена: вход и санузел',r:[xL-A.bear,A.hallW+A.bear,-A.bear,0],ext:'-z',holes:[[A.eD0,A.eD1,A.eDH]]},
  {name:'Правая стена прихожей (внешняя)',r:[A.hallW,A.hallW+A.bear,0,zEnd],ext:'+x'},
  {name:'Несущая левая стена: санузел и кухня',r:[xL-A.bear,xL,0,zEnd],ext:'-x'},
  {name:'Стена прихожая / санузел',r:[xB1,0,0,hLen],holes:[[A.hL1,A.hL1+A.bDoor,A.bDoorH]]},
  {name:'Стена кухни',r:[xL,A.kOver,kZ0,kZ1]},
  {name:'Стенка справа от прохода на кухню',r:[A.hallW-A.kOver,A.hallW,kZ0,kZ1]},   // mirrors the kitchen wall end: the passage gets 200 mm on both sides
  {name:'Перегородка у пенала',r:[bx(A.bNiche),bx(A.bNiche+A.wt),zB0,bz(A.bStub)]},
  {name:'Стенка в конце ниши',r:[xL,bx(A.bWs),bz(A.bL),bz(A.bL+A.wt)]},
  {name:'Стенка между душем и раковиной',r:[bx(A.bWs+500),bx(A.bWs+500+A.wt),bz(A.bL),kZ0]},   // from the niche end down to the kitchen wall
  {name:'Стенка вентшахты',r:[bx(A.bWs+500+A.wt),xB1,zV0,zV0+A.wt]},   // closes the shaft between the partition, the hall wall and the kitchen wall
  {name:'Канализационный короб',r:[xL,bx(250),zB0,bz(250)]}
];
const ROOMS=[
  {name:'Прихожая',r:[0,A.hallW,0,zEnd],col:'--fl-hall',at:[A.hallW/2,hLen/2+150]},
  {name:'Санузел',r:[xL,xB1,zB0,kZ0],col:'--fl-bath',at:[(bx(A.bWs+500)+xB1)/2-150,(bz(A.bStub)+bz(A.bL))/2+40]},   // open middle of the room, clear of all walls
  {name:'Кухня',r:[xL,0,kZ1,zEnd],col:'--fl-kit',at:[(xL+A.kOver)/2,(kZ1+zEnd)/2]}
];
const BOX={x0:xL-A.bear,x1:A.hallW+A.bear,z0:-A.bear,z1:zEnd};
const CX=(BOX.x0+BOX.x1)/2*MM, CZ=(BOX.z0+BOX.z1)/2*MM;

/* ---------- three setup ---------- */
const canvas=document.getElementById('c'), viewer=document.getElementById('viewer');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(35,1,0.01,200);
scene.add(new THREE.HemisphereLight(0xffffff,0x8a7f70,0.9));
const sun=new THREE.DirectionalLight(0xffffff,0.7);
sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.bias=-0.0005;
Object.assign(sun.shadow.camera,{left:-4,right:4,top:4,bottom:-4,near:.5,far:30});
sun.target.position.set(CX,0,CZ);sun.position.set(CX-2,9,CZ+3);   // high sun: short shadows that do not cover the plan
scene.add(sun);scene.add(sun.target);

const floorMat=new THREE.MeshStandardMaterial({roughness:.95});
const wallMat=new THREE.MeshStandardMaterial({roughness:.95,side:THREE.DoubleSide});
const capMat=new THREE.MeshStandardMaterial({color:0x5b5f61,roughness:.9,side:THREE.DoubleSide});   // cut top of the walls, like the poché on a drawing
const edgeMat=new THREE.LineBasicMaterial({color:0x4a4d50,transparent:true,opacity:.35});
const footMat=new THREE.MeshBasicMaterial({color:0x3b3d3f,polygonOffset:true,polygonOffsetFactor:-2});
const floor=new THREE.Mesh(new THREE.PlaneGeometry(30,30),floorMat);
floor.rotation.x=-Math.PI/2;floor.position.set(CX,-.002,CZ);floor.receiveShadow=true;scene.add(floor);   // outer walls and the entrance door cast their shadows outside the apartment

/* room floors */
const roomGroup=new THREE.Group();scene.add(roomGroup);
const roomMats=ROOMS.map(r=>{
  const m=new THREE.MeshStandardMaterial({roughness:.9});
  const p=new THREE.Mesh(new THREE.PlaneGeometry((r.r[1]-r.r[0])*MM,(r.r[3]-r.r[2])*MM),m);
  p.rotation.x=-Math.PI/2;p.position.set((r.r[0]+r.r[1])/2*MM,0,(r.r[2]+r.r[3])/2*MM);p.receiveShadow=true;roomGroup.add(p);return m;});

/* room names lying on the floor */
const namesGroup=new THREE.Group();scene.add(namesGroup);
const nameTexts=[];
function floorText(text,x,z,h){
  const c=document.createElement('canvas'),g=c.getContext('2d'),f=96;
  g.font=`400 ${f}px "Tenor Sans", Georgia, serif`;const w=Math.ceil(g.measureText(text).width)+24;
  c.width=w;c.height=f+30;
  const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=8;
  const m=new THREE.Mesh(new THREE.PlaneGeometry(h*w/c.height,h),new THREE.MeshBasicMaterial({map:t,transparent:true,depthWrite:false}));
  m.rotation.x=-Math.PI/2;m.position.set(x*MM,.004,z*MM);m.renderOrder=2;namesGroup.add(m);
  nameTexts.push({c,g,t,text,f});
}
function paintNames(){
  const col=css('--fg');
  nameTexts.forEach(n=>{n.g.clearRect(0,0,n.c.width,n.c.height);n.g.font=`400 ${n.f}px "Tenor Sans", Georgia, serif`;
    n.g.fillStyle=col;n.g.globalAlpha=.55;n.g.textBaseline='middle';n.g.fillText(n.text,12,n.c.height/2+4);n.t.needsUpdate=true;});
}
ROOMS.forEach(r=>floorText(r.name,r.at[0],r.at[1],.2));

/* ---------- walls ---------- */
let wallGroup=null, wallParts=[];   // {m: wall mesh, f: () => visible in "cut" mode}
const doors=[];                     // {g: hinge pivot, h: leaf height, t: target angle, a: angle, max}
let arcs=null;
function buildWalls(){
  wallGroup=new THREE.Group();wallParts=[];
  const solid=(x0,x1,y0,y1,z0,z1,f)=>{
    const g=new THREE.BoxGeometry((x1-x0)*MM,(y1-y0)*MM,(z1-z0)*MM);
    const m=new THREE.Mesh(g,[wallMat,wallMat,capMat,wallMat,wallMat,wallMat]);
    m.position.set((x0+x1)/2*MM,(y0+y1)/2*MM,(z0+z1)/2*MM);m.castShadow=m.receiveShadow=true;
    const e=new THREE.LineSegments(new THREE.EdgesGeometry(g),edgeMat);e.raycast=()=>{};m.add(e);
    wallGroup.add(m);wallParts.push({m,f,b:y0*MM,t:y1*MM,h:(y1-y0)*MM});
  };
  const foot=(x0,x1,z0,z1)=>{const m=new THREE.Mesh(new THREE.PlaneGeometry((x1-x0)*MM,(z1-z0)*MM),footMat);m.rotation.x=-Math.PI/2;m.position.set((x0+x1)/2*MM,.002,(z0+z1)/2*MM);m.renderOrder=1;wallGroup.add(m);};
  WALLS.forEach(w=>{
    const [x0,x1,z0,z1]=w.r,alongX=(x1-x0)>=(z1-z0),f=wallRule(w);
    // split the wall along its long side: full-height pieces between openings, a lintel over each opening
    let cur=alongX?x0:z0;const end=alongX?x1:z1;
    const piece=(a,b,y0)=>{if(b-a<1)return;
      if(alongX)solid(a,b,y0,H,z0,z1,f);else solid(x0,x1,y0,H,a,b,f);
      if(y0===0){if(alongX)foot(a,b,z0,z1);else foot(x0,x1,a,b);}};
    (w.holes||[]).forEach(([a,b,h])=>{piece(cur,a,0);piece(a,b,h);cur=b;});
    piece(cur,end,0);
  });
  scene.add(wallGroup);
}
// "cut" mode: only the outer walls of the apartment hide, each while the camera looks at it from outside; inner walls always stay
function wallRule(w){
  const r=w.r.map(v=>v*MM),c=camera.position;
  if(!w.ext)return ()=>true;
  return {'-x':()=>c.x>r[1],'+x':()=>c.x<r[0],'-z':()=>c.z>r[3],'+z':()=>c.z<r[2]}[w.ext];
}

/* doors. Entrance: as in the hall tab — dark metal frame set 100 mm into the bearing wall from the hall side,
   leaf hinged on the left, opening outward to the stairs, a handle on each side.
   Bathroom: hinged at the entrance end, opens into the hall left to right. */
const frameMat=new THREE.MeshStandardMaterial({color:0x34383b,roughness:.5,metalness:.3});
const entMat=new THREE.MeshStandardMaterial({color:0x4a4f52,roughness:.45,metalness:.35});
const handleMat=new THREE.MeshStandardMaterial({color:0xb9b9b5,metalness:.9,roughness:.25});
const leafMat=new THREE.MeshStandardMaterial({color:0xf1efea,roughness:.6});
const doorGroup=new THREE.Group();scene.add(doorGroup);
function door(px,pz,size,pos,mat,max){
  const g=new THREE.Group();g.position.set(px*MM,0,pz*MM);
  const m=new THREE.Mesh(new THREE.BoxGeometry(...size.map(v=>v*MM)),mat);m.position.set(...pos.map(v=>v*MM));m.castShadow=m.receiveShadow=true;
  m.add(new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry),edgeMat));
  g.add(m);doorGroup.add(g);const d={g,h:size[1]*MM,t:0,a:0,max};doors.push(d);return d;
}
const EF=50,ED=70,EZ=-100;   // entrance frame: bar width, bar depth, hall-side face of the frame (100 mm into the wall)
const eLw=A.eD1-A.eD0-2*EF-6, eLh=A.eDH-EF-10;   // entrance leaf inside the frame
{ const ent=door(A.eD0+EF+3,EZ-ED,[eLw,eLh,ED],[eLw/2,eLh/2+5,ED/2],entMat,1.75);
  [ED+20,-20].forEach(z=>{const hd=new THREE.Mesh(new THREE.BoxGeometry(.14,.025,.03),handleMat);hd.position.set((eLw-120)*MM,1.0,z*MM);hd.castShadow=true;ent.g.add(hd);});
  const fr=new THREE.Group();doorGroup.add(fr);ent.frame=fr;
  const bar=(x0,x1,y0,y1)=>{const m=new THREE.Mesh(new THREE.BoxGeometry((x1-x0)*MM,(y1-y0)*MM,ED*MM),frameMat);
    m.position.set((x0+x1)/2*MM,(y0+y1)/2*MM,(EZ-ED/2)*MM);m.castShadow=m.receiveShadow=true;fr.add(m);};
  bar(A.eD0,A.eD0+EF,0,A.eDH);bar(A.eD1-EF,A.eD1,0,A.eDH);bar(A.eD0+EF,A.eD1-EF,A.eDH-EF,A.eDH);

/* ---------- view settings, remembered in this browser ---------- */
const VKEY='apt-plan-view-v1';

// doors segment: all open, all closed, or nothing pressed when the doors differ

/* ---------- orbit ---------- */
const cam={theta:-.5,phi:.9,r:8,target:new THREE.Vector3(CX,0,CZ)};
const goal={theta:-.5,phi:.9,r:8};
const goalT=new THREE.Vector3(CX,0,CZ);
// distance at which the whole apartment fits the frame from straight above
function fitR(){
  const t=Math.tan(camera.fov*Math.PI/360),w=(BOX.x1-BOX.x0)*MM,d=(BOX.z1-BOX.z0)*MM;
  return Math.max(d/2/t,w/2/(t*(camera.aspect||1)))*1.12+H*MM;   // + wall height: the wall tops are that much closer to the camera
}
function setView(v){
  const f=fitR();
  const views={
    plan:[0,.4,f*1.2,CX,0,CZ-.3],   // whole plan from above, tilted from the kitchen side
    top:[0,.0005,f,CX,0,CZ],
    entry:[Math.PI-.4,.7,f*1.05,CX,0,CZ],
    hall:[1.2,.85,f*.7,A.hallW/2*MM,.6,hLen/2*MM],   // through the outer right wall, facing the bathroom door
    bath:[.4,.34,f*.62,bx(450)*MM,.9,bz(300)*MM],   // the corner with the installation (left wall) and the tall cabinet (back wall)
    kitchen:[.55,.5,f*.78,(xL+A.kOver)/2*MM-.1,.6,(kZ1+300)*MM]   // the worktop wall and the left wall, from the passage side
  };
  const s=views[v];goal.theta=s[0];goal.phi=s[1];goal.r=s[2];goalT.set(s[3],s[4],s[5]);
  // take the short way round
  while(goal.theta-cam.theta>Math.PI)goal.theta-=2*Math.PI;
  while(cam.theta-goal.theta>Math.PI)goal.theta+=2*Math.PI;
}
const ptrs=new Map();let pinch0=0;
const _r=new THREE.Vector3(),_u=new THREE.Vector3();
function pan(dx,dy){
  const k=2*cam.r*Math.tan(camera.fov*Math.PI/360)/viewer.clientHeight;
  _r.setFromMatrixColumn(camera.matrixWorld,0);_u.setFromMatrixColumn(camera.matrixWorld,1);
  cam.target.addScaledVector(_r,-dx*k).addScaledVector(_u,dy*k);goalT.copy(cam.target);
}
let downAt=null;
// long press on a door moves it gradually: closed → opens, fully open → closes, part-open → reverses the last direction
const HOLD_MS=500,HOLD_RATE=60*Math.PI/180;let held=null,holdTimer=null;
canvas.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse'&&e.button!==0&&e.button!==1&&e.button!==2)return;
  downAt=e.button===0&&!e.shiftKey&&ptrs.size===0?{x:e.clientX,y:e.clientY}:null;
  clearTimeout(holdTimer);
  if(downAt){const d0=downAt;holdTimer=setTimeout(()=>{
    if(downAt!==d0||ptrs.size>1)return;
    const d=pickDoor({clientX:d0.x,clientY:d0.y});if(!d)return;
    const dir=d.a<=.01?1:d.a>=d.max-.01?-1:-(d.last||-1);d.last=dir;held={d,dir};d.t=d.a;canvas.style.cursor='grabbing';
  },HOLD_MS);}

  canvas.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY,pan:e.button===1||e.button===2});
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch0=Math.hypot(a.x-b.x,a.y-b.y);}
});
canvas.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;const pr=ptrs.get(e.pointerId),dx=e.clientX-pr.x,dy=e.clientY-pr.y;
  if(!held&&downAt&&Math.hypot(e.clientX-downAt.x,e.clientY-downAt.y)>=6)clearTimeout(holdTimer);
  if(held){ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY,pan:pr.pan});return;}
  if(ptrs.size===1){
    if(e.shiftKey||pr.pan)pan(dx,dy);
    else{goal.theta-=dx*.006;goal.phi=Math.min(1.62,Math.max(.0005,goal.phi-dy*.006));}
    ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY,pan:pr.pan});
  }else if(ptrs.size===2){
    ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    pan(dx/2,dy/2);
    const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);if(pinch0){goal.r=Math.min(30,Math.max(0.3,goal.r*pinch0/d));}pinch0=d;
  }
});
const lost=e=>{ptrs.delete(e.pointerId);pinch0=0;};
// a click (no drag) on a door leaf opens or closes that door
function pickDoor(e){
  const rc=canvas.getBoundingClientRect();
  ndc.set((e.clientX-rc.left)/rc.width*2-1,-(e.clientY-rc.top)/rc.height*2+1);
  ray.setFromCamera(ndc,camera);
  const h=ray.intersectObjects(scene.children,true).find(h=>!(h.object.isLine||h.object.isSprite)&&shown(h.object));
  if(!h)return null;
  // the leaf, its handles or the entrance frame
  for(let o=h.object;o;o=o.parent){const d=doors.find(d=>d.g===o||d.frame===o);if(d)return d;}
  return null;
}
canvas.addEventListener('pointerup',e=>{
  clearTimeout(holdTimer);
  if(held){held=null;canvas.style.cursor='';syncDoorSeg();saveV();downAt=null;lost(e);return;}
  if(downAt&&ptrs.size===1&&Math.hypot(e.clientX-downAt.x,e.clientY-downAt.y)<6){
    const d=pickDoor(e);if(d){d.t=d.t!==0?0:d.max;syncDoorSeg();saveV();}
  }
  downAt=null;lost(e);
});
canvas.addEventListener('pointermove',e=>{if(ptrs.size===0)canvas.style.cursor=pickDoor(e)?'pointer':'';});canvas.addEventListener('pointercancel',lost);canvas.addEventListener('lostpointercapture',lost);
canvas.addEventListener('mousedown',e=>{if(e.button===1)e.preventDefault();});
canvas.addEventListener('contextmenu',e=>e.preventDefault());
// wheel zooms toward the point under the cursor (surface hit, or the plane through the pivot)
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();
const _zp=new THREE.Vector3(),_pl=new THREE.Plane(),_n=new THREE.Vector3();
const shown=o=>{while(o){if(!o.visible)return false;o=o.parent;}return true;};
canvas.addEventListener('wheel',e=>{
  e.preventDefault();

  const rc=canvas.getBoundingClientRect();
  ndc.set((e.clientX-rc.left)/rc.width*2-1,-(e.clientY-rc.top)/rc.height*2+1);
  ray.setFromCamera(ndc,camera);
  const hit=ray.intersectObjects(scene.children,true).find(h=>!(h.object.isLine||h.object.isSprite)&&shown(h.object));
  if(hit)_zp.copy(hit.point);
  else{camera.getWorldDirection(_n);_pl.setFromNormalAndCoplanarPoint(_n,cam.target);if(!ray.ray.intersectPlane(_pl,_zp))_zp.copy(cam.target);}
  cam.target.lerp(_zp,1-r1/r0);goalT.copy(cam.target);

},{passive:false});
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));

function resize(){const w=viewer.clientWidth,h=viewer.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
new ResizeObserver(resize).observe(viewer);

/* ---------- render loop ---------- */
const _v=new THREE.Vector3(),_d=new THREE.Vector3();
let lastT=performance.now();
function loop(){
  const now=performance.now(),dt=Math.min(.1,(now-lastT)/1000);lastT=now;
  const ease=f=>reduce?1:1-Math.pow(1-f,dt*120);
  const k=ease(.14);
  cam.theta+=(goal.theta-cam.theta)*k;cam.phi+=(goal.phi-cam.phi)*k;cam.r+=(goal.r-cam.r)*k;
  cam.target.lerp(goalT,k);
  const sp=Math.sin(cam.phi);
  _d.set(sp*Math.sin(cam.theta),Math.cos(cam.phi),sp*Math.cos(cam.theta));
  camera.position.copy(cam.target).addScaledVector(_d,cam.r);camera.lookAt(cam.target);camera.updateMatrixWorld();
  // walls are cut at the chosen share of the ceiling height (bottom stays on the floor)
  { const row=V.Wm==='row',skel=V.Wm==='skeleton',outline=V.Wm==='outline';
    const cut=H*MM*(row?10:V.Wh)/100;
    const op=skel?0:1,tr=op<.999;
    [wallMat,capMat].forEach(m=>{m.opacity=op;if(m.transparent!==tr){m.transparent=tr;m.depthWrite=!tr;m.needsUpdate=true;}});
    edgeMat.opacity=skel?.9:.35;
    wallParts.forEach(w=>{
      const top=Math.min(w.t,cut),fits=top>w.b+.001;
      w.m.visible=fits&&!outline&&(V.Wm==='auto'?w.f():true);
      w.m.castShadow=!skel;
      if(fits){w.m.scale.y=(top-w.b)/w.h;w.m.position.y=w.b+(top-w.b)/2;}
    });
    doors.forEach(d=>{
      if(held&&held.d===d){d.t=Math.min(d.max,Math.max(0,d.t+held.dir*HOLD_RATE*dt));d.a=d.t;}
      else d.a+=(d.t-d.a)*ease(.07);
      d.g.rotation.y=d.a;d.g.scale.y=Math.max(.001,Math.min(1,cut/d.h));if(d.frame)d.frame.scale.y=d.g.scale.y;});
    doorGroup.visible=V.dm!=='none'&&!outline;arcs.visible=V.dm!=='none';
    dimsGroup.position.y=(outline?0:Math.min(cut,H*MM))+.02;
  }
  // dimension labels keep the same size on screen at any zoom
  { const k=2*Math.tan(camera.fov*Math.PI/360)/(viewer.clientHeight||1);
    labels.forEach(s=>{s.getWorldPosition(_v);const u=_v.distanceTo(camera.position)*k;s.scale.set(19*u*s.userData.ar,19*u,1);}); }
  renderer.render(scene,camera);
  requestAnimationFrame(loop);
}

document.getElementById('sub').textContent=`${(BOX.x1-BOX.x0)} × ${(BOX.z1-BOX.z0)} мм по внешним стенам · потолок ${H}`;

infoBtn.addEventListener('click',()=>infoBtn.setAttribute('aria-expanded',infoBtn.getAttribute('aria-expanded')!=='true'));

buildWalls();if(V.dm!=='none')doors.forEach(d=>d.t=V.dm==='open'?d.max:0);syncUI();applyTheme();resize();

})();
